<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="showcase" data-scheme="auto" data-motion="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>کاتالوگ دیجیتال با HTML: نمایش قابلیت‌ها</title>
<meta name="description" content="شانزده قابلیت HTML، CSS و JavaScript برای کاتالوگ دیجیتال، هر کدام زنده و قابل امتحان: فیلتر، زوم، ویدیو، چرخش، مقایسه، ورق‌زدن، روایت اسکرولی، جدول، دیالوگ، حالت تیره، چاپ و دسترس‌پذیری.">
<style>
/* inlined from shared/ds-core.css */
/* ============================================================
   Catalog Design System — core tokens, 8 themes, components
   Extracted from "سیستم طراحی کاتالوگ دیجیتال v1".
   Fonts load from Google Fonts; every family has a system fallback,
   so the file still renders offline.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@400;500;700;800&family=Markazi+Text:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Space+Grotesk:wght@400;500;700&family=Vazirmatn:wght@300;400;500;700;900&display=swap');

:root {
  /* خانواده‌های پایه — تم‌ها این‌ها را روی نقش‌ها می‌نشانند */
  --fam-vazir: "Vazirmatn", system-ui, sans-serif;
  --fam-naskh: "Noto Naskh Arabic", "Vazirmatn", serif;
  --fam-kufi: "Noto Kufi Arabic", "Vazirmatn", sans-serif;
  --fam-markazi: "Markazi Text", "Noto Naskh Arabic", serif;
  --fam-newsreader: "Newsreader", Georgia, serif;
  --fam-cormorant: "Cormorant Garamond", Georgia, serif;
  --fam-grotesk: "Space Grotesk", "Helvetica Neue", sans-serif;
  --fam-archivo: "Archivo", "Helvetica Neue", sans-serif;
  --fam-manrope: "Manrope", "Helvetica Neue", sans-serif;
  --fam-sourceserif: "Source Serif 4", Georgia, serif;
  --fam-plex: "IBM Plex Sans", "Helvetica Neue", sans-serif;
  --fam-plexmono: "IBM Plex Mono", ui-monospace, monospace;
}

/* پالت پایه و نام‌های معنایی. مقدارها با oklch نوشته شده‌اند تا هم‌خانواده بمانند.
   قاعده: هیچ کامپوننتی رنگ خام ننویسد — فقط نام معنایی. */
:root {
  /* خنثی‌های گرم (پیش‌فرض ادیتوریال) */
  --n-00: oklch(0.99 0.004 85);
  --n-05: oklch(0.975 0.005 85);
  --n-10: oklch(0.945 0.006 85);
  --n-20: oklch(0.90 0.007 85);
  --n-30: oklch(0.80 0.008 85);
  --n-50: oklch(0.62 0.009 85);
  --n-70: oklch(0.44 0.010 85);
  --n-85: oklch(0.28 0.010 80);
  --n-95: oklch(0.17 0.010 80);
  --n-100: oklch(0.12 0.008 80);

  /* نقش‌های معنایی — تم پیش‌فرض: editorial */
  --bg: var(--n-05);
  --bg-alt: var(--n-00);
  --surface: var(--n-00);
  --surface-alt: var(--n-10);
  --ink: var(--n-95);
  --ink-muted: var(--n-70);
  --ink-faint: var(--n-50);
  --line: oklch(0.88 0.006 85);
  --line-strong: var(--n-85);
  --accent: oklch(0.52 0.12 42);
  --accent-soft: oklch(0.94 0.03 42);
  --on-accent: oklch(0.99 0.004 85);
  --focus: oklch(0.55 0.15 250);
  --overlay: oklch(0.17 0.01 80 / 0.55);

  /* وضعیت‌ها — فقط همین سه؛ رنگ‌های معنایی بیشتری اضافه نکن */
  --ok: oklch(0.55 0.10 150);
  --warn: oklch(0.70 0.13 75);
  --danger: oklch(0.53 0.15 25);
}

/* تایپوگرافی دوزبانه. دو محور جدا: fa (فارسی/RTL) و en (لاتین/LTR).
   قاعده‌ی سخت: line-height فارسی همیشه بلندتر از لاتین؛ letter-spacing روی فارسی صفر. */
:root {
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-grotesk);
  --font-num: var(--fam-plexmono);

  /* مقیاس سیال — یک مقیاس برای هر دو زبان */
  --t-xs: clamp(0.72rem, 0.70rem + 0.15vw, 0.80rem);
  --t-sm: clamp(0.82rem, 0.79rem + 0.2vw, 0.92rem);
  --t-base: clamp(0.95rem, 0.90rem + 0.25vw, 1.06rem);
  --t-md: clamp(1.10rem, 1.02rem + 0.4vw, 1.30rem);
  --t-lg: clamp(1.35rem, 1.18rem + 0.8vw, 1.75rem);
  --t-xl: clamp(1.75rem, 1.40rem + 1.6vw, 2.60rem);
  --t-2xl: clamp(2.30rem, 1.70rem + 2.8vw, 3.80rem);
  --t-3xl: clamp(3.00rem, 2.00rem + 4.6vw, 5.60rem);

  --lh-fa-tight: 1.42;
  --lh-fa-body: 1.85;
  --lh-en-tight: 1.10;
  --lh-en-body: 1.55;

  --w-light: 300;
  --w-regular: 400;
  --w-medium: 500;
  --w-bold: 700;
  --w-black: 900;

  --tracking-fa: 0;
  --tracking-en: 0.01em;
  --tracking-en-caps: 0.10em;

  /* حداکثر عرض خط خوانا */
  --measure-fa: 62ch;
  --measure-en: 70ch;
}

/* فاصله، شبکه، گوشه، خط. مقیاس ۴ پایه اما مقدارهای واقعی طراحی — گرد نکن. */
:root {
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;
  --s-10: 128px;

  --gutter: var(--s-5);
  --page-pad: clamp(20px, 4vw, 72px);
  --page-max: 1360px;
  --col-min: 268px;          /* حداقل عرض کارت محصول در شبکه‌ی سیال */

  --radius-none: 0px;
  --radius-media: 2px;
  --radius-card: 4px;
  --radius-control: 4px;
  --radius-pill: 999px;

  --border-w: 1px;
  --border-w-strong: 2px;

  --shadow-1: 0 1px 2px oklch(0.17 0.01 80 / 0.06);
  --shadow-2: 0 10px 30px -12px oklch(0.17 0.01 80 / 0.18);
  --shadow-lift: 0 18px 44px -18px oklch(0.17 0.01 80 / 0.28);

  --ratio-media: 4 / 5;      /* نسبت پیش‌فرض عکس محصول */
  --ratio-cover: 3 / 4;      /* کاور کاتالوگ */
  --ratio-spread: 3 / 2;     /* صفحه‌ی باز کاتالوگ */
  --tap-min: 44px;           /* حداقل هدف لمسی — هرگز کمتر */
}

/* حرکت. هر انیمیشنی که می‌سازی باید از همین توکن‌ها استفاده کند.
   قاعده: فقط transform و opacity انیمیت می‌شوند. width/height/top/left هرگز. */
:root {
  --dur-instant: 90ms;
  --dur-fast: 160ms;
  --dur-base: 240ms;
  --dur-slow: 420ms;
  --dur-page: 560ms;

  --ease-out: cubic-bezier(0.20, 0.80, 0.25, 1);
  --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-soft: cubic-bezier(0.34, 1.12, 0.64, 1);

  --hover-lift: -2px;
  --hover-media-scale: 1.03;
  --press-scale: 0.985;
  --stagger: 45ms;           /* فاصله‌ی ورود کارت‌های پشت‌سرهم؛ حداکثر ۸ کارت */
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-instant: 1ms;
    --dur-fast: 1ms;
    --dur-base: 1ms;
    --dur-slow: 1ms;
    --dur-page: 1ms;
    --hover-lift: 0px;
    --hover-media-scale: 1;
    --press-scale: 1;
    --stagger: 0ms;
  }
}

/* ۸ تم. یک تم = یک بار عوض کردن data-theme روی ریشه. هیچ کامپوننتی تم‌آگاه نیست.
   استفاده: <div data-theme="luxe"> … </div>  یا  <html data-theme="spec"> */

/* ۱. editorial — مینیمال مجله‌ای؛ فضای سفید زیاد، تایپ سریف لاتین، شبکه‌ی نامتقارن */
[data-theme="editorial"] {
  --bg: oklch(0.975 0.005 85);
  --bg-alt: oklch(0.99 0.004 85);
  --surface: oklch(0.99 0.004 85);
  --surface-alt: oklch(0.945 0.006 85);
  --ink: oklch(0.17 0.010 80);
  --ink-muted: oklch(0.44 0.010 85);
  --ink-faint: oklch(0.62 0.009 85);
  --line: oklch(0.88 0.006 85);
  --line-strong: oklch(0.28 0.010 80);
  --accent: oklch(0.52 0.12 42);
  --accent-soft: oklch(0.94 0.03 42);
  --on-accent: oklch(0.99 0.004 85);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-grotesk);
  --radius-media: 2px; --radius-card: 3px; --radius-control: 3px;
  --border-w: 1px;
  --shadow-1: 0 1px 2px oklch(0.17 0.01 80 / 0.05);
  --shadow-2: 0 12px 34px -16px oklch(0.17 0.01 80 / 0.16);
  --gutter: 28px;
}

/* ۲. luxe — تیره و طلایی؛ کم‌نور، فاصله‌ی زیاد، حرکت کند */
[data-theme="luxe"] {
  --bg: oklch(0.16 0.012 60);
  --bg-alt: oklch(0.21 0.014 60);
  --surface: oklch(0.21 0.014 60);
  --surface-alt: oklch(0.26 0.016 60);
  --ink: oklch(0.96 0.010 85);
  --ink-muted: oklch(0.78 0.014 85);
  --ink-faint: oklch(0.62 0.014 85);
  --line: oklch(0.34 0.016 70);
  --line-strong: oklch(0.72 0.070 85);
  --accent: oklch(0.79 0.098 85);
  --accent-soft: oklch(0.30 0.030 85);
  --on-accent: oklch(0.16 0.012 60);
  --overlay: oklch(0.10 0.01 60 / 0.72);
  --font-fa-display: var(--fam-markazi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-cormorant);
  --font-en-ui: var(--fam-grotesk);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none;
  --shadow-2: 0 24px 60px -28px oklch(0 0 0 / 0.6);
  --shadow-lift: 0 30px 70px -30px oklch(0 0 0 / 0.7);
  --dur-base: 340ms; --dur-slow: 620ms; --dur-page: 820ms;
  --hover-media-scale: 1.045;
  --gutter: 40px;
  --tracking-en-caps: 0.18em;
}

/* ۳. brutal — نئوبروتال؛ کنتراست بیشینه، حاشیه‌ی ضخیم، سایه‌ی سخت، حرکت تند */
[data-theme="brutal"] {
  --bg: oklch(0.985 0 0);
  --bg-alt: oklch(0.93 0.14 100);
  --surface: oklch(1 0 0);
  --surface-alt: oklch(0.95 0.16 100);
  --ink: oklch(0.13 0 0);
  --ink-muted: oklch(0.33 0 0);
  --ink-faint: oklch(0.50 0 0);
  --line: oklch(0.13 0 0);
  --line-strong: oklch(0.13 0 0);
  --accent: oklch(0.55 0.21 25);
  --accent-soft: oklch(0.93 0.14 100);
  --on-accent: oklch(1 0 0);
  --font-fa-display: var(--fam-kufi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-archivo);
  --font-en-ui: var(--fam-archivo);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 2px; --border-w-strong: 3px;
  --shadow-1: 3px 3px 0 oklch(0.13 0 0);
  --shadow-2: 6px 6px 0 oklch(0.13 0 0);
  --shadow-lift: 9px 9px 0 oklch(0.13 0 0);
  --dur-fast: 100ms; --dur-base: 140ms; --dur-slow: 220ms; --dur-page: 300ms;
  --ease-out: cubic-bezier(0.2, 1, 0.3, 1);
  --hover-lift: -3px; --hover-media-scale: 1;
  --gutter: 20px;
}

/* ۴. glass — شیشه‌ای نرم؛ blur، لایه‌های شفاف، گوشه‌های نرم. blur فقط روی چیزی که واقعاً روی محتوا شنا می‌کند */
[data-theme="glass"] {
  --bg: oklch(0.96 0.012 250);
  --bg-alt: oklch(0.98 0.008 250);
  --surface: oklch(1 0 0 / 0.72);
  --surface-alt: oklch(1 0 0 / 0.45);
  --ink: oklch(0.24 0.020 260);
  --ink-muted: oklch(0.48 0.018 260);
  --ink-faint: oklch(0.63 0.016 260);
  --line: oklch(0.55 0.02 260 / 0.18);
  --line-strong: oklch(0.45 0.03 260 / 0.35);
  --accent: oklch(0.58 0.105 255);
  --accent-soft: oklch(0.92 0.035 255);
  --on-accent: oklch(0.99 0.005 255);
  --overlay: oklch(0.30 0.02 260 / 0.35);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-manrope);
  --font-en-ui: var(--fam-manrope);
  --radius-media: 14px; --radius-card: 18px; --radius-control: 12px;
  --border-w: 1px;
  --shadow-1: 0 2px 10px -4px oklch(0.30 0.02 260 / 0.18);
  --shadow-2: 0 20px 50px -22px oklch(0.30 0.02 260 / 0.28);
  --shadow-lift: 0 26px 60px -24px oklch(0.30 0.02 260 / 0.34);
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --gutter: 26px;
}

/* ۵. press — کاتالوگ چاپی کلاسیک؛ شبکه‌ی سخت، خطوط جداکننده، سریف، بدون سایه */
[data-theme="press"] {
  --bg: oklch(0.965 0.008 92);
  --bg-alt: oklch(0.985 0.006 92);
  --surface: oklch(0.985 0.006 92);
  --surface-alt: oklch(0.935 0.010 92);
  --ink: oklch(0.22 0.014 60);
  --ink-muted: oklch(0.45 0.014 60);
  --ink-faint: oklch(0.60 0.012 60);
  --line: oklch(0.22 0.014 60 / 0.28);
  --line-strong: oklch(0.22 0.014 60);
  --accent: oklch(0.46 0.13 26);
  --accent-soft: oklch(0.92 0.035 26);
  --on-accent: oklch(0.985 0.006 92);
  --font-fa-display: var(--fam-naskh);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-sourceserif);
  --font-en-ui: var(--fam-sourceserif);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none; --shadow-2: none; --shadow-lift: none;
  --hover-lift: 0px; --hover-media-scale: 1;
  --gutter: 0px;
}

/* ۶. spec — صنعتی و جدول‌محور؛ داده اول، مونواسپیس برای اعداد، رنگ هشدار صنعتی */
[data-theme="spec"] {
  --bg: oklch(0.955 0.004 230);
  --bg-alt: oklch(0.98 0.003 230);
  --surface: oklch(0.99 0.002 230);
  --surface-alt: oklch(0.93 0.006 230);
  --ink: oklch(0.21 0.012 245);
  --ink-muted: oklch(0.44 0.012 245);
  --ink-faint: oklch(0.60 0.010 245);
  --line: oklch(0.80 0.010 245);
  --line-strong: oklch(0.35 0.014 245);
  --accent: oklch(0.52 0.135 248);
  --accent-soft: oklch(0.93 0.030 248);
  --on-accent: oklch(0.99 0.002 230);
  --warn: oklch(0.66 0.165 48);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-plex);
  --font-en-ui: var(--fam-plex);
  --font-num: var(--fam-plexmono);
  --radius-media: 2px; --radius-card: 2px; --radius-control: 2px;
  --border-w: 1px;
  --shadow-1: 0 1px 0 oklch(0.35 0.014 245 / 0.10);
  --shadow-2: 0 8px 24px -14px oklch(0.35 0.014 245 / 0.25);
  --dur-base: 180ms;
  --hover-media-scale: 1;
  --gutter: 16px;
}

/* ۷. craft — گرم و خاکی؛ کاغذ کرم، رنگ خاک رس، تایپ نرم */
[data-theme="craft"] {
  --bg: oklch(0.935 0.022 78);
  --bg-alt: oklch(0.965 0.018 78);
  --surface: oklch(0.965 0.018 78);
  --surface-alt: oklch(0.895 0.028 76);
  --ink: oklch(0.27 0.030 52);
  --ink-muted: oklch(0.47 0.030 52);
  --ink-faint: oklch(0.62 0.026 52);
  --line: oklch(0.78 0.030 70);
  --line-strong: oklch(0.42 0.034 52);
  --accent: oklch(0.52 0.095 45);
  --accent-soft: oklch(0.90 0.040 45);
  --on-accent: oklch(0.975 0.015 78);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-newsreader);
  --radius-media: 6px; --radius-card: 10px; --radius-control: 8px;
  --border-w: 1px;
  --shadow-1: 0 1px 2px oklch(0.27 0.03 52 / 0.08);
  --shadow-2: 0 14px 32px -18px oklch(0.27 0.03 52 / 0.22);
  --ease-out: cubic-bezier(0.25, 0.9, 0.3, 1);
  --gutter: 24px;
}

/* ۸. mono — تک‌رنگ سیاه‌وسفید؛ تایپ بزرگ، بدون رنگ تزئینی، آکسان = مرکب */
[data-theme="mono"] {
  --bg: oklch(1 0 0);
  --bg-alt: oklch(0.96 0 0);
  --surface: oklch(1 0 0);
  --surface-alt: oklch(0.94 0 0);
  --ink: oklch(0.11 0 0);
  --ink-muted: oklch(0.38 0 0);
  --ink-faint: oklch(0.56 0 0);
  --line: oklch(0.80 0 0);
  --line-strong: oklch(0.11 0 0);
  --accent: oklch(0.11 0 0);
  --accent-soft: oklch(0.94 0 0);
  --on-accent: oklch(1 0 0);
  --overlay: oklch(0.11 0 0 / 0.80);
  --font-fa-display: var(--fam-kufi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-archivo);
  --font-en-ui: var(--fam-archivo);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none; --shadow-2: none; --shadow-lift: none;
  --hover-media-scale: 1.02;
  --gutter: 2px;
  --tracking-en-caps: 0.14em;
}

/* پایه‌ی سند. کامپوننت نیست — ریست و قواعد سراسری. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-fa-ui);
  font-size: var(--t-base);
  line-height: var(--lh-fa-body);
  letter-spacing: var(--tracking-fa);
  font-variant-numeric: tabular-nums;
  text-wrap: pretty;
}
[dir="ltr"], .en { font-family: var(--font-en-ui); line-height: var(--lh-en-body); letter-spacing: var(--tracking-en); }

  display: flex; align-items: center; gap: var(--s-2);
  width: min(var(--page-max), calc(100% - 2 * var(--page-pad)));
  min-height: var(--bar-h); margin: var(--bar-top) auto 0; padding: 6px 8px 6px 18px;
  background: color-mix(in oklab, var(--surface) 78%, transparent); backdrop-filter: blur(18px) saturate(1.4);
  border-radius: 999px; box-shadow: 0 1px 0 rgb(255 255 255 / 0.4) inset, 0 12px 32px -20px rgb(21 24 26 / 0.25);
}
[dir="ltr"] .bar { padding: 6px 18px 6px 8px; }
@supports not (backdrop-filter: blur(1px)) { .bar { background: var(--surface); } }
@media (prefers-reduced-transparency: reduce) { .bar { background: var(--surface); backdrop-filter: none; } }
.bar__mark { font-weight: var(--w-display); font-size: var(--t-md); letter-spacing: -0.02em; white-space: nowrap; }
.bar__sep { flex: 1; }
.bar .cat-btn, .bar .cat-chip, .seg > button { white-space: nowrap; }
.bar .cat-btn { min-height: 40px; }
.seg { display: inline-flex; padding: 3px; background: var(--shell); border-radius: 999px; }
.seg > button { min-height: 34px; padding: 0 var(--s-3); font: inherit; font-size: var(--t-sm); font-weight: 500; background: transparent; color: var(--ink-muted); border: 0; border-radius: 999px; cursor: pointer; transition: background var(--dur-base) var(--ease-apple), color var(--dur-base) var(--ease-apple); }
.seg > button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(21 24 26 / 0.12); }
.badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding-inline: 6px; font-size: var(--t-xs); font-weight: 600; line-height: 1; background: var(--accent); color: var(--on-accent); border-radius: 999px; }
.badge:empty { display: none; }
.only-wide { display: none; }
@media (min-width: 900px) { .only-wide { display: inline-flex; } .only-narrow { display: none; } }
.menu__settings { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); margin-block-end: var(--s-5); padding-block-end: var(--s-5); border-block-end: 1px solid var(--line); }

/* Design-system controls, restyled for this page: filled, pill, no
   hairline borders. */
.cat-chip { border-color: transparent; background: var(--shell); color: var(--ink-muted); font-weight: 500; transition: background var(--dur-base) var(--ease-apple), color var(--dur-base) var(--ease-apple), transform var(--dur-base) var(--ease-apple); }
.cat-chip:hover { background: var(--shell-strong); color: var(--ink); }
.cat-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.cat-chip:active, .cat-btn:active { transform: scale(0.98); }
.cat-btn { font-weight: 600; border-color: transparent; transition: transform var(--dur-base) var(--ease-apple), box-shadow var(--dur-base) var(--ease-apple), background var(--dur-base) var(--ease-apple); }
.cat-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -14px rgb(44 62 120 / 0.5); }
.cat-btn--ghost { background: var(--shell); color: var(--ink); }
.cat-btn--ghost:hover { background: var(--shell-strong); box-shadow: none; }
.cat-btn--quiet { background: transparent; color: var(--ink-muted); }
.cat-lang { border: 0; padding: 3px; background: var(--shell); }
.cat-lang > button { border-radius: 999px; font-weight: 500; transition: background var(--dur-base) var(--ease-apple), color var(--dur-base) var(--ease-apple); }
.cat-lang > button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(21 24 26 / 0.12); }
.cat-search { border-color: transparent; background: var(--shell); border-radius: 999px; padding-inline: var(--s-5); }
.cat-search:focus-within { background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.cat-swatch { border-color: transparent; background: var(--shell); }
.cat-swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.cat-scrim { background: var(--overlay); }

.shell { display: grid; grid-template-columns: minmax(0, 1fr); max-width: var(--page-max); margin-inline: auto; padding-inline: var(--page-pad); }
@media (min-width: 1100px) { .shell { grid-template-columns: 208px minmax(0, 1fr); column-gap: var(--s-9); } }
.toc { display: none; }
@media (min-width: 1100px) {
  .toc { display: block; position: sticky; inset-block-start: calc(var(--bar-h) + var(--bar-top) + var(--s-6)); align-self: start; max-height: calc(100vh - var(--bar-h) - var(--bar-top) - var(--s-8)); overflow: auto; padding-block: var(--s-6); scrollbar-width: none; }
}
.toc ol, .toc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a, .toc-list a { display: grid; grid-template-columns: 2.4ch 1fr; gap: var(--s-2); align-items: baseline; padding: 8px var(--s-3); font-size: var(--t-sm); font-weight: 500; color: var(--ink-muted); text-decoration: none; border-radius: 12px; transition: color var(--dur-base) var(--ease-apple), background var(--dur-base) var(--ease-apple); }
.toc a .n, .toc-list a .n { font-family: var(--font-num); font-size: var(--t-xs); color: var(--ink-faint); }
.toc a:hover, .toc-list a:hover { color: var(--ink); background: var(--shell); }
.toc a[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }
.toc a[aria-current="true"] .n { color: var(--accent); }

/* ── hero: an editorial split, type on the start side, the piece on
   the other, both rising on load ──────────────────────────── */
.hero { display: grid; gap: var(--s-8); grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); align-items: center; max-width: var(--page-max); margin-inline: auto; padding: clamp(56px, 8vw, 96px) var(--page-pad) clamp(40px, 6vw, 72px); }
.hero__inner { display: grid; gap: var(--s-5); align-content: center; }
.hero__kicker { font-size: var(--t-sm); font-weight: 600; color: var(--accent); }
.hero__title { font-size: clamp(2.5rem, 5vw, 4.4rem); font-weight: var(--w-display); line-height: 1.08; letter-spacing: -0.025em; max-width: 14ch; }
.hero__lede { margin: 0; font-size: var(--t-md); line-height: 1.8; color: var(--ink-muted); max-width: 40ch; }
.hero__cta { display: flex; flex-wrap: wrap; gap: var(--s-3); padding-block-start: var(--s-2); }
.hero__btn { display: inline-flex; align-items: center; gap: 14px; min-height: 54px; padding-inline: 24px 9px; border-radius: 999px; text-decoration: none; }
.hero__btn .ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; background: rgb(255 255 255 / 0.16); font-size: 18px; line-height: 1; transition: transform var(--dur-base) var(--ease-pop); }
.hero__btn:hover .ic { transform: translateY(3px); }
.hero__visual { position: relative; }
.hero__visual .tile { aspect-ratio: 4 / 5; max-height: min(72vh, 640px); }
.hero__visual .media { height: 100%; aspect-ratio: auto; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: var(--s-6); } .hero__title { max-width: 16ch; } .hero__visual .tile { aspect-ratio: 4 / 3; } }
/* Word-by-word rise on load; the visual follows. Scroll then pulls the
   type back as the first section arrives. */
.js .hero__title .w { display: inline-block; opacity: 0; transform: translateY(0.6em); animation: word-in 900ms var(--ease-apple) both; animation-delay: calc(80ms + var(--i, 0) * 55ms); }
.js .hero__kicker, .js .hero__lede, .js .hero__cta { opacity: 0; transform: translateY(18px); animation: rise-in 900ms var(--ease-apple) both; }
.js .hero__kicker { animation-delay: 0ms; } .js .hero__lede { animation-delay: 520ms; } .js .hero__cta { animation-delay: 640ms; }
.js .hero__visual { opacity: 0; transform: translateY(28px) scale(0.97); animation: tile-in 1100ms var(--ease-apple) 260ms both; }
@keyframes word-in { to { opacity: 1; transform: none; } }
@keyframes rise-in { to { opacity: 1; transform: none; } }
@keyframes tile-in { to { opacity: 1; transform: none; } }
@supports (animation-timeline: scroll()) {
  .js .hero__inner { animation: hero-out linear both; animation-timeline: scroll(root); animation-range: 0 60vh; }
}
@keyframes hero-out { to { opacity: 0.2; transform: translateY(-24px); } }

/* ── tiles: a picture sits in a tray ─────────────────────── */
.tile { padding: 6px; background: var(--shell); border-radius: var(--radius-card); box-shadow: var(--shadow-tile); transition: transform var(--dur-slow) var(--ease-apple), box-shadow var(--dur-slow) var(--ease-apple); }
.tile > .media, .tile > .cmp, .tile > .sw__stage, .tile > .story__frame, .tile > .study__frame, .tile > .book, .tile > picture, .tile > picture > img { border-radius: var(--radius-media); }
.lift:hover .tile, .tile.lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); }

/* ── sections ─────────────────────────────────────────────── */
.sec { padding-block: clamp(72px, 9vw, 120px); scroll-margin-block-start: calc(var(--bar-h) + var(--bar-top) + 16px); }
.sec__head { display: grid; gap: var(--s-4); justify-items: start; margin-block-end: var(--s-7); max-width: 64ch; }
.sec__no { display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding-inline: 12px; font-family: var(--font-num); font-size: var(--t-sm); font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; }
.sec__title { font-size: clamp(1.9rem, 3.4vw, 2.9rem); font-weight: var(--w-display); line-height: 1.12; letter-spacing: -0.02em; }
.sec__lede { margin: 0; font-size: var(--t-md); line-height: 1.75; color: var(--ink-muted); }
.tech { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }
.tech__k { font-size: var(--t-xs); font-weight: 600; color: var(--ink-faint); margin-inline-end: var(--s-1); }
.tech code { font-family: var(--font-num); font-size: var(--t-xs); padding: 5px 11px; border-radius: 999px; background: var(--shell); color: var(--ink-muted); direction: ltr; }

/* ── product atoms ────────────────────────────────────────── */
.media { position: relative; overflow: hidden; aspect-ratio: var(--ratio-media); background: var(--surface-alt); border-radius: var(--radius-media); }
.media--wide { aspect-ratio: 3 / 2; } .media--square { aspect-ratio: 1; } .media--tall { aspect-ratio: 2 / 3; }
.media--thumb { border-radius: 10px; }
@media (hover: hover) { .ck-cue { opacity: 0; } .ck-media:hover .ck-cue, .ck-media:focus-visible .ck-cue { opacity: 1; } }
.ck-cue { border-radius: 999px; }
.name { font-size: var(--t-lg); font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
.name--xl { font-size: var(--t-xl); letter-spacing: -0.02em; line-height: 1.15; }
.alt { font-family: var(--font-en-ui); font-size: var(--t-sm); color: var(--ink-faint); direction: ltr; text-align: right; }
[dir="ltr"] .alt { font-family: var(--font-fa-ui); direction: rtl; text-align: left; }
.copy { margin: 0; font-size: var(--t-base); color: var(--ink-muted); line-height: 1.85; max-width: var(--measure-fa); }
.copy--sm { font-size: var(--t-sm); }
.price { font-size: var(--t-md); font-weight: 600; color: var(--ink); }
.price small { font-size: var(--t-xs); font-weight: 500; color: var(--ink-faint); margin-inline-start: var(--s-1); }
.code { font-family: var(--font-num); font-size: var(--t-xs); color: var(--ink-faint); direction: ltr; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4); padding-block-start: var(--s-2); }
.spec { display: grid; gap: var(--s-2); font-size: var(--t-sm); color: var(--ink-muted); }
.spec > div { display: flex; justify-content: space-between; gap: var(--s-3); padding: 10px 14px; background: var(--shell); border-radius: 12px; }
.spec dt { color: var(--ink-faint); } .spec dd { margin: 0; color: var(--ink); font-weight: 500; }
.add { min-height: 40px; padding-inline: var(--s-4); font-size: var(--t-sm); }
.add[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.status { font-size: var(--t-sm); color: var(--ink-muted); min-height: 1.5em; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }

/* 01 · grid with live filter */
.filters { display: grid; gap: var(--s-4); margin-block-end: var(--s-6); }
.filters__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }
.filters .cat-search { flex: 1 1 240px; max-width: 380px; }
.filters select { min-height: var(--tap-min); padding: 0 var(--s-5); font: inherit; font-size: var(--t-sm); font-weight: 500; color: var(--ink); background: var(--shell); border: 0; border-radius: 999px; }
.filters__clear { visibility: hidden; }
.filters:has(.cat-chip[aria-pressed="true"]:not([data-cat="all"])) .filters__clear,
.filters:has(input:not(:placeholder-shown)) .filters__clear { visibility: visible; }
.grid { display: grid; gap: var(--s-6) var(--gutter); grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
catalog-card { display: block; container: card / inline-size; }
catalog-card[hidden] { display: none; }
.card { display: grid; gap: var(--s-4); align-content: start; height: 100%; }
.card__body { display: grid; gap: var(--s-2); align-content: start; padding-inline: 4px; }
@container card (min-width: 460px) { .card { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: var(--s-5); align-items: center; } }
.empty { padding: var(--s-8); text-align: center; color: var(--ink-faint); background: var(--shell); border-radius: var(--radius-card); }

/* 02 · close view with inline hotspots */
.study { display: grid; gap: var(--s-8); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.study__frame { position: relative; aspect-ratio: var(--ratio-media); background: var(--surface-alt); overflow: hidden; }
.study__frame .media { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; }
.dot { position: absolute; z-index: 2; width: 30px; height: 30px; margin: -15px 0 0 -15px; padding: 0; display: grid; place-items: center; cursor: pointer; font-family: var(--font-num); font-size: 12px; font-weight: 600; background: var(--accent); color: var(--on-accent); border: 2px solid var(--bg); border-radius: 999px; box-shadow: 0 6px 16px -6px rgb(21 24 26 / 0.4); transition: transform var(--dur-base) var(--ease-pop); }
.dot::after { content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 1.5px solid var(--accent); opacity: 0.45; transition: inset var(--dur-base) var(--ease-apple), opacity var(--dur-base) var(--ease-apple); }
.dot:hover, .dot[aria-pressed="true"] { transform: scale(1.14); } .dot[aria-pressed="true"]::after { inset: -10px; opacity: 1; }
.study__side { display: grid; gap: var(--s-5); }
.notes { display: grid; gap: var(--s-2); }
.note { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--s-4); align-items: baseline; padding: var(--s-4) var(--s-5); border: 0; border-radius: 16px; background: var(--shell); text-align: start; font: inherit; color: inherit; cursor: pointer; transition: background var(--dur-base) var(--ease-apple), transform var(--dur-base) var(--ease-apple); }
.note:hover { background: var(--shell-strong); } .note[aria-pressed="true"] { background: var(--accent-soft); }
.note:active { transform: scale(0.99); }
.note__n { font-family: var(--font-num); font-size: var(--t-sm); font-weight: 600; color: var(--accent); }
.note__t { font-size: var(--t-md); font-weight: 700; line-height: 1.3; }
.note__b { grid-column: 2; margin: 0; font-size: var(--t-sm); color: var(--ink-muted); line-height: 1.7; }
@media (max-width: 800px) { .study { grid-template-columns: 1fr; } }

/* 03 · video and spin */
.pair { display: grid; gap: var(--gutter); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.pair__item { display: grid; gap: var(--s-4); }

/* 04 · before / after */
.cmp { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--surface-alt); direction: ltr; --x: 50%; touch-action: none; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
.cmp__after { clip-path: inset(0 0 0 var(--x)); }
.cmp__handle { position: absolute; inset-block: 0; left: var(--x); width: 2px; margin-left: -1px; background: var(--bg); pointer-events: none; }
.cmp__handle::after { content: ""; position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; translate: -50% -50%; border-radius: 999px; background: var(--surface); box-shadow: 0 8px 24px -8px rgb(21 24 26 / 0.5), 0 0 0 2px var(--accent); }
.cmp__range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.cmp__range:focus-visible ~ .cmp__handle::after { outline: 2px solid var(--focus); outline-offset: 3px; }
.cmp__label { position: absolute; bottom: 14px; padding: 6px 12px; font-size: var(--t-xs); font-weight: 600; border-radius: 999px; background: var(--surface); color: var(--ink); }
.cmp__label--a { left: 14px; } .cmp__label--b { right: 14px; }

/* 05 · variants */
.sw { display: grid; gap: var(--s-8); grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
.sw__stage { position: relative; aspect-ratio: var(--ratio-media); overflow: hidden; background: var(--surface-alt); }
.sw__stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity var(--dur-slow) var(--ease-apple); }
.sw__stage img[data-out] { opacity: 0; }
.sw__side { display: grid; gap: var(--s-4); }
.sw__name { display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap; }
.sw__var { font-size: var(--t-lg); font-weight: 600; color: var(--accent); }
@media (max-width: 760px) { .sw { grid-template-columns: 1fr; } }

/* 06 · expanding card with View Transitions */
.vt { display: grid; gap: var(--gutter); grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.vt__card { display: grid; gap: var(--s-3); align-content: start; text-align: start; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; border-radius: var(--radius-card); }
.vt__card:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
.vt__card .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vt__detail { grid-column: 1 / -1; display: grid; gap: var(--s-7); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: var(--s-6); background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-2); }
.vt__detail .tile .media { aspect-ratio: 1; }
.vt__text { display: grid; gap: var(--s-4); align-content: start; }
@media (max-width: 700px) { .vt__detail { grid-template-columns: 1fr; } }
::view-transition-group(*) { animation-duration: var(--dur-page); animation-timing-function: var(--ease-apple); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: var(--dur-base); }

/* 07 · quick view with the Popover API */
.qv-grid { display: flex; flex-wrap: wrap; gap: var(--s-3); }
[popover].qv { inset: 0; margin: auto; width: min(720px, 92vw); max-height: 88vh; overflow: auto; padding: var(--s-6); background: var(--surface); color: var(--ink); border: 0; border-radius: var(--radius-card); box-shadow: var(--shadow-lift); }
[popover].qv::backdrop { background: var(--overlay); }
.qv__grid { display: grid; gap: var(--s-6); grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
@media (max-width: 600px) { .qv__grid { grid-template-columns: 1fr; } }
.qv__text { display: grid; gap: var(--s-3); align-content: start; }
.qv__head { display: flex; justify-content: space-between; align-items: center; gap: var(--s-4); margin-block-end: var(--s-5); }
[popover].qv { opacity: 0; transform: translateY(14px) scale(0.98); transition: opacity var(--dur-base) var(--ease-apple), transform var(--dur-slow) var(--ease-apple), overlay var(--dur-slow) allow-discrete, display var(--dur-slow) allow-discrete; }
[popover].qv:popover-open { opacity: 1; transform: none; }
@starting-style { [popover].qv:popover-open { opacity: 0; transform: translateY(14px) scale(0.98); } }
[popover].qv::backdrop { opacity: 0; transition: opacity var(--dur-base) var(--ease-apple), overlay var(--dur-base) allow-discrete, display var(--dur-base) allow-discrete; }
[popover].qv:popover-open::backdrop { opacity: 1; }
@starting-style { [popover].qv:popover-open::backdrop { opacity: 0; } }

/* 08 · snap gallery */
.snap { position: relative; }
.snap__track { display: flex; gap: var(--gutter); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px; margin: -6px; }
.snap__track::-webkit-scrollbar { display: none; }
.snap__item { flex: 0 0 min(100%, 640px); scroll-snap-align: center; display: grid; gap: var(--s-4); }
.snap__item .media { aspect-ratio: 3 / 2; }
.snap__nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); margin-block-start: var(--s-5); }
.snap__dots { display: flex; gap: 8px; }
.snap__dots button { width: 8px; height: 8px; padding: 0; border-radius: 999px; border: 0; background: var(--shell-strong); cursor: pointer; transition: background var(--dur-base) var(--ease-apple), transform var(--dur-base) var(--ease-pop); }
.snap__dots button[aria-current="true"] { background: var(--accent); transform: scale(1.4); }

/* 09 · the book */
.book { position: relative; display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 3 / 2; perspective: 2400px; background: var(--surface); overflow: hidden; }
.book__page { position: relative; padding: var(--s-6); display: grid; gap: var(--s-4); align-content: start; overflow: hidden; }
.book__page + .book__page { border-inline-start: 1px solid var(--line); }
.book__page .media { aspect-ratio: 4 / 3; }
.book__folio { margin-block-start: auto; padding-block-start: var(--s-3); font-family: var(--font-num); font-size: var(--t-xs); color: var(--ink-faint); text-align: center; }
.book__leaf { position: absolute; inset-block: 0; width: 50%; transform-style: preserve-3d; transition: transform 1000ms var(--ease-apple); z-index: 3; }
.book__leaf--left { left: 0; transform-origin: right center; }
.book__leaf--right { right: 0; transform-origin: left center; }

.book__leaf--right.turn { transform: rotateY(-180deg); }
.book__face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--surface); box-shadow: 0 0 40px rgb(21 24 26 / 0.12); }
.book__face--back { transform: rotateY(180deg); }
.book__face .book__page { height: 100%; }
.book__nav { display: flex; justify-content: center; align-items: center; gap: var(--s-4); margin-block-start: var(--s-6); }
.book__count { font-size: var(--t-sm); color: var(--ink-muted); }
@media (max-width: 700px) { .book { aspect-ratio: auto; grid-template-columns: 1fr; } .book__page + .book__page { border-inline-start: 0; border-block-start: 1px solid var(--line); } .book__leaf { display: none; } }

/* 10 · scrollytelling */
.story { display: grid; gap: var(--s-9); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.story__stage { position: sticky; inset-block-start: calc(var(--bar-h) + var(--bar-top) + var(--s-5)); display: grid; gap: var(--s-4); }
.story__frame { position: relative; aspect-ratio: 4 / 5; max-height: calc(100vh - var(--bar-h) - 160px); overflow: hidden; background: var(--surface-alt); }
.story__frame .media { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; opacity: 0; transition: opacity var(--dur-page) var(--ease-apple); }
.story__frame .media.is-active { opacity: 1; }
.story__bar { height: 3px; background: var(--shell-strong); border-radius: 999px; overflow: hidden; }
.story__bar > div { height: 100%; width: var(--p, 0%); background: var(--accent); border-radius: 999px; transition: width var(--dur-page) var(--ease-apple); }
.story__steps { display: grid; gap: var(--s-6); }
.story__step { min-height: 60vh; display: grid; gap: var(--s-4); align-content: center; opacity: 0.3; transform: translateY(8px); transition: opacity var(--dur-page) var(--ease-apple), transform var(--dur-page) var(--ease-apple); }
.story__step.is-active { opacity: 1; transform: none; }
@media (max-width: 800px) { .story { grid-template-columns: 1fr; } .story__frame { max-height: 42vh; aspect-ratio: 3 / 2; } .story__step { min-height: 0; opacity: 1; transform: none; } .story__stage { inset-block-start: calc(var(--bar-h) + var(--bar-top)); z-index: 2; background: var(--bg); padding-block: var(--s-3); } }

/* 11 · comparison table */

   pin the sticky header inside the tray instead of under the bar. Narrow
   screens scroll the table sideways and let the header flow. */
.tbl-wrap { padding: var(--s-2); background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-tile); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--t-sm); }
.tbl th, .tbl td { padding: var(--s-3) var(--s-4); text-align: start; vertical-align: middle; }
.tbl tbody td { border-block-start: 1px solid var(--line); }
.tbl thead th { position: sticky; inset-block-start: calc(var(--bar-h) + var(--bar-top)); background: var(--surface); z-index: 1; font-weight: 600; color: var(--ink-muted); }
@media (max-width: 820px) { .tbl-wrap { overflow-x: auto; } .tbl thead th { position: static; } }
.tbl thead button { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
.tbl thead button::after { content: "↕"; font-size: 11px; color: var(--ink-faint); }

.tbl thead th[aria-sort="descending"] button::after { content: "↓"; color: var(--accent); }
.tbl tbody td { scroll-margin-block-start: calc(var(--bar-h) + var(--bar-top) + 64px); }
.tbl tbody tr { transition: background var(--dur-base) var(--ease-apple); }
.tbl tbody tr:hover td { background: var(--shell); }

.tbl tbody tr td:first-child { border-start-start-radius: 12px; border-end-start-radius: 12px; }
.tbl tbody tr td:last-child { border-start-end-radius: 12px; border-end-end-radius: 12px; }
.tbl .media { width: 44px; aspect-ratio: 1; border-radius: 10px; }
.tbl .num { direction: ltr; text-align: end; font-weight: 500; }

/* 12 · details */
.acc { display: grid; gap: var(--s-2); }

.acc details[open] { background: var(--surface); box-shadow: var(--shadow-2); }

.acc__body { display: grid; gap: var(--s-5); grid-template-columns: 132px minmax(0, 1fr); padding: 0 var(--s-5) var(--s-5); }

@media (max-width: 520px) { .acc__body { grid-template-columns: 1fr; } }

/* 13 · dialog */
dialog.dlg { inset: 0; margin: auto; width: min(760px, 92vw); max-height: 88vh; padding: var(--s-6); background: var(--surface); color: var(--ink); border: 0; border-radius: var(--radius-card); box-shadow: var(--shadow-lift); }

@starting-style { dialog.dlg[open] { opacity: 0; transform: translateY(14px) scale(0.98); } }
.dlg__head { display: flex; justify-content: space-between; align-items: center; gap: var(--s-4); margin-block-end: var(--s-5); }
.dlg__head h2 { font-size: var(--t-xl); font-weight: var(--w-display); letter-spacing: -0.02em; }

.dlg__row { grid-template-columns: 56px minmax(0, 1fr) auto; }
.dlg__row .media { aspect-ratio: 1; border-radius: 10px; }

.dlg__foot { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; justify-content: space-between; padding-block-start: var(--s-5); margin-block-start: var(--s-4); border-block-start: 1px solid var(--line); }
.dlg__total { font-size: var(--t-md); font-weight: 600; } .dlg__total small { font-size: var(--t-xs); font-weight: 500; color: var(--ink-faint); margin-inline-start: var(--s-1); }

.pic { display: grid; gap: var(--s-8); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }

.kv dt { color: var(--ink-faint); } .kv dd { margin: 0; font-family: var(--font-num); direction: ltr; color: var(--ink); }

/* 16 · access */
.keys { display: grid; gap: var(--s-2); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }

kbd { font-family: var(--font-num); font-size: var(--t-xs); font-weight: 600; color: var(--ink); background: var(--surface); box-shadow: 0 1px 2px rgb(21 24 26 / 0.15); border-radius: 8px; padding: 3px 9px; min-width: 52px; text-align: center; direction: ltr; }

/* ── footer ───────────────────────────────────────────────── */
.foot { display: grid; gap: var(--s-6); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); padding-block: var(--s-8) var(--s-10); border-block-start: 1px solid var(--line); }
.foot h3 { font-size: var(--t-base); font-weight: 700; margin-block-end: var(--s-3); }
.foot p, .foot li { font-size: var(--t-sm); color: var(--ink-muted); line-height: 1.7; } .foot p { margin: 0; max-width: 36ch; } .foot ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s-2); }
.foot a { color: var(--ink-muted); text-decoration: none; } .foot a:hover { color: var(--accent); }

/* ── reveals: Apple's ease, a soft rise, tiles pop ────────── */
.js .rv { opacity: 0; transform: translateY(24px); transition: opacity var(--dur-reveal) var(--ease-apple), transform var(--dur-reveal) var(--ease-apple), filter var(--dur-reveal) var(--ease-apple); transition-delay: calc(var(--i, 0) * var(--stagger)); }
.js .rv.in { opacity: 1; transform: none; filter: none; }
.js .rv--pop { transform: translateY(28px) scale(0.955); transition-timing-function: var(--ease-apple), var(--ease-pop), var(--ease-apple); }
.js .rv--pop.in { transform: none; }

@media (prefers-reduced-motion: reduce) {
  .js .rv { opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important; }
  .js .progress__bar, .js .hero__inner, .js .hero__title .w, .js .hero__kicker, .js .hero__lede, .js .hero__cta, .js .hero__visual { animation: none !important; opacity: 1 !important; transform: none !important; }
  .book__leaf, .tile { transition: none !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

:root[data-motion="reduce"] :is(.progress__bar, .hero__inner, .hero__title .w, .hero__kicker, .hero__lede, .hero__cta, .hero__visual) { animation: none !important; opacity: 1 !important; transform: none !important; }

/* ── print: the page becomes the printed catalog ─────────── */
@media print {
  .progress, .bar, .toc, .skip, .tech, .filters, .snap__nav, .book__nav, .tray, .actions, .add, .ck-cue, .dot, .cmp__range, .cmp__handle, .keys, .only-narrow, .hero__cta { display: none !important; }
  .shell { display: block; }
  .sec { padding-block: 24pt; break-inside: avoid; }
  .grid { grid-template-columns: repeat(3, 1fr) !important; }
  catalog-card[hidden] { display: block !important; }
  .rv, .hero__title .w, .hero__kicker, .hero__lede, .hero__visual { opacity: 1 !important; transform: none !important; filter: none !important; animation: none !important; }
  .tile { box-shadow: none; background: none; padding: 0; }
  .story__stage { position: static; } .story__frame .media { position: static; opacity: 1; aspect-ratio: 4 / 5; }

  .book__leaf { display: none; }

}

<body>

<a class="skip" href="#main" data-t="skip">رفتن به محتوا</a>
<div class="progress" aria-hidden="true"><div class="progress__bar" id="progress"></div></div>

<!-- Wide screens carry every control in the bar; narrow ones fold the
     scheme, motion and language controls into the index menu. Both sets
     share data attributes and one delegated handler. -->
<header class="bar">
  <span class="bar__mark fa-display" data-t="brand">آوند</span>
  <span class="bar__sep"></span>
  <div class="seg only-wide" role="group" aria-label="colour scheme">
    <button type="button" data-scheme="auto" aria-pressed="true" data-t="auto">سیستم</button>
    <button type="button" data-scheme="light" aria-pressed="false" data-t="light">روشن</button>
    <button type="button" data-scheme="dark" aria-pressed="false" data-t="dark">تیره</button>
  </div>
  <button type="button" class="cat-chip only-wide" data-motion aria-pressed="false" data-t="motion">کاهش حرکت</button>
  <button type="button" class="cat-btn cat-btn--ghost" id="inq-open"><span data-t="inquiry">استعلام</span> <span class="badge" id="inq-n" aria-live="polite"></span></button>
  <div class="cat-lang only-wide" role="group" aria-label="language">
    <button type="button" data-lang="fa" aria-pressed="true">فارسی</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <button type="button" class="cat-chip only-narrow" popovertarget="menu" data-t="index">فهرست</button>
</header>

<div popover id="menu" class="qv">
  <div class="qv__head"><strong data-t="index">فهرست</strong><button type="button" class="cat-btn cat-btn--ghost" popovertarget="menu" popovertargetaction="hide" data-t="close">بستن</button></div>
  <div class="menu__settings menu__settings--top">
    <div class="seg" role="group" aria-label="colour scheme">
      <button type="button" data-scheme="auto" aria-pressed="true" data-t="auto">سیستم</button>
      <button type="button" data-scheme="light" aria-pressed="false" data-t="light">روشن</button>
      <button type="button" data-scheme="dark" aria-pressed="false" data-t="dark">تیره</button>
    </div>
    <button type="button" class="cat-chip" data-motion aria-pressed="false" data-t="motion">کاهش حرکت</button>
    <div class="cat-lang" role="group" aria-label="language">
      <button type="button" data-lang="fa" aria-pressed="true">فارسی</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <ol class="toc-list" id="toc-list-narrow"></ol>
</div>

<main id="main">
  <!-- The hero spans the page: type on the start side, one piece on the
       other. The sections below share the column with the index rail. -->
  <section class="hero" id="top">
    <div class="hero__inner">
      <div class="hero__kicker" data-t="kicker">کاتالوگ دیجیتال با HTML، CSS و JavaScript</div>
      <h1 class="hero__title" data-t="title">شانزده قابلیت وب برای یک کاتالوگ دیجیتال، همه زنده</h1>
      <p class="hero__lede" data-t="lede">هر بخش یک قابلیت را زنده نشان می‌دهد: از فیلتر و بزرگ‌نمایی تا ورق‌زدن سه‌بعدی، دیالوگ بومی، حالت تیره و چاپ.</p>
      <div class="hero__cta"><a class="cat-btn hero__btn" href="#filter"><span data-t="cta">شروع از بخش ۰۱</span><span class="ic" aria-hidden="true">↓</span></a></div>
    </div>
    <div class="hero__visual" id="hero-visual"></div>
  </section>
  <div class="shell">
    <nav class="toc" aria-label="index"><ol id="toc-list"></ol></nav>
    <div id="sections"></div>
  </div>
</main>

<footer class="shell"><div class="foot" id="foot" style="grid-column: 1 / -1"></div></footer>

<div popover id="qv" class="qv"></div>
<dialog class="dlg" id="inq" aria-labelledby="inq-title"></dialog>
<dialog class="dlg" id="cmpdlg" aria-labelledby="cmp-title"></dialog>

<template id="card-tpl">
  <article class="card lift">
    <div class="tile"><div class="media"></div></div>
    <div class="card__body">
      <h3 class="name"></h3>
      <div class="alt"></div>
      <p class="copy copy--sm"></p>
      <div class="row"><div class="price"></div><div class="code"></div></div>
      <button type="button" class="cat-btn cat-btn--ghost add"></button>
    </div>
  </article>
</template>

<script>
/* inlined from shared/catalog-kit.js */
/* ============================================================
   catalog-kit.js — mechanisms shared by every catalog variant.

   Three things every variant gets, wired by one call to CatalogKit.mount():

     1. Procedural placeholder artwork. Deterministic per seed, so a
        product keeps its look across reloads and across variants. No
        network, no stock photos. Swap in real photography by putting a
        real URL in the media descriptor's `src`.

     2. A detail viewer. Click any media and it opens: zoom to the point
        you clicked, drag to pan, wheel/pinch to scale, numbered hotspots
        that name the part you are looking at, a thumbnail strip, and
        keyboard control throughout.

     3. A video player. Give a media descriptor a real `src` and it plays
        that file through a <video>. Give it none and it plays a
        synthetic clip rendered to canvas on a real timeline — play,
        pause, scrub, seek, mute and loop all behave exactly as they will
        once the real footage lands.

   Nothing here knows about themes. Colours come from the design-system
   custom properties, so a catalog changes style by changing data-theme.
   ============================================================ */
(function (global) {
  'use strict';

  /* ── deterministic randomness ─────────────────────────────
     Same seed, same artwork — on every reload, in every variant. */

  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function rng(seed) {
    var a = hash(seed);
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pick(rand, list) {
    return list[Math.floor(rand() * list.length) % list.length];
  }

  function round(n, places) {
    var f = Math.pow(10, places == null ? 2 : places);
    return Math.round(n * f) / f;
  }

  /* ── procedural artwork ───────────────────────────────────
     A product shot is a lit backdrop, a subject, a contact shadow and
     film grain. Each subject is drawn from primitives, so the result
     reads as an object on a surface rather than as an abstract pattern. */

  var PALETTES = {
    warm:    { bg: ['#efe9df', '#e6ddcd'], sub: ['#b08256', '#8d6440', '#c99b6b'], acc: '#a8613a', deep: '#41342a' },
    stone:   { bg: ['#e9e7e2', '#d9d6cf'], sub: ['#8e8d88', '#6f6e6a', '#a8a6a0'], acc: '#5d5c58', deep: '#33322f' },
    ink:     { bg: ['#e8e8ea', '#d4d5d9'], sub: ['#3d4148', '#23262b', '#585d66'], acc: '#1a1c20', deep: '#111316' },
    sage:    { bg: ['#e4e9e1', '#d3dbcf'], sub: ['#7d9070', '#5f7355', '#96a889'], acc: '#4f6347', deep: '#2c382a' },
    clay:    { bg: ['#f0e4dd', '#e4d1c6'], sub: ['#c07a5e', '#a15c42', '#d59b80'], acc: '#8f4b31', deep: '#4a2a1e' },
    indigo:  { bg: ['#e3e6ee', '#cfd5e4'], sub: ['#5a6b95', '#3f4d72', '#7887ac'], acc: '#33406a', deep: '#1c2440' },
    amber:   { bg: ['#f4ead7', '#ecdcbc'], sub: ['#d0a558', '#b98c3f', '#e0bd86'], acc: '#96702c', deep: '#4c3a16' },
    rose:    { bg: ['#f2e5e5', '#e6cfd0'], sub: ['#b87b81', '#9a5f65', '#cf989d'], acc: '#8a4f56', deep: '#472a2d' }
  };

  var PALETTE_NAMES = Object.keys(PALETTES);

  var SUBJECTS = ['bottle', 'chair', 'lamp', 'vase', 'bag', 'watch', 'shoe', 'textile'];

  /* Each subject returns SVG markup drawn inside a 0..1000 square. */
  var draw = {
    bottle: function (r, c) {
      var w = 150 + r() * 70, neck = 46 + r() * 22, shoulder = 300 + r() * 70;
      return (
        '<path d="M' + (500 - neck) + ' 250 L' + (500 - neck) + ' ' + shoulder +
        ' Q' + (500 - w) + ' ' + (shoulder + 70) + ' ' + (500 - w) + ' ' + (shoulder + 160) +
        ' L' + (500 - w) + ' 790 Q' + (500 - w) + ' 840 ' + (500 - w + 50) + ' 840' +
        ' L' + (500 + w - 50) + ' 840 Q' + (500 + w) + ' 840 ' + (500 + w) + ' 790' +

const t = () => S[lang];
const fa = () => lang === 'fa';
const num = (n) => fa() ? CatalogKit.toFa(String(n)) : String(n);
const money = (n) => { const s = n.toLocaleString('en-US'); return fa() ? CatalogKit.toFa(s).replace(/,/g, '٬') : s; };
const name = (p) => fa() ? p.fa : p.en;
const alt = (p) => fa() ? p.en : p.fa;
const copy = (p) => fa() ? p.faCopy : p.enCopy;
const specs = (p) => fa() ? p.faSpec : p.enSpec;
const catName = (id) => { const c = CATEGORIES.find((c) => c.id === id); return fa() ? c.fa : c.en; };
const byCode = (code) => PRODUCTS.find((p) => p.code === code);
const hotspots = (p) => p.hot.map((h) => ({ x: h.x, y: h.y, title: (fa() ? h.fa : h.en)[0], body: (fa() ? h.fa : h.en)[1] }));
const mediaSet = (p) => CatalogKit.defaultMedia(p.code, hotspots(p), { subject: p.subject, palette: p.palette });
const art = (p, o) => CatalogKit.image(p.code + '-a', Object.assign({ subject: p.subject, palette: p.palette, w: 800, h: 1000 }, o));

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function media(p, modifier) {
  const box = el('div', 'media' + (modifier ? ' media--' + modifier : ''));
  queueMicrotask(() => CatalogKit.mountMedia(box, mediaSet(p), { title: name(p), sku: p.code }, lang));
  return box;
}
/* A picture sits in a tray: the tile is the shell, the media its core. */
function tile(inner, cls) {
  const t = el('div', 'tile' + (cls ? ' ' + cls : ''));
  t.appendChild(inner);

/* ── 09 the book ──────────────────────────────────────────── */
function secBook() {
  const wrap = el('div', 'rv rv--pop');
  const spreads = [[PRODUCTS[0], PRODUCTS[1]], [PRODUCTS[2], PRODUCTS[3]], [PRODUCTS[4], PRODUCTS[5]], [PRODUCTS[6], PRODUCTS[7]]];
  let cur = 0, turning = false;
  const book = el('div', 'book'); book.tabIndex = 0; book.setAttribute('aria-roledescription', 'book');
  const pageEl = (p, folio) => {
    const pg = el('div', 'book__page');
    const h = el('div', 'code', t().running);
    pg.append(h, media(p, null), nameBlock(p), el('div', 'book__folio', t().pageOf(folio, spreads.length * 2)));
    return pg;
  };
  function renderSpread() {
    for (const n of [...book.children]) if (!n.classList.contains('book__leaf')) n.remove();
    const [a, b] = spreads[cur];
    const first = pageEl(a, cur * 2 + 1), second = pageEl(b, cur * 2 + 2);
    book.prepend(first, second);
    count.textContent = t().pageOf(cur + 1, spreads.length);
    prev.disabled = cur === 0; next.disabled = cur === spreads.length - 1;
  }
  function turn(dir) {
    const target = cur + dir; if (turning || target < 0 || target >= spreads.length) return;
    if (root.dataset.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches || innerWidth <= 700) { cur = target; renderSpread(); return; }
    turning = true;
    /* In RTL the reader turns the left page to go forward; in LTR the right. */
    const turnsLeft = fa() ? dir > 0 : dir < 0;
    const leaf = el('div', 'book__leaf ' + (turnsLeft ? 'book__leaf--left' : 'book__leaf--right'));
    const front = el('div', 'book__face'), back = el('div', 'book__face book__face--back');
    const [ca, cb] = spreads[cur], [na, nb] = spreads[target];
    /* Fresh page elements, appended while attached, so their media mounts
       inside the leaf; a clone taken before the mount would turn blank. */
    leaf.append(front, back);
    book.appendChild(leaf);
    /* The turning leaf carries the second page of this spread when the
       reading direction turns that side, otherwise the first; its back
       is the matching page of the next spread. */
    const second = turnsLeft === fa();
    front.appendChild(pageEl(second ? cb : ca, cur * 2 + (second ? 2 : 1)));
    back.appendChild(pageEl(second ? na : nb, target * 2 + (second ? 1 : 2)));
    requestAnimationFrame(() => requestAnimationFrame(() => leaf.classList.add('turn')));
    leaf.addEventListener('transitionend', () => { cur = target; renderSpread(); leaf.remove(); turning = false; }, { once: true });
  }

  const prev = el('button', 'cat-btn cat-btn--ghost', t().prev); prev.type = 'button'; prev.addEventListener('click', () => turn(-1));
  const next = el('button', 'cat-btn cat-btn--ghost', t().next); next.type = 'button'; next.addEventListener('click', () => turn(1));
  const count = el('div', 'book__count');
  nav.append(prev, count, next);
  book.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') turn(fa() ? 1 : -1); if (e.key === 'ArrowRight') turn(fa() ? -1 : 1); });
  renderSpread();
  wrap.append(tile(book), nav);
  return wrap;
}

  const cols = [['pick', t().thPick, null], ['name', t().thName, (p) => name(p)], ['material', t().thMaterial, (p) => fa() ? p.material[0] : p.material[1]], ['size', t().thSize, (p) => p.size], ['price', t().thPrice, (p) => p.price], ['stock', t().thStock, (p) => p.stock]];
  let sortKey = 'name', dir = 1;
  const thead = el('thead'), tr = el('tr');
  for (const [k, label, get] of cols) {
    const th = el('th'); th.scope = 'col';
    if (get) { const b = el('button', null, label); b.type = 'button'; b.addEventListener('click', () => { dir = sortKey === k ? -dir : 1; sortKey = k; renderRows(); }); th.appendChild(b); th.dataset.key = k; } else th.textContent = label;
    tr.appendChild(th);
  }
  thead.appendChild(tr); table.appendChild(thead);
  const tbody = el('tbody'); table.appendChild(tbody);
  const picked = new Set();
  const tray = el('div', 'tray'); const trayN = el('span', 'tray__n'); const cmpBtn = el('button', 'cat-btn', t().compare); cmpBtn.type = 'button';
  tray.append(trayN, el('span', 'bar__sep'), cmpBtn);
  function renderRows() {
    for (const th of thead.querySelectorAll('th[data-key]')) th.setAttribute('aria-sort', th.dataset.key === sortKey ? (dir > 0 ? 'ascending' : 'descending') : 'none');
    const get = cols.find((c) => c[0] === sortKey)[2];
    const rows = [...PRODUCTS].sort((a, b) => { const x = get(a), y = get(b); return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), lang)) * dir; });
    tbody.innerHTML = '';
    for (const p of rows) {
      const r = el('tr');
      const tdPick = el('td'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = picked.has(p.code); cb.setAttribute('aria-label', t().thPick + ' ' + name(p));
      cb.addEventListener('change', () => { if (cb.checked) { if (picked.size >= 3) { cb.checked = false; trayN.textContent = t().maxCompare; return; } picked.add(p.code); } else picked.delete(p.code); trayN.textContent = t().compareN(picked.size); });
      tdPick.appendChild(cb);
      const tdName = el('td'); const nm = el('div', 'tbl__name');
      const label = el('div'); label.append(el('div', 'name', name(p)), el('div', 'code', p.code));
      nm.append(media(p, 'square'), label);
      tdName.appendChild(nm);
      const tdMat = el('td', null, fa() ? p.material[0] : p.material[1]);
      const tdSize = el('td', 'num', String(p.size));
      const tdPrice = el('td', 'num', money(p.price));
      const tdStock = el('td'); const meter = el('meter'); meter.min = 0; meter.max = 12; meter.low = 3; meter.high = 9; meter.optimum = 12; meter.value = p.stock; meter.setAttribute('aria-label', t().thStock + ' ' + num(p.stock)); tdStock.append(meter, el('span', 'code', ' ' + num(p.stock)));

  tw.appendChild(table);
  wrap.append(tw, tray);

}
function openCompare(codes) {
  const dlg = document.getElementById('cmpdlg');
  const items = codes.map(byCode);
  dlg.innerHTML = '';
  const h = el('div', 'dlg__head'); h.append(el('h2', null, t().compare)); h.querySelector('h2').id = 'cmp-title';
  const form = el('form'); form.method = 'dialog'; const close = el('button', 'cat-btn cat-btn--ghost', t().close); form.appendChild(close); h.appendChild(form);
  const table = el('table', 'cmp-tbl');
  /* Only attributes are compared; a name is not a difference, and each
     piece's own spec lines are shown without highlighting. */
  const rows = [
    [t().thMaterial, (p) => fa() ? p.material[0] : p.material[1], 'text', true],
    [t().thSize, (p) => num(p.size), 'num', true],
    [t().thPrice, (p) => money(p.price), 'num', true],
    [t().thStock, (p) => num(p.stock), 'num', true],
    ...[0, 1, 2].map((i) => ['', (p) => specs(p)[i] ? specs(p)[i][0] + ': ' + specs(p)[i][1] : '', 'text', false])
  ];
  const thead = el('thead'); const hr = el('tr'); hr.appendChild(el('th'));
  for (const p of items) { const th = el('th'); th.append(media(p, 'square'), el('div', 'name', name(p)), el('div', 'code', p.code)); hr.appendChild(th); }
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el('tbody');
  for (const [label, get, kind, compare] of rows) {
    const tr = el('tr'); tr.appendChild(el('th', null, label));
    const vals = items.map(get); const differ = compare && new Set(vals).size > 1;
    for (const v of vals) tr.appendChild(el('td', (kind === 'num' ? 'num' : '') + (differ ? ' diff' : ''), v));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  dlg.append(h, table);
  dlg.showModal();
}

function openInquiry() { renderInquiry(); document.getElementById('inq').showModal(); }
function renderInquiry() {
  const dlg = document.getElementById('inq'); dlg.innerHTML = '';

    try { await navigator.clipboard.writeText(location.href); st.textContent = navigator.share ? t().copied : t().shareFail; } catch (e) { st.textContent = location.href; }

/* ── frame: toc, scrollspy, reveals, render ───────────────── */
let spy = null, revealer = null;
function buildToc() {
  for (const list of [document.getElementById('toc-list'), document.getElementById('toc-list-narrow')]) {
    list.innerHTML = '';
    SECTIONS.forEach((s, i) => {
      const li = el('li'); const a = el('a'); a.href = '#' + s.id;
      a.append(el('span', 'n', num(String(i + 1).padStart(2, '0'))), el('span', null, fa() ? s.fa : s.en));
      if (list.id === 'toc-list-narrow') a.setAttribute('popovertarget', 'menu');
      li.appendChild(a); list.appendChild(li);
    });
  }
}
function scrollspy() {
  if (spy) spy.disconnect();
  spy = new IntersectionObserver((ents) => {
    for (const en of ents) if (en.isIntersecting) for (const a of document.querySelectorAll('.toc a')) a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + en.target.id));
  }, { rootMargin: '-35% 0px -60% 0px', threshold: 0 });
  for (const s of document.querySelectorAll('.sec')) spy.observe(s);
}
function reveals() {
  if (revealer) revealer.disconnect();
  revealer = new IntersectionObserver((ents) => {
    /* Elements that cross the line in the same frame rise one after the
       other, in document order; the next batch starts its count afresh. */
    let k = 0;
    for (const en of ents) if (en.isIntersecting) { en.target.style.setProperty('--i', Math.min(k++, 6)); en.target.classList.add('in'); revealer.unobserve(en.target); }
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
  for (const n of document.querySelectorAll('.rv')) revealer.observe(n);
}
function render() {
  const host = document.getElementById('sections'); host.innerHTML = '';
  SECTIONS.forEach((s, i) => {
    const sec = el('section', 'sec'); sec.id = s.id;
    sec.append(head(s, i), s.build());
    host.appendChild(sec);
  });
  const vis = document.getElementById('hero-visual'); vis.innerHTML = '';
  vis.appendChild(tile(media(PRODUCTS[0])));
  const foot = document.getElementById('foot'); foot.innerHTML = '';
  const more = el('div'); more.appendChild(el('h3', null, t().fMore)); const ul = el('ul');
  [['hub.html', 0], ['catalogs/compositions.html', 1], ['catalogs/avand.html', 2], ['catalogs/00-mechanisms.html', 3]].forEach(([href, i]) => { const li = el('li'); const a = el('a', null, t().fMoreV[i]); a.href = href; li.appendChild(a); ul.appendChild(li); });
  more.appendChild(ul);
  const built = el('div'); built.append(el('h3', null, t().fBuilt), el('p', null, t().fBuiltV));
  const src = el('div'); src.appendChild(el('h3', null, t().fSource)); const a = el('a', 'code', t().fSourceV); a.href = 'https://github.com/Ali-Nourix/Temp'; src.appendChild(a);
  foot.append(more, built, src);
  for (const n of document.querySelectorAll('[data-t]')) { const v = t()[n.dataset.t]; if (typeof v === 'string') n.textContent = v; }
  splitWords(document.querySelector('.hero__title'));
  buildToc(); syncInquiry(); scrollspy(); reveals();
}

/* ── controls: one delegated handler for both sets ────────── */
const pressAll = (sel, test) => { for (const b of document.querySelectorAll(sel)) b.setAttribute('aria-pressed', String(test(b))); };
function setScheme(v) { root.dataset.scheme = v; pressAll('button[data-scheme]', (b) => b.dataset.scheme === v); safeSet('avand-scheme', v); }
function setMotion(reduce) { root.dataset.motion = reduce ? 'reduce' : 'auto'; pressAll('button[data-motion]', () => reduce); safeSet('avand-motion', reduce ? '1' : '0'); if (reduce) for (const n of document.querySelectorAll('.rv')) n.classList.add('in'); }
function setLang(v) {
  lang = v; pressAll('button[data-lang]', (b) => b.dataset.lang === v);
  root.lang = lang; root.dir = fa() ? 'rtl' : 'ltr'; document.title = fa() ? 'کاتالوگ دیجیتال با HTML: نمایش قابلیت‌ها' : 'A digital catalog in HTML: the capabilities';
  render();
}
document.addEventListener('click', (e) => {
  const sch = e.target.closest('button[data-scheme]'); if (sch) { setScheme(sch.dataset.scheme); return; }
  if (e.target.closest('button[data-motion]')) { setMotion(root.dataset.motion !== 'reduce'); return; }
  const lg = e.target.closest('button[data-lang]'); if (lg && lg.dataset.lang !== lang) setLang(lg.dataset.lang);
});
document.getElementById('inq-open').addEventListener('click', openInquiry);

const savedScheme = safeGet('avand-scheme'); if (['auto', 'light', 'dark'].includes(savedScheme)) setScheme(savedScheme);
if (safeGet('avand-motion') === '1') setMotion(true);
render();
