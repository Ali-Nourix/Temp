<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="press">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارافزار البرز — فهرست فصلی</title>
<style>
/* inlined from shared/ds-core.css */
/* ============================================================
   Catalog Design System — core tokens, 8 themes, components
   Extracted from "سیستم طراحی کاتالوگ دیجیتال v1".
   Fonts load from Google Fonts; every family has a system fallback,
   so the file still renders offline.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@400;500;700;800&family=Markazi+Text:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Space+Grotesk:wght@400;500;700&family=Vazirmatn:wght@300;400;500;700;900&display=swap');

:root {
  /* خانواده‌های پایه — تم‌ها این‌ها را روی نقش‌ها می‌نشانند */
  --fam-vazir: "Vazirmatn", system-ui, sans-serif;
  --fam-naskh: "Noto Naskh Arabic", "Vazirmatn", serif;
  --fam-kufi: "Noto Kufi Arabic", "Vazirmatn", sans-serif;
  --fam-markazi: "Markazi Text", "Noto Naskh Arabic", serif;
  --fam-newsreader: "Newsreader", Georgia, serif;
  --fam-cormorant: "Cormorant Garamond", Georgia, serif;
  --fam-grotesk: "Space Grotesk", "Helvetica Neue", sans-serif;
  --fam-archivo: "Archivo", "Helvetica Neue", sans-serif;
  --fam-manrope: "Manrope", "Helvetica Neue", sans-serif;
  --fam-sourceserif: "Source Serif 4", Georgia, serif;
  --fam-plex: "IBM Plex Sans", "Helvetica Neue", sans-serif;
  --fam-plexmono: "IBM Plex Mono", ui-monospace, monospace;
}

/* پالت پایه و نام‌های معنایی. مقدارها با oklch نوشته شده‌اند تا هم‌خانواده بمانند.
   قاعده: هیچ کامپوننتی رنگ خام ننویسد — فقط نام معنایی. */
:root {
  /* خنثی‌های گرم (پیش‌فرض ادیتوریال) */
  --n-00: oklch(0.99 0.004 85);
  --n-05: oklch(0.975 0.005 85);
  --n-10: oklch(0.945 0.006 85);
  --n-20: oklch(0.90 0.007 85);
  --n-30: oklch(0.80 0.008 85);
  --n-50: oklch(0.62 0.009 85);
  --n-70: oklch(0.44 0.010 85);
  --n-85: oklch(0.28 0.010 80);
  --n-95: oklch(0.17 0.010 80);
  --n-100: oklch(0.12 0.008 80);

  /* نقش‌های معنایی — تم پیش‌فرض: editorial */
  --bg: var(--n-05);
  --bg-alt: var(--n-00);
  --surface: var(--n-00);
  --surface-alt: var(--n-10);
  --ink: var(--n-95);
  --ink-muted: var(--n-70);
  --ink-faint: var(--n-50);
  --line: oklch(0.88 0.006 85);
  --line-strong: var(--n-85);
  --accent: oklch(0.52 0.12 42);
  --accent-soft: oklch(0.94 0.03 42);
  --on-accent: oklch(0.99 0.004 85);
  --focus: oklch(0.55 0.15 250);
  --overlay: oklch(0.17 0.01 80 / 0.55);

  /* وضعیت‌ها — فقط همین سه؛ رنگ‌های معنایی بیشتری اضافه نکن */
  --ok: oklch(0.55 0.10 150);
  --warn: oklch(0.70 0.13 75);
  --danger: oklch(0.53 0.15 25);
}

/* تایپوگرافی دوزبانه. دو محور جدا: fa (فارسی/RTL) و en (لاتین/LTR).
   قاعده‌ی سخت: line-height فارسی همیشه بلندتر از لاتین؛ letter-spacing روی فارسی صفر. */
:root {
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-grotesk);
  --font-num: var(--fam-plexmono);

  /* مقیاس سیال — یک مقیاس برای هر دو زبان */
  --t-xs: clamp(0.72rem, 0.70rem + 0.15vw, 0.80rem);
  --t-sm: clamp(0.82rem, 0.79rem + 0.2vw, 0.92rem);
  --t-base: clamp(0.95rem, 0.90rem + 0.25vw, 1.06rem);
  --t-md: clamp(1.10rem, 1.02rem + 0.4vw, 1.30rem);
  --t-lg: clamp(1.35rem, 1.18rem + 0.8vw, 1.75rem);
  --t-xl: clamp(1.75rem, 1.40rem + 1.6vw, 2.60rem);
  --t-2xl: clamp(2.30rem, 1.70rem + 2.8vw, 3.80rem);
  --t-3xl: clamp(3.00rem, 2.00rem + 4.6vw, 5.60rem);

  --lh-fa-tight: 1.42;
  --lh-fa-body: 1.85;
  --lh-en-tight: 1.10;
  --lh-en-body: 1.55;

  --w-light: 300;
  --w-regular: 400;
  --w-medium: 500;
  --w-bold: 700;
  --w-black: 900;

  --tracking-fa: 0;
  --tracking-en: 0.01em;
  --tracking-en-caps: 0.10em;

  /* حداکثر عرض خط خوانا */
  --measure-fa: 62ch;
  --measure-en: 70ch;
}

/* فاصله، شبکه، گوشه، خط. مقیاس ۴ پایه اما مقدارهای واقعی طراحی — گرد نکن. */
:root {
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;
  --s-10: 128px;

  --gutter: var(--s-5);
  --page-pad: clamp(20px, 4vw, 72px);
  --page-max: 1360px;
  --col-min: 268px;          /* حداقل عرض کارت محصول در شبکه‌ی سیال */

  --radius-none: 0px;
  --radius-media: 2px;
  --radius-card: 4px;
  --radius-control: 4px;
  --radius-pill: 999px;

  --border-w: 1px;
  --border-w-strong: 2px;

  --shadow-1: 0 1px 2px oklch(0.17 0.01 80 / 0.06);
  --shadow-2: 0 10px 30px -12px oklch(0.17 0.01 80 / 0.18);
  --shadow-lift: 0 18px 44px -18px oklch(0.17 0.01 80 / 0.28);

  --ratio-media: 4 / 5;      /* نسبت پیش‌فرض عکس محصول */
  --ratio-cover: 3 / 4;      /* کاور کاتالوگ */
  --ratio-spread: 3 / 2;     /* صفحه‌ی باز کاتالوگ */
  --tap-min: 44px;           /* حداقل هدف لمسی — هرگز کمتر */
}

/* حرکت. هر انیمیشنی که می‌سازی باید از همین توکن‌ها استفاده کند.
   قاعده: فقط transform و opacity انیمیت می‌شوند. width/height/top/left هرگز. */
:root {
  --dur-instant: 90ms;
  --dur-fast: 160ms;
  --dur-base: 240ms;
  --dur-slow: 420ms;
  --dur-page: 560ms;

  --ease-out: cubic-bezier(0.20, 0.80, 0.25, 1);
  --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-soft: cubic-bezier(0.34, 1.12, 0.64, 1);

  --hover-lift: -2px;
  --hover-media-scale: 1.03;
  --press-scale: 0.985;
  --stagger: 45ms;           /* فاصله‌ی ورود کارت‌های پشت‌سرهم؛ حداکثر ۸ کارت */
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-instant: 1ms;
    --dur-fast: 1ms;
    --dur-base: 1ms;
    --dur-slow: 1ms;
    --dur-page: 1ms;
    --hover-lift: 0px;
    --hover-media-scale: 1;
    --press-scale: 1;
    --stagger: 0ms;
  }
}

/* ۸ تم. یک تم = یک بار عوض کردن data-theme روی ریشه. هیچ کامپوننتی تم‌آگاه نیست.
   استفاده: <div data-theme="luxe"> … </div>  یا  <html data-theme="spec"> */

/* ۱. editorial — مینیمال مجله‌ای؛ فضای سفید زیاد، تایپ سریف لاتین، شبکه‌ی نامتقارن */
[data-theme="editorial"] {
  --bg: oklch(0.975 0.005 85);
  --bg-alt: oklch(0.99 0.004 85);
  --surface: oklch(0.99 0.004 85);
  --surface-alt: oklch(0.945 0.006 85);
  --ink: oklch(0.17 0.010 80);
  --ink-muted: oklch(0.44 0.010 85);
  --ink-faint: oklch(0.62 0.009 85);
  --line: oklch(0.88 0.006 85);
  --line-strong: oklch(0.28 0.010 80);
  --accent: oklch(0.52 0.12 42);
  --accent-soft: oklch(0.94 0.03 42);
  --on-accent: oklch(0.99 0.004 85);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-grotesk);
  --radius-media: 2px; --radius-card: 3px; --radius-control: 3px;
  --border-w: 1px;
  --shadow-1: 0 1px 2px oklch(0.17 0.01 80 / 0.05);
  --shadow-2: 0 12px 34px -16px oklch(0.17 0.01 80 / 0.16);
  --gutter: 28px;
}

/* ۲. luxe — تیره و طلایی؛ کم‌نور، فاصله‌ی زیاد، حرکت کند */
[data-theme="luxe"] {
  --bg: oklch(0.16 0.012 60);
  --bg-alt: oklch(0.21 0.014 60);
  --surface: oklch(0.21 0.014 60);
  --surface-alt: oklch(0.26 0.016 60);
  --ink: oklch(0.96 0.010 85);
  --ink-muted: oklch(0.78 0.014 85);
  --ink-faint: oklch(0.62 0.014 85);
  --line: oklch(0.34 0.016 70);
  --line-strong: oklch(0.72 0.070 85);
  --accent: oklch(0.79 0.098 85);
  --accent-soft: oklch(0.30 0.030 85);
  --on-accent: oklch(0.16 0.012 60);
  --overlay: oklch(0.10 0.01 60 / 0.72);
  --font-fa-display: var(--fam-markazi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-cormorant);
  --font-en-ui: var(--fam-grotesk);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none;
  --shadow-2: 0 24px 60px -28px oklch(0 0 0 / 0.6);
  --shadow-lift: 0 30px 70px -30px oklch(0 0 0 / 0.7);
  --dur-base: 340ms; --dur-slow: 620ms; --dur-page: 820ms;
  --hover-media-scale: 1.045;
  --gutter: 40px;
  --tracking-en-caps: 0.18em;
}

/* ۳. brutal — نئوبروتال؛ کنتراست بیشینه، حاشیه‌ی ضخیم، سایه‌ی سخت، حرکت تند */
[data-theme="brutal"] {
  --bg: oklch(0.985 0 0);
  --bg-alt: oklch(0.93 0.14 100);
  --surface: oklch(1 0 0);
  --surface-alt: oklch(0.95 0.16 100);
  --ink: oklch(0.13 0 0);
  --ink-muted: oklch(0.33 0 0);
  --ink-faint: oklch(0.50 0 0);
  --line: oklch(0.13 0 0);
  --line-strong: oklch(0.13 0 0);
  --accent: oklch(0.55 0.21 25);
  --accent-soft: oklch(0.93 0.14 100);
  --on-accent: oklch(1 0 0);
  --font-fa-display: var(--fam-kufi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-archivo);
  --font-en-ui: var(--fam-archivo);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 2px; --border-w-strong: 3px;
  --shadow-1: 3px 3px 0 oklch(0.13 0 0);
  --shadow-2: 6px 6px 0 oklch(0.13 0 0);
  --shadow-lift: 9px 9px 0 oklch(0.13 0 0);
  --dur-fast: 100ms; --dur-base: 140ms; --dur-slow: 220ms; --dur-page: 300ms;
  --ease-out: cubic-bezier(0.2, 1, 0.3, 1);
  --hover-lift: -3px; --hover-media-scale: 1;
  --gutter: 20px;
}

/* ۴. glass — شیشه‌ای نرم؛ blur، لایه‌های شفاف، گوشه‌های نرم. blur فقط روی چیزی که واقعاً روی محتوا شنا می‌کند */
[data-theme="glass"] {
  --bg: oklch(0.96 0.012 250);
  --bg-alt: oklch(0.98 0.008 250);
  --surface: oklch(1 0 0 / 0.72);
  --surface-alt: oklch(1 0 0 / 0.45);
  --ink: oklch(0.24 0.020 260);
  --ink-muted: oklch(0.48 0.018 260);
  --ink-faint: oklch(0.63 0.016 260);
  --line: oklch(0.55 0.02 260 / 0.18);
  --line-strong: oklch(0.45 0.03 260 / 0.35);
  --accent: oklch(0.58 0.105 255);
  --accent-soft: oklch(0.92 0.035 255);
  --on-accent: oklch(0.99 0.005 255);
  --overlay: oklch(0.30 0.02 260 / 0.35);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-manrope);
  --font-en-ui: var(--fam-manrope);
  --radius-media: 14px; --radius-card: 18px; --radius-control: 12px;
  --border-w: 1px;
  --shadow-1: 0 2px 10px -4px oklch(0.30 0.02 260 / 0.18);
  --shadow-2: 0 20px 50px -22px oklch(0.30 0.02 260 / 0.28);
  --shadow-lift: 0 26px 60px -24px oklch(0.30 0.02 260 / 0.34);
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --gutter: 26px;
}

/* ۵. press — کاتالوگ چاپی کلاسیک؛ شبکه‌ی سخت، خطوط جداکننده، سریف، بدون سایه */
[data-theme="press"] {
  --bg: oklch(0.965 0.008 92);
  --bg-alt: oklch(0.985 0.006 92);
  --surface: oklch(0.985 0.006 92);
  --surface-alt: oklch(0.935 0.010 92);
  --ink: oklch(0.22 0.014 60);
  --ink-muted: oklch(0.45 0.014 60);
  --ink-faint: oklch(0.60 0.012 60);
  --line: oklch(0.22 0.014 60 / 0.28);
  --line-strong: oklch(0.22 0.014 60);
  --accent: oklch(0.46 0.13 26);
  --accent-soft: oklch(0.92 0.035 26);
  --on-accent: oklch(0.985 0.006 92);
  --font-fa-display: var(--fam-naskh);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-sourceserif);
  --font-en-ui: var(--fam-sourceserif);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none; --shadow-2: none; --shadow-lift: none;
  --hover-lift: 0px; --hover-media-scale: 1;
  --gutter: 0px;
}

/* ۶. spec — صنعتی و جدول‌محور؛ داده اول، مونواسپیس برای اعداد، رنگ هشدار صنعتی */
[data-theme="spec"] {
  --bg: oklch(0.955 0.004 230);
  --bg-alt: oklch(0.98 0.003 230);
  --surface: oklch(0.99 0.002 230);
  --surface-alt: oklch(0.93 0.006 230);
  --ink: oklch(0.21 0.012 245);
  --ink-muted: oklch(0.44 0.012 245);
  --ink-faint: oklch(0.60 0.010 245);
  --line: oklch(0.80 0.010 245);
  --line-strong: oklch(0.35 0.014 245);
  --accent: oklch(0.52 0.135 248);
  --accent-soft: oklch(0.93 0.030 248);
  --on-accent: oklch(0.99 0.002 230);
  --warn: oklch(0.66 0.165 48);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-plex);
  --font-en-ui: var(--fam-plex);
  --font-num: var(--fam-plexmono);
  --radius-media: 2px; --radius-card: 2px; --radius-control: 2px;
  --border-w: 1px;
  --shadow-1: 0 1px 0 oklch(0.35 0.014 245 / 0.10);
  --shadow-2: 0 8px 24px -14px oklch(0.35 0.014 245 / 0.25);
  --dur-base: 180ms;
  --hover-media-scale: 1;
  --gutter: 16px;
}

/* ۷. craft — گرم و خاکی؛ کاغذ کرم، رنگ خاک رس، تایپ نرم */
[data-theme="craft"] {
  --bg: oklch(0.935 0.022 78);
  --bg-alt: oklch(0.965 0.018 78);
  --surface: oklch(0.965 0.018 78);
  --surface-alt: oklch(0.895 0.028 76);
  --ink: oklch(0.27 0.030 52);
  --ink-muted: oklch(0.47 0.030 52);
  --ink-faint: oklch(0.62 0.026 52);
  --line: oklch(0.78 0.030 70);
  --line-strong: oklch(0.42 0.034 52);
  --accent: oklch(0.52 0.095 45);
  --accent-soft: oklch(0.90 0.040 45);
  --on-accent: oklch(0.975 0.015 78);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-newsreader);
  --radius-media: 6px; --radius-card: 10px; --radius-control: 8px;
  --border-w: 1px;
  --shadow-1: 0 1px 2px oklch(0.27 0.03 52 / 0.08);
  --shadow-2: 0 14px 32px -18px oklch(0.27 0.03 52 / 0.22);
  --ease-out: cubic-bezier(0.25, 0.9, 0.3, 1);
  --gutter: 24px;
}

/* ۸. mono — تک‌رنگ سیاه‌وسفید؛ تایپ بزرگ، بدون رنگ تزئینی، آکسان = مرکب */
[data-theme="mono"] {
  --bg: oklch(1 0 0);
  --bg-alt: oklch(0.96 0 0);
  --surface: oklch(1 0 0);
  --surface-alt: oklch(0.94 0 0);
  --ink: oklch(0.11 0 0);
  --ink-muted: oklch(0.38 0 0);
  --ink-faint: oklch(0.56 0 0);
  --line: oklch(0.80 0 0);
  --line-strong: oklch(0.11 0 0);
  --accent: oklch(0.11 0 0);
  --accent-soft: oklch(0.94 0 0);
  --on-accent: oklch(1 0 0);
  --overlay: oklch(0.11 0 0 / 0.80);
  --font-fa-display: var(--fam-kufi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-archivo);
  --font-en-ui: var(--fam-archivo);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none; --shadow-2: none; --shadow-lift: none;
  --hover-media-scale: 1.02;
  --gutter: 2px;
  --tracking-en-caps: 0.14em;
}

/* پایه‌ی سند. کامپوننت نیست — ریست و قواعد سراسری. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-fa-ui);
  font-size: var(--t-base);
  line-height: var(--lh-fa-body);
  letter-spacing: var(--tracking-fa);
  font-variant-numeric: tabular-nums;
  text-wrap: pretty;
}
[dir="ltr"], .en { font-family: var(--font-en-ui); line-height: var(--lh-en-body); letter-spacing: var(--tracking-en); }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-fa-display); line-height: var(--lh-fa-tight); font-weight: var(--w-bold); }
[dir="ltr"] h1, [dir="ltr"] h2, [dir="ltr"] h3, .en h1, .en h2, .en h3 { font-family: var(--font-en-display); line-height: var(--lh-en-tight); }
p { margin: 0 0 var(--s-4); max-width: var(--measure-fa); }
img, svg, video { display: block; max-width: 100%; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; transition: color var(--dur-fast) var(--ease-out); }
a:hover { color: var(--ink); }
:where(button, a, input, select, [tabindex]):focus-visible {

  padding-block: var(--s-2);
  border-block-end: var(--border-w) solid var(--line-strong);
}
[dir="ltr"] .ps-dateline { font-family: var(--font-en-ui); }

.ps-front-foot {
  margin-block-start: auto;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: var(--s-4);
  align-items: start;
  padding-block-start: var(--s-3);
  border-block-start: var(--border-w-strong) solid var(--line-strong);
}
.ps-contents { display: grid; gap: var(--s-1); font-size: var(--t-xs); line-height: 1.6; }
.ps-contents .ps-lead__n { font-family: var(--font-num); color: var(--ink); }

.ps-key {
  display: grid; align-content: start; gap: var(--s-2);
  padding: var(--s-3);
  border: var(--border-w) solid var(--line-strong);
  font-size: var(--t-xs); line-height: var(--lh-fa-tight); color: var(--ink-muted);
}
.ps-key__row { display: flex; align-items: center; gap: var(--s-2); }
.ps-key__row > :first-child { flex: none; }
.ps-key svg { width: 13px; height: 13px; fill: currentColor; flex: none; }

/* ── the sale mark: the only red on the page ──────────────── */
.ps-sale {
  background: var(--accent); color: var(--on-accent);
  border-radius: 0; padding: 1px var(--s-2);
  font-family: var(--font-fa-ui); font-size: var(--t-xs); line-height: 1.5;
  letter-spacing: var(--tracking-fa);
}
[dir="ltr"] .ps-sale { font-family: var(--font-en-ui); }

/* ── section band: title beside its standfirst ────────────── */
.ps-sect {
  display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 2fr); gap: var(--s-4);
  align-items: start;
  padding-block-end: var(--s-2);
  border-block-end: var(--border-w-strong) solid var(--line-strong);
}
.ps-sect h2 { font-size: var(--t-md); line-height: var(--lh-fa-tight); }
.ps-sect__unit { display: block; margin-block-start: var(--s-1); font-size: var(--t-xs); color: var(--ink-faint); }

/* ── product grid ─────────────────────────────────────────── */
.ps-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-inline-end: var(--border-w) solid var(--line);
  flex: 1; min-height: 0;
}
.ps-grid > .cat-card {
  display: grid;
  grid-template-columns: minmax(68px, 34%) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  gap: var(--s-2);
  padding: var(--s-2);
  border: 0;
  border-inline-start: var(--border-w) solid var(--line);
  border-block-end: var(--border-w) solid var(--line);
  min-width: 0; overflow: hidden;
}
/* The kit sizes a mounted host to fill its box; a catalogue cut keeps
   its own proportion instead, so the whole object stays in the frame. */
.ps-grid .ps-cut {
  position: relative; grid-row: span 2; align-self: start;
  height: auto; aspect-ratio: var(--ratio-media);
  background: var(--surface-alt);
  border: var(--border-w) solid var(--line-strong);
}
.ps-cut img, .ps-cut canvas { filter: grayscale(1) contrast(1.08); }
.ps-cut .ck-cue { font-size: 9px; padding: 1px 5px; gap: 3px; inset-block-end: 4px; inset-inline-start: 4px; }
.ps-cut .ck-cue svg { width: 9px; height: 9px; }

.ps-cell__text { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
.ps-cell__text > * { flex: none; }
.ps-cell__title { display: flex; align-items: baseline; gap: var(--s-2); flex-wrap: wrap; }
.ps-cell__name {
  font-size: var(--t-sm); line-height: var(--lh-fa-tight); font-weight: var(--w-bold);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.ps-cell__code {
  font-size: var(--t-xs); line-height: 1.3; color: var(--ink-faint);
  letter-spacing: var(--tracking-en); text-align: start;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ps-cell__line {
  font-size: var(--t-xs); line-height: 1.4; color: var(--ink-muted);
  margin: 0; max-width: none;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.ps-specs { display: grid; gap: 1px; margin: auto 0 0; font-size: var(--t-xs); line-height: 1.35; }
.ps-specs dt { color: var(--ink-faint); white-space: nowrap; }
.ps-specs dd { margin: 0; min-width: 0; }
.ps-specs .ps-lead { min-width: 0; }

.ps-cell__foot {
  grid-column: 2; display: flex; align-items: center; gap: var(--s-2);
  padding-block-start: var(--s-1);
  border-block-start: var(--border-w) solid var(--line);
}
.ps-cell__foot .cat-price { font-size: var(--t-sm); flex: 1; min-width: 0; white-space: nowrap; }
.ps-add { flex: none; }
.ps-add[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ps-add svg { width: 16px; height: 16px; fill: currentColor; }

/* ── reference page ───────────────────────────────────────── */
.ps-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--s-4); align-items: start; }
.ps-split > * { display: grid; align-content: start; gap: var(--s-2); min-width: 0; }
.ps-split > * + * { padding-inline-start: var(--s-4); border-inline-start: var(--border-w) solid var(--line); }
.ps-table { font-size: var(--t-xs); }
.ps-table th, .ps-table td { padding: var(--s-1) var(--s-2); }
.ps-table th { width: auto; }
.ps-table thead th {
  color: var(--ink); font-weight: var(--w-bold);
  border-block-end: var(--border-w-strong) solid var(--line-strong);
}
.ps-std { display: grid; gap: var(--s-2); font-size: var(--t-xs); line-height: var(--lh-fa-tight); }
.ps-std__code {
  font-family: var(--font-num); font-size: var(--t-xs); color: var(--ink);
  white-space: nowrap;
}
.ps-std__row { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: var(--s-2); align-items: baseline; }
.ps-std__row span:last-child { color: var(--ink-muted); }

/* ── inquiry page ─────────────────────────────────────────── */
.ps-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
.ps-form .cat-search { min-height: var(--tap-min); padding-inline: var(--s-3); }
.ps-form input { font-size: var(--t-sm); font-family: inherit; }
.ps-inq { flex: 1 1 auto; min-height: 0; overflow-y: auto; gap: 0; align-content: start; border-block-start: var(--border-w) solid var(--line); }
.ps-inq .cat-inquiry__row {
  grid-template-columns: 34px minmax(0, 1fr) auto;
  gap: var(--s-2); padding: 0 var(--s-2); border: 0;
  border-block-end: var(--border-w) solid var(--line);
}
.ps-inq__cut { width: 34px; aspect-ratio: var(--ratio-media); border: var(--border-w) solid var(--line); }
.ps-inq__cut img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
.ps-inq__name { font-size: var(--t-xs); line-height: var(--lh-fa-tight); min-width: 0; }
.ps-inq__name b { font-weight: var(--w-bold); }
.ps-inq__name span { color: var(--ink-faint); font-family: var(--font-num); }
.ps-inq__qty { display: flex; align-items: center; gap: 0; }
.ps-inq__qty .cat-btn { border-color: var(--line); }
.ps-inq__n { min-width: 2.5ch; text-align: center; font-family: var(--font-num); font-size: var(--t-sm); }
.ps-inq__empty { margin: 0; border-style: dashed; padding: var(--s-5) var(--s-4); font-size: var(--t-xs); }
.ps-total {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  padding-block-start: var(--s-2);
  border-block-start: var(--border-w-strong) solid var(--line-strong);
  font-size: var(--t-sm);
}
.ps-total__sum { margin-inline-start: auto; font-family: var(--font-num); }
.ps-contact { font-size: var(--t-xs); line-height: var(--lh-fa-tight); color: var(--ink-muted); }
.ps-contact b { color: var(--ink); font-weight: var(--w-bold); }

/* ── paging controls ──────────────────────────────────────── */
.ps-nav {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: var(--s-3) var(--s-6);
  padding: var(--s-3) var(--s-4);
  border-block-start: var(--border-w) solid var(--line);
}
.ps-nav .cat-btn { gap: var(--s-2); padding-inline: var(--s-4); font-size: var(--t-sm); }
.ps-nav svg { width: 16px; height: 16px; fill: currentColor; }
.ps-btn-next svg { transform: scaleX(-1); }
[dir="ltr"] .ps-btn-next svg { transform: none; }
[dir="ltr"] .ps-btn-prev svg { transform: scaleX(-1); }
.ps-counter { display: grid; justify-items: center; gap: 1px; min-width: 9ch; }
.ps-counter__n { font-family: var(--font-num); font-size: var(--t-md); line-height: 1; direction: ltr; }
.ps-counter__s { font-size: var(--t-xs); color: var(--ink-muted); white-space: nowrap; }

.ps-picker { display: flex; align-items: stretch; gap: var(--s-2); }
.ps-thumb {
  display: grid; justify-items: center; gap: 2px;
  padding: var(--s-1) var(--s-2);
  background: var(--surface); color: var(--ink-faint);
  border: var(--border-w) solid var(--line); border-radius: 0;
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.ps-thumb:hover { color: var(--ink); border-color: var(--line-strong); }
.ps-thumb[aria-current="true"] { color: var(--ink); border-color: var(--line-strong); border-width: var(--border-w-strong); }
.ps-thumb svg { width: 52px; height: 38px; display: block; fill: currentColor; }
.ps-thumb__cap { font-family: var(--font-num); font-size: 10px; line-height: 1.2; direction: ltr; }

/* ── the page flip ────────────────────────────────────────── */
/* Only the leaf being turned moves; the spread it uncovers stays put,
   the way a page behaves in a bound book. Turning back runs the same
   keyframes in reverse so the leaf returns from the side it left. */
.ps-leaf.cat-flip-enter, .ps-leaf.cat-flip-exit { backface-visibility: hidden; }
.ps-turn--back .cat-flip-enter { animation-name: cat-flip-out; animation-direction: reverse; }

/* ── narrow viewports: the spread unbinds into stacked pages ── */
@media (max-width: 900px) {
  html, body { overflow: auto; }
  .ps-shell { height: auto; min-height: 100dvh; }
  .ps-stage { container-type: normal; padding-inline: 0; }
  .ps-spread { width: 100%; aspect-ratio: auto; max-height: none; perspective: none; }
  .ps-leaf { position: static; grid-template-columns: minmax(0, 1fr); }
  .ps-gutter { display: none; }
  .ps-page { overflow: visible; }
  .ps-page + .ps-page { border-block-start: var(--border-w-strong) solid var(--line-strong); }
  .ps-grid { grid-template-columns: minmax(0, 1fr); }
  .ps-form { grid-template-columns: minmax(0, 1fr); }
  .ps-inq { overflow: visible; }
}

/* ── print: one spread per sheet ──────────────────────────── */
@media print {
  @page { size: landscape; margin: 10mm; }
  html, body { height: auto; overflow: visible; }
  .ps-shell { display: block; height: auto; }
  .ps-stage { display: block; padding: 0; container-type: normal; }
  .ps-spread { display: block; width: 100%; max-height: none; aspect-ratio: auto; border: 0; perspective: none; }
  .ps-leaf, .ps-leaf[hidden] {
    display: grid !important;
    position: static; aspect-ratio: var(--ratio-spread);
    border: var(--border-w) solid var(--line-strong);
    break-inside: avoid; break-after: page;
    animation: none !important;
  }
  .ps-leaf:last-of-type { break-after: auto; }
  .ps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .ps-inq { overflow: visible; }
  .ps-add, .ps-inq__qty .cat-btn { visibility: hidden; }
}
</style>
</head>
<body>
<div class="ps-shell" id="shell"></div>
<script>
/* inlined from shared/catalog-kit.js */
/* ============================================================
   catalog-kit.js — mechanisms shared by every catalog variant.

   Three things every variant gets, wired by one call to CatalogKit.mount():

     1. Procedural placeholder artwork. Deterministic per seed, so a
        product keeps its look across reloads and across variants. No
        network, no stock photos. Swap in real photography by putting a
        real URL in the media descriptor's `src`.

     2. A detail viewer. Click any media and it opens: zoom to the point
        you clicked, drag to pan, wheel/pinch to scale, numbered hotspots
        that name the part you are looking at, a thumbnail strip, and
        keyboard control throughout.

     3. A video player. Give a media descriptor a real `src` and it plays
        that file through a <video>. Give it none and it plays a
        synthetic clip rendered to canvas on a real timeline — play,
        pause, scrub, seek, mute and loop all behave exactly as they will
        once the real footage lands.

   Nothing here knows about themes. Colours come from the design-system
   custom properties, so a catalog changes style by changing data-theme.
   ============================================================ */
(function (global) {
  'use strict';

  /* ── deterministic randomness ─────────────────────────────
     Same seed, same artwork — on every reload, in every variant. */

  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function rng(seed) {
    var a = hash(seed);
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pick(rand, list) {
    return list[Math.floor(rand() * list.length) % list.length];
  }

  function round(n, places) {
    var f = Math.pow(10, places == null ? 2 : places);
    return Math.round(n * f) / f;
  }

  /* ── procedural artwork ───────────────────────────────────
     A product shot is a lit backdrop, a subject, a contact shadow and
     film grain. Each subject is drawn from primitives, so the result
     reads as an object on a surface rather than as an abstract pattern. */

  var PALETTES = {
    warm:    { bg: ['#efe9df', '#e6ddcd'], sub: ['#b08256', '#8d6440', '#c99b6b'], acc: '#a8613a', deep: '#41342a' },
    stone:   { bg: ['#e9e7e2', '#d9d6cf'], sub: ['#8e8d88', '#6f6e6a', '#a8a6a0'], acc: '#5d5c58', deep: '#33322f' },
    ink:     { bg: ['#e8e8ea', '#d4d5d9'], sub: ['#3d4148', '#23262b', '#585d66'], acc: '#1a1c20', deep: '#111316' },
    sage:    { bg: ['#e4e9e1', '#d3dbcf'], sub: ['#7d9070', '#5f7355', '#96a889'], acc: '#4f6347', deep: '#2c382a' },
    clay:    { bg: ['#f0e4dd', '#e4d1c6'], sub: ['#c07a5e', '#a15c42', '#d59b80'], acc: '#8f4b31', deep: '#4a2a1e' },
    indigo:  { bg: ['#e3e6ee', '#cfd5e4'], sub: ['#5a6b95', '#3f4d72', '#7887ac'], acc: '#33406a', deep: '#1c2440' },
    amber:   { bg: ['#f4ead7', '#ecdcbc'], sub: ['#d0a558', '#b98c3f', '#e0bd86'], acc: '#96702c', deep: '#4c3a16' },
    rose:    { bg: ['#f2e5e5', '#e6cfd0'], sub: ['#b87b81', '#9a5f65', '#cf989d'], acc: '#8a4f56', deep: '#472a2d' }
  };

  var PALETTE_NAMES = Object.keys(PALETTES);

  var SUBJECTS = ['bottle', 'chair', 'lamp', 'vase', 'bag', 'watch', 'shoe', 'textile'];

  /* Each subject returns SVG markup drawn inside a 0..1000 square. */
  var draw = {
    bottle: function (r, c) {
      var w = 150 + r() * 70, neck = 46 + r() * 22, shoulder = 300 + r() * 70;
      return (
        '<path d="M' + (500 - neck) + ' 250 L' + (500 - neck) + ' ' + shoulder +
        ' Q' + (500 - w) + ' ' + (shoulder + 70) + ' ' + (500 - w) + ' ' + (shoulder + 160) +
        ' L' + (500 - w) + ' 790 Q' + (500 - w) + ' 840 ' + (500 - w + 50) + ' 840' +
        ' L' + (500 + w - 50) + ' 840 Q' + (500 + w) + ' 840 ' + (500 + w) + ' 790' +
        ' L' + (500 + w) + ' ' + (shoulder + 160) +
        ' Q' + (500 + w) + ' ' + (shoulder + 70) + ' ' + (500 + neck) + ' ' + shoulder +
        ' L' + (500 + neck) + ' 250 Z" fill="url(#body)"/>' +
        '<rect x="' + (500 - neck - 8) + '" y="' + (200 + r() * 30) + '" width="' + (neck * 2 + 16) +
        '" height="58" rx="6" fill="' + c.deep + '" opacity="0.85"/>' +
        '<rect x="' + (500 - w * 0.62) + '" y="' + (shoulder + 230) + '" width="' + w * 1.24 +
        '" height="' + (170 + r() * 60) + '" rx="4" fill="#fff" opacity="0.9"/>' +
        '<rect x="' + (500 - w * 0.4) + '" y="' + (shoulder + 280) + '" width="' + w * 0.8 +
        '" height="10" rx="5" fill="' + c.acc + '" opacity="0.8"/>'
      );
    },
    chair: function (r, c) {
      var seatY = 590 + r() * 40;        /* top of the seat slab */
      var half = 165 + r() * 35;         /* seat half-width */
      var backTop = 250 + r() * 70;
      var backHalf = half * (0.62 + r() * 0.16);
      var legH = 840 - seatY - 54;
      /* Back legs read first, then the backrest, then the seat slab on
         top of both — so the parts stack the way a chair actually does. */
      return (
        '<rect x="' + (500 - half + 26) + '" y="' + (seatY + 40) + '" width="20" height="' + legH +
        '" rx="4" fill="' + c.deep + '" opacity="0.55"/>' +
        '<rect x="' + (500 + half - 46) + '" y="' + (seatY + 40) + '" width="20" height="' + legH +
        '" rx="4" fill="' + c.deep + '" opacity="0.55"/>' +
        '<path d="M' + (500 - backHalf) + ' ' + (seatY + 10) +
        ' L' + (500 - backHalf * 0.86) + ' ' + backTop +
        ' Q500 ' + (backTop - 42) + ' ' + (500 + backHalf * 0.86) + ' ' + backTop +
        ' L' + (500 + backHalf) + ' ' + (seatY + 10) + ' Z" fill="url(#body)"/>' +
        '<rect x="' + (500 - half) + '" y="' + seatY + '" width="' + half * 2 +
        '" height="54" rx="10" fill="url(#body)"/>' +
        '<rect x="' + (500 - half) + '" y="' + (seatY + 44) + '" width="' + half * 2 +
        '" height="10" rx="5" fill="' + c.deep + '" opacity="0.28"/>' +
        '<rect x="' + (500 - half + 18) + '" y="' + (seatY + 54) + '" width="22" height="' + legH +
        '" rx="5" fill="' + c.deep + '"/>' +
        '<rect x="' + (500 + half - 40) + '" y="' + (seatY + 54) + '" width="22" height="' + legH +
        '" rx="5" fill="' + c.deep + '"/>'
      );
    },
    lamp: function (r, c) {
      var shadeW = 180 + r() * 80, shadeY = 250 + r() * 60;
      return (
        '<path d="M' + (500 - shadeW * 0.55) + ' ' + shadeY + ' L' + (500 + shadeW * 0.55) + ' ' + shadeY +
        ' L' + (500 + shadeW) + ' ' + (shadeY + 200) + ' L' + (500 - shadeW) + ' ' + (shadeY + 200) + ' Z" fill="url(#body)"/>' +
        '<ellipse cx="500" cy="' + (shadeY + 200) + '" rx="' + shadeW + '" ry="22" fill="#fff" opacity="0.55"/>' +
        '<rect x="494" y="' + (shadeY + 200) + '" width="12" height="' + (820 - shadeY - 200) + '" fill="' + c.deep + '"/>' +
        '<ellipse cx="500" cy="828" rx="' + (110 + r() * 40) + '" ry="26" fill="' + c.deep + '"/>'
      );
    },
    vase: function (r, c) {
      var belly = 190 + r() * 80, mouth = 90 + r() * 50, top = 240 + r() * 50;
      return (
        '<path d="M' + (500 - mouth) + ' ' + top +
        ' C' + (500 - belly) + ' ' + (top + 200) + ' ' + (500 - belly) + ' ' + (top + 320) + ' ' + (500 - belly * 0.6) + ' 820' +
        ' L' + (500 + belly * 0.6) + ' 820' +
        ' C' + (500 + belly) + ' ' + (top + 320) + ' ' + (500 + belly) + ' ' + (top + 200) + ' ' + (500 + mouth) + ' ' + top + ' Z" fill="url(#body)"/>' +
        '<ellipse cx="500" cy="' + top + '" rx="' + mouth + '" ry="' + (mouth * 0.28) + '" fill="' + c.deep + '" opacity="0.7"/>' +
        '<path d="M' + (500 - belly * 0.5) + ' ' + (top + 300) + ' Q500 ' + (top + 260) + ' ' + (500 + belly * 0.5) + ' ' + (top + 300) +
        '" stroke="' + c.acc + '" stroke-width="' + (6 + r() * 8) + '" fill="none" opacity="0.75"/>'
      );
    },
    bag: function (r, c) {
      var w = 210 + r() * 70, top = 400 + r() * 50, h = 330 + r() * 60;
      return (
        '<path d="M' + (500 - w * 0.62) + ' ' + top + ' Q500 ' + (top - 190 - r() * 60) + ' ' + (500 + w * 0.62) + ' ' + top +
        '" stroke="' + c.deep + '" stroke-width="' + (20 + r() * 12) + '" fill="none"/>' +
        '<rect x="' + (500 - w) + '" y="' + top + '" width="' + w * 2 + '" height="' + h + '" rx="' + (10 + r() * 24) + '" fill="url(#body)"/>' +
        '<rect x="' + (500 - w) + '" y="' + (top + h * 0.42) + '" width="' + w * 2 + '" height="' + (26 + r() * 18) + '" fill="' + c.deep + '" opacity="0.5"/>' +
        '<circle cx="500" cy="' + (top + h * 0.42 + 20) + '" r="' + (16 + r() * 10) + '" fill="' + c.acc + '"/>'
      );
    },
    watch: function (r, c) {
      var rad = 150 + r() * 60;
      return (
        '<rect x="' + (500 - rad * 0.45) + '" y="' + (500 - rad - 210) + '" width="' + rad * 0.9 + '" height="240" rx="26" fill="' + c.deep + '"/>' +

    this.nextBtn = this._iconBtn(ICONS.next, t.next, function () { self.step(1); });

      else if (e.key === 'ArrowLeft') { e.preventDefault(); self._arrow(-1); }
      else if (e.key === ' ' && self.stage.dataset.mode === 'video') { e.preventDefault(); self.togglePlay(); }

  Viewer.prototype._arrow = function (dir) {

    if (this.stage.dataset.mode === 'video') {

  Viewer.prototype._trap = function (e) {

  Viewer.prototype.show = function (items, index, meta) {

  Viewer.prototype.step = function (dir) {

  Viewer.prototype._teardownMedia = function () {

  Viewer.prototype._closeHot = function () {

    card.querySelector('h4').textContent = h.title;

    card.style.top = 'calc(' + h.y + '% + 10px)';

  Viewer.prototype._renderVideo = function (d) {

    this.stage.appendChild(frame);

    if (d.src) {

      v.addEventListener('loadedmetadata', function () {
        if (v.videoWidth && v.videoHeight) { self._ratio = v.videoWidth / v.videoHeight; self.fitFrame(); }
        self._tick(0, v.duration || 0);

      v.addEventListener('play', function () { self._setPlayIcon(true); });
      v.addEventListener('pause', function () { self._setPlayIcon(false); });
      frame.appendChild(v);

      var c = el('canvas');
      frame.appendChild(c);
      this._ratio = 0.8;

      clip.render();
      /* Give the first frames a moment to decode, then roll. */
      setTimeout(function () { if (self.clip === clip) { clip.play(); self._setPlayIcon(true); } }, 120);

  Viewer.prototype._tick = function (time, dur) {

    this.scrub.value = String(Math.round(frac * 1000));

  Viewer.prototype._setPlayIcon = function (playing) {

    else return;

  /* ── inline media on a card ───────────────────────────────

  function mountMedia(host, descriptors, meta, viewer, lang) {

  function h(tag, props) {
    var node = document.createElement(tag);
    if (props) {
      for (var k in props) {
        var v = props[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'text') node.textContent = v;
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) append(node, arguments[i]);
    return node;
  }

  function append(node, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(node, c); }); return; }
    node.append(child);
  }

      h('h2', { class: 'ps-h', text: t.sections.order.name }),
      h('p', { class: 'ps-note', text: t.orderLead }),
      h('div', { class: 'ps-form' }, field('name', t.fName), field('city', t.fCity), field('phone', t.fPhone)),
      list,
      h('div', { class: 'ps-total' },
        h('span', {}, h('b', { text: t.inqTotal }), document.createTextNode(' '), count),
        h('span', { class: 'ps-total__sum' }, total, document.createTextNode(' '),
          h('span', { class: 'cat-price__unit', text: t.unit })),
        h('button', {
          type: 'button', class: 'cat-btn cat-btn--ghost no-print',
          html: ICONS.print + '<span>' + t.printSheet + '</span>',
          onclick: function () { window.print(); }
        })
      ),
      h('div', { class: 'ps-contact' },
        h('b', { text: t.contactTitle }), document.createTextNode(' — ' + t.contact + ' — '),
        h('a', { href: 'mailto:' + t.email, class: 'num', text: t.email })
      )
    ]);
  }

  /* ── the leaves ───────────────────────────────────────────── */

  var LEAF_SHAPES = [['masthead', 'grid'], ['grid', 'grid'], ['text', 'form']];

  function leaf(index) {
    var pages;
    if (index === 0) pages = [mastheadPage(), productPage(2, 'verso', 'wear', 0, 4)];
    else if (index === 1) pages = [productPage(3, 'recto', 'tools', 4, 8), productPage(4, 'verso', 'safety', 8, 12)];
    else pages = [guidePage(), inquiryPage()];

    return h('div', { class: 'ps-leaf' },
      pages[0],
      h('div', { class: 'ps-gutter', 'aria-hidden': 'true' }),
      pages[1]
    );
  }

  /* ── the page picker's schematic thumbnails ───────────────── */

  function thumbHalf(shape, ox) {
    var bar = function (x, y, w, hh) {
      return '<rect x="' + (ox + x) + '" y="' + y + '" width="' + w + '" height="' + hh + '"/>';
    };
    var box = function (x, y, w, hh) {
      return '<rect x="' + (ox + x) + '" y="' + y + '" width="' + w + '" height="' + hh +
        '" fill="none" stroke="currentColor" stroke-width=".6"/>';
    };
    var lines = function (x, y, w, n, step) {
      var out = '';
      for (var i = 0; i < n; i++) out += bar(x, y + i * step, w, 0.7);
      return out;
    };
    if (shape === 'masthead') {
      return bar(3, 5, 24, 2.6) + lines(3, 11, 24, 2, 2.4) +
        lines(3, 18, 7, 7, 2.6) + lines(11.5, 18, 7, 7, 2.6) + lines(20, 18, 7, 7, 2.6);
    }
    if (shape === 'grid') {
      return lines(3, 5, 24, 2, 2.4) + box(3, 12, 11.5, 12) + box(15.5, 12, 11.5, 12) +
        box(3, 25, 11.5, 12) + box(15.5, 25, 11.5, 12);
    }
    if (shape === 'text') {
      return bar(3, 5, 24, 1.6) + box(3, 10, 24, 9) + lines(3, 22, 11, 6, 2.6) + lines(16, 22, 11, 6, 2.6);
    }
    return bar(3, 5, 24, 1.6) + lines(3, 10, 24, 1, 0) + box(3, 14, 24, 16) + lines(3, 33, 24, 3, 2.6);
  }

  function thumbArt(shapes) {
    return '<svg viewBox="0 0 60 44" aria-hidden="true">' +
      '<rect x=".4" y=".4" width="59.2" height="43.2" fill="none" stroke="currentColor" stroke-width=".8"/>' +
      '<rect x="29.6" y=".4" width=".8" height="43.2"/>' +
      thumbHalf(shapes[0], 0) + thumbHalf(shapes[1], 30) + '</svg>';
  }

  /* ── chrome ───────────────────────────────────────────────── */

  function buildChrome() {
    var t = L();

    var langBox = h('div', { class: 'cat-lang', role: 'group', 'aria-label': t.langFa + ' / ' + t.langEn },
      h('button', { type: 'button', text: t.langFa, 'aria-pressed': String(state.lang === 'fa'), onclick: function () { setLang('fa'); } }),
      h('button', { type: 'button', text: t.langEn, lang: 'en', 'aria-pressed': String(state.lang === 'en'), onclick: function () { setLang('en'); } })
    );

    refs.inquiryBtn = h('button', {
      type: 'button', class: 'cat-btn cat-btn--ghost',
      onclick: function () { goTo(2); }
    }, h('span', { html: ICONS.sheet }), h('span', { text: t.inquiryBtn }), h('span', { class: 'ps-count' }));
    refs.inquiryBtn.querySelector('svg').style.cssText = 'width:16px;height:16px;fill:currentColor';

    var bar = h('header', { class: 'cat-toolbar ps-bar no-print' },
      h('div', { class: 'ps-mark' },
        h('span', { class: 'ps-mark__fa', text: t.brand }),
        h('span', { class: 'ps-mark__en', text: 'Alborz Workgear' })
      ),
      h('span', { class: 'ps-edition', text: t.season }),
      refs.inquiryBtn,
      iconBtn(ICONS.print, t.printBtn, '', function () { window.print(); }),
      langBox
    );
    bar.querySelectorAll('.cat-btn--icon svg').forEach(function (s) {
      s.style.cssText = 'width:18px;height:18px;fill:currentColor';
    });

    refs.spread = h('div', { class: 'cat-spread ps-spread', role: 'group', 'aria-label': t.season });
    var stage = h('main', { class: 'ps-stage' }, refs.spread);

    refs.counterN = h('span', { class: 'ps-counter__n' });
    refs.counterS = h('span', { class: 'ps-counter__s' });
    refs.prev = h('button', { type: 'button', class: 'cat-btn cat-btn--ghost ps-btn-prev', onclick: function () { step(-1); } },
      h('span', { html: ICONS.chev }), h('span', { text: t.prev }));
    refs.next = h('button', { type: 'button', class: 'cat-btn cat-btn--ghost ps-btn-next', onclick: function () { step(1); } },
      h('span', { text: t.next }), h('span', { html: ICONS.chev }));

    refs.picker = h('div', { class: 'ps-picker', role: 'group', 'aria-label': t.pickerLabel });
    LEAF_SHAPES.forEach(function (shapes, i) {
      var folios = (i * 2 + 1) + ' & ' + (i * 2 + 2);
      var btn = h('button', {
        type: 'button', class: 'ps-thumb',
        'aria-label': t.folios(i * 2 + 1, i * 2 + 2, TOTAL_PAGES),
        onclick: function () { goTo(i); }
      },
        h('span', { html: thumbArt(shapes) }),
        h('span', { class: 'ps-thumb__cap', text: digits(folios.replace(' & ', '–')) })
      );
      refs.picker.append(btn);
    });

    refs.status = h('p', { class: 'ps-vh', role: 'status', 'aria-live': 'polite' });

    var nav = h('footer', { class: 'ps-nav no-print' },
      h('div', { class: 'cat-pagenav' },
        refs.prev,
        h('div', { class: 'ps-counter' }, refs.counterN, refs.counterS),
        refs.next
      ),
      refs.picker,
      refs.status
    );

    shell.replaceChildren(bar, stage, nav);
  }

  /* ── rendering ────────────────────────────────────────────── */

  function render() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = L().dir;
    buildChrome();

    leaves = [leaf(0), leaf(1), leaf(2)];
    leaves.forEach(function (node, i) {
      node.hidden = i !== state.spread;
      refs.spread.append(node);
    });
    mountAllMedia();
    renderInquiry();
    syncChrome();
  }

  function mountAllMedia() {
    PRODUCTS.forEach(function (p) {
      var c = copy(p);
      var hotspots = c.hot.map(function (spot) {
        return { x: spot[0], y: spot[1], title: spot[2], body: spot[3] };
      });
      var media = CatalogKit.defaultMedia(p.sku, hotspots, { subject: p.subject, palette: p.palette });
      refs.spread.querySelectorAll('[data-sku="' + p.sku + '"]').forEach(function (host) {
        CatalogKit.mountMedia(host, media, { title: c.name, sku: p.sku }, state.lang);
      });
    });
  }

  function syncChrome() {
    var t = L();
    var first = state.spread * 2 + 1;
    refs.counterN.textContent = digits(state.spread + 1) + ' / ' + digits(LEAF_SHAPES.length);
    refs.counterS.textContent = t.folios(first, first + 1, TOTAL_PAGES);
    refs.prev.disabled = state.spread === 0;
    refs.next.disabled = state.spread === LEAF_SHAPES.length - 1;
    Array.prototype.forEach.call(refs.picker.children, function (btn, i) {
      btn.setAttribute('aria-current', String(i === state.spread));
    });
    refs.status.textContent = t.status(first, first + 1, TOTAL_PAGES);
  }

  function syncInquiryChrome() {
    var t = L();
    var units = state.inquiry.reduce(function (sum, line) { return sum + line.qty; }, 0);
    refs.inquiryBtn.querySelector('.ps-count').textContent = units ? '(' + digits(units) + ')' : '';
    refs.spread.querySelectorAll('[data-add]').forEach(function (btn) {
      var on = !!lineFor(btn.dataset.add);
      btn.setAttribute('aria-pressed', String(on));
      btn.innerHTML = on ? ICONS.minus : ICONS.plus;
      btn.setAttribute('aria-label', on ? t.remove : t.add);
      btn.title = btn.getAttribute('aria-label');
    });
  }

  function lineFor(sku) {
    for (var i = 0; i < state.inquiry.length; i++) if (state.inquiry[i].sku === sku) return state.inquiry[i];
    return null;
  }

  function toggleItem(sku) {
    var line = lineFor(sku);
    if (line) state.inquiry = state.inquiry.filter(function (l) { return l.sku !== sku; });
    else state.inquiry.push({ sku: sku, qty: 1 });
    renderInquiry();
  }

  function setQty(sku, delta) {
    var line = lineFor(sku);
    if (!line) return;
    line.qty = Math.max(1, Math.min(99, line.qty + delta));
    renderInquiry();
  }

  function renderInquiry() {
    var t = L();
    var rows;
    if (!state.inquiry.length) {
      rows = [h('p', { class: 'cat-inquiry__empty ps-inq__empty', text: t.inqEmpty })];
    } else {
      rows = state.inquiry.map(function (line) {
        var p = product(line.sku);
        var c = copy(p);
        var minus = iconBtn(ICONS.minus, t.less, '', function () { setQty(line.sku, -1); });
        var plus = iconBtn(ICONS.plus, t.more, '', function () { setQty(line.sku, 1); });
        var drop = iconBtn(ICONS.close, t.remove, '', function () { toggleItem(line.sku); });
        [minus, plus, drop].forEach(function (b) {
          b.querySelector('svg').style.cssText = 'width:15px;height:15px;fill:currentColor';
        });
        return h('div', { class: 'cat-inquiry__row' },
          h('span', { class: 'ps-inq__cut' },
            h('img', { src: CatalogKit.image(p.sku + '-a', { w: 80, h: 100, subject: p.subject, palette: p.palette }), alt: '' })),
          h('span', { class: 'ps-inq__name' },
            h('b', { text: c.name }), document.createTextNode(' '),
            h('span', { text: p.sku })),
          h('span', { class: 'ps-inq__qty' },
            minus, h('span', { class: 'ps-inq__n', text: digits(line.qty) }), plus, drop)
        );
      });
    }
    refs.list.replaceChildren.apply(refs.list, rows);

    var sum = state.inquiry.reduce(function (acc, line) { return acc + product(line.sku).price * line.qty; }, 0);
    refs.total.textContent = num(sum);
    refs.count.textContent = t.items(state.inquiry.length);
    syncInquiryChrome();
  }

  /* ── paging ───────────────────────────────────────────────── */

  function reducedMotion() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
      window.matchMedia('(max-width: 900px)').matches;
  }

  function finishTurn() {
    if (!turning) return;
    var job = turning;
    turning = null;
    job.moving.classList.remove('cat-flip-exit', 'cat-flip-enter');
    job.moving.style.zIndex = '';
    job.still.style.zIndex = '';
    job.from.hidden = true;
    refs.spread.classList.remove('ps-turn--back');
  }

  function goTo(index) {
    if (index < 0 || index >= leaves.length || index === state.spread) return;
    finishTurn();
    var from = leaves[state.spread];
    var to = leaves[index];
    var back = index < state.spread;
    state.spread = index;
    to.hidden = false;
    syncChrome();

    if (reducedMotion()) { from.hidden = true; return; }

    /* Forward, the leaf you are leaving turns away; backward, the leaf
       you are returning to turns back over the one you are leaving. */
    var moving = back ? to : from;
    var still = back ? from : to;
    refs.spread.classList.toggle('ps-turn--back', back);
    moving.classList.add(back ? 'cat-flip-enter' : 'cat-flip-exit');
    moving.style.zIndex = '2';
    still.style.zIndex = '1';
    turning = { moving: moving, still: still, from: from };
    var done = function (e) {
      if (e.target !== moving) return;
      moving.removeEventListener('animationend', done);
      if (turning && turning.moving === moving) finishTurn();
    };
    moving.addEventListener('animationend', done);
  }

  function step(dir) { goTo(state.spread + dir); }

  function setLang(lang) {
    if (lang === state.lang) return;
    state.lang = lang;
    finishTurn();
    render();
  }

  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector('.ck-scrim')) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var forward = L().dir === 'rtl' ? 'ArrowLeft' : 'ArrowRight';
    var backward = L().dir === 'rtl' ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === forward) { e.preventDefault(); step(1); }
    else if (e.key === backward) { e.preventDefault(); step(-1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(leaves.length - 1); }
  });

  /* Printing lays every leaf out, so the flip must not be mid-flight. */
  window.addEventListener('beforeprint', finishTurn);

  render();
})();
</script>
</body>
</html>
