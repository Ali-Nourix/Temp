<!doctype html>
<html dir="rtl" lang="fa" data-theme="craft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سپیدار — دفترِ بافت</title>
<style>
/* inlined from shared/ds-core.css */
/* ============================================================
   Catalog Design System — core tokens, 8 themes, components
   Extracted from "سیستم طراحی کاتالوگ دیجیتال v1".
   Fonts load from Google Fonts; every family has a system fallback,
   so the file still renders offline.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@400;500;700;800&family=Markazi+Text:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Space+Grotesk:wght@400;500;700&family=Vazirmatn:wght@300;400;500;700;900&display=swap');

:root {
  /* خانواده‌های پایه — تم‌ها این‌ها را روی نقش‌ها می‌نشانند */
  --fam-vazir: "Vazirmatn", system-ui, sans-serif;
  --fam-naskh: "Noto Naskh Arabic", "Vazirmatn", serif;
  --fam-kufi: "Noto Kufi Arabic", "Vazirmatn", sans-serif;
  --fam-markazi: "Markazi Text", "Noto Naskh Arabic", serif;
  --fam-newsreader: "Newsreader", Georgia, serif;
  --fam-cormorant: "Cormorant Garamond", Georgia, serif;
  --fam-grotesk: "Space Grotesk", "Helvetica Neue", sans-serif;
  --fam-archivo: "Archivo", "Helvetica Neue", sans-serif;
  --fam-manrope: "Manrope", "Helvetica Neue", sans-serif;
  --fam-sourceserif: "Source Serif 4", Georgia, serif;
  --fam-plex: "IBM Plex Sans", "Helvetica Neue", sans-serif;
  --fam-plexmono: "IBM Plex Mono", ui-monospace, monospace;
}

/* پالت پایه و نام‌های معنایی. مقدارها با oklch نوشته شده‌اند تا هم‌خانواده بمانند.
   قاعده: هیچ کامپوننتی رنگ خام ننویسد — فقط نام معنایی. */
:root {
  /* خنثی‌های گرم (پیش‌فرض ادیتوریال) */
  --n-00: oklch(0.99 0.004 85);
  --n-05: oklch(0.975 0.005 85);
  --n-10: oklch(0.945 0.006 85);
  --n-20: oklch(0.90 0.007 85);
  --n-30: oklch(0.80 0.008 85);
  --n-50: oklch(0.62 0.009 85);
  --n-70: oklch(0.44 0.010 85);
  --n-85: oklch(0.28 0.010 80);
  --n-95: oklch(0.17 0.010 80);
  --n-100: oklch(0.12 0.008 80);

  /* نقش‌های معنایی — تم پیش‌فرض: editorial */
  --bg: var(--n-05);
  --bg-alt: var(--n-00);
  --surface: var(--n-00);
  --surface-alt: var(--n-10);
  --ink: var(--n-95);
  --ink-muted: var(--n-70);
  --ink-faint: var(--n-50);
  --line: oklch(0.88 0.006 85);
  --line-strong: var(--n-85);
  --accent: oklch(0.52 0.12 42);
  --accent-soft: oklch(0.94 0.03 42);
  --on-accent: oklch(0.99 0.004 85);
  --focus: oklch(0.55 0.15 250);
  --overlay: oklch(0.17 0.01 80 / 0.55);

  /* وضعیت‌ها — فقط همین سه؛ رنگ‌های معنایی بیشتری اضافه نکن */
  --ok: oklch(0.55 0.10 150);
  --warn: oklch(0.70 0.13 75);
  --danger: oklch(0.53 0.15 25);
}

/* تایپوگرافی دوزبانه. دو محور جدا: fa (فارسی/RTL) و en (لاتین/LTR).
   قاعده‌ی سخت: line-height فارسی همیشه بلندتر از لاتین؛ letter-spacing روی فارسی صفر. */
:root {
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-grotesk);
  --font-num: var(--fam-plexmono);

  /* مقیاس سیال — یک مقیاس برای هر دو زبان */
  --t-xs: clamp(0.72rem, 0.70rem + 0.15vw, 0.80rem);
  --t-sm: clamp(0.82rem, 0.79rem + 0.2vw, 0.92rem);
  --t-base: clamp(0.95rem, 0.90rem + 0.25vw, 1.06rem);
  --t-md: clamp(1.10rem, 1.02rem + 0.4vw, 1.30rem);
  --t-lg: clamp(1.35rem, 1.18rem + 0.8vw, 1.75rem);
  --t-xl: clamp(1.75rem, 1.40rem + 1.6vw, 2.60rem);
  --t-2xl: clamp(2.30rem, 1.70rem + 2.8vw, 3.80rem);
  --t-3xl: clamp(3.00rem, 2.00rem + 4.6vw, 5.60rem);

  --lh-fa-tight: 1.42;
  --lh-fa-body: 1.85;
  --lh-en-tight: 1.10;
  --lh-en-body: 1.55;

  --w-light: 300;
  --w-regular: 400;
  --w-medium: 500;
  --w-bold: 700;
  --w-black: 900;

  --tracking-fa: 0;
  --tracking-en: 0.01em;
  --tracking-en-caps: 0.10em;

  /* حداکثر عرض خط خوانا */
  --measure-fa: 62ch;
  --measure-en: 70ch;
}

/* فاصله، شبکه، گوشه، خط. مقیاس ۴ پایه اما مقدارهای واقعی طراحی — گرد نکن. */
:root {
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;
  --s-10: 128px;

  --gutter: var(--s-5);
  --page-pad: clamp(20px, 4vw, 72px);
  --page-max: 1360px;
  --col-min: 268px;          /* حداقل عرض کارت محصول در شبکه‌ی سیال */

  --radius-none: 0px;
  --radius-media: 2px;
  --radius-card: 4px;
  --radius-control: 4px;
  --radius-pill: 999px;

  --border-w: 1px;
  --border-w-strong: 2px;

  --shadow-1: 0 1px 2px oklch(0.17 0.01 80 / 0.06);
  --shadow-2: 0 10px 30px -12px oklch(0.17 0.01 80 / 0.18);
  --shadow-lift: 0 18px 44px -18px oklch(0.17 0.01 80 / 0.28);

  --ratio-media: 4 / 5;      /* نسبت پیش‌فرض عکس محصول */
  --ratio-cover: 3 / 4;      /* کاور کاتالوگ */
  --ratio-spread: 3 / 2;     /* صفحه‌ی باز کاتالوگ */
  --tap-min: 44px;           /* حداقل هدف لمسی — هرگز کمتر */
}

/* حرکت. هر انیمیشنی که می‌سازی باید از همین توکن‌ها استفاده کند.
   قاعده: فقط transform و opacity انیمیت می‌شوند. width/height/top/left هرگز. */
:root {
  --dur-instant: 90ms;
  --dur-fast: 160ms;
  --dur-base: 240ms;
  --dur-slow: 420ms;
  --dur-page: 560ms;

  --ease-out: cubic-bezier(0.20, 0.80, 0.25, 1);
  --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-soft: cubic-bezier(0.34, 1.12, 0.64, 1);

  --hover-lift: -2px;
  --hover-media-scale: 1.03;
  --press-scale: 0.985;
  --stagger: 45ms;           /* فاصله‌ی ورود کارت‌های پشت‌سرهم؛ حداکثر ۸ کارت */
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-instant: 1ms;
    --dur-fast: 1ms;
    --dur-base: 1ms;
    --dur-slow: 1ms;
    --dur-page: 1ms;
    --hover-lift: 0px;
    --hover-media-scale: 1;
    --press-scale: 1;
    --stagger: 0ms;
  }
}

/* ۸ تم. یک تم = یک بار عوض کردن data-theme روی ریشه. هیچ کامپوننتی تم‌آگاه نیست.
   استفاده: <div data-theme="luxe"> … </div>  یا  <html data-theme="spec"> */

/* ۱. editorial — مینیمال مجله‌ای؛ فضای سفید زیاد، تایپ سریف لاتین، شبکه‌ی نامتقارن */
[data-theme="editorial"] {
  --bg: oklch(0.975 0.005 85);
  --bg-alt: oklch(0.99 0.004 85);
  --surface: oklch(0.99 0.004 85);
  --surface-alt: oklch(0.945 0.006 85);
  --ink: oklch(0.17 0.010 80);
  --ink-muted: oklch(0.44 0.010 85);
  --ink-faint: oklch(0.62 0.009 85);
  --line: oklch(0.88 0.006 85);
  --line-strong: oklch(0.28 0.010 80);
  --accent: oklch(0.52 0.12 42);
  --accent-soft: oklch(0.94 0.03 42);
  --on-accent: oklch(0.99 0.004 85);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-grotesk);
  --radius-media: 2px; --radius-card: 3px; --radius-control: 3px;
  --border-w: 1px;
  --shadow-1: 0 1px 2px oklch(0.17 0.01 80 / 0.05);
  --shadow-2: 0 12px 34px -16px oklch(0.17 0.01 80 / 0.16);
  --gutter: 28px;
}

/* ۲. luxe — تیره و طلایی؛ کم‌نور، فاصله‌ی زیاد، حرکت کند */
[data-theme="luxe"] {
  --bg: oklch(0.16 0.012 60);
  --bg-alt: oklch(0.21 0.014 60);
  --surface: oklch(0.21 0.014 60);
  --surface-alt: oklch(0.26 0.016 60);
  --ink: oklch(0.96 0.010 85);
  --ink-muted: oklch(0.78 0.014 85);
  --ink-faint: oklch(0.62 0.014 85);
  --line: oklch(0.34 0.016 70);
  --line-strong: oklch(0.72 0.070 85);
  --accent: oklch(0.79 0.098 85);
  --accent-soft: oklch(0.30 0.030 85);
  --on-accent: oklch(0.16 0.012 60);
  --overlay: oklch(0.10 0.01 60 / 0.72);
  --font-fa-display: var(--fam-markazi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-cormorant);
  --font-en-ui: var(--fam-grotesk);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none;
  --shadow-2: 0 24px 60px -28px oklch(0 0 0 / 0.6);
  --shadow-lift: 0 30px 70px -30px oklch(0 0 0 / 0.7);
  --dur-base: 340ms; --dur-slow: 620ms; --dur-page: 820ms;
  --hover-media-scale: 1.045;
  --gutter: 40px;
  --tracking-en-caps: 0.18em;
}

/* ۳. brutal — نئوبروتال؛ کنتراست بیشینه، حاشیه‌ی ضخیم، سایه‌ی سخت، حرکت تند */
[data-theme="brutal"] {
  --bg: oklch(0.985 0 0);
  --bg-alt: oklch(0.93 0.14 100);
  --surface: oklch(1 0 0);
  --surface-alt: oklch(0.95 0.16 100);
  --ink: oklch(0.13 0 0);
  --ink-muted: oklch(0.33 0 0);
  --ink-faint: oklch(0.50 0 0);
  --line: oklch(0.13 0 0);
  --line-strong: oklch(0.13 0 0);
  --accent: oklch(0.55 0.21 25);
  --accent-soft: oklch(0.93 0.14 100);
  --on-accent: oklch(1 0 0);
  --font-fa-display: var(--fam-kufi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-archivo);
  --font-en-ui: var(--fam-archivo);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 2px; --border-w-strong: 3px;
  --shadow-1: 3px 3px 0 oklch(0.13 0 0);
  --shadow-2: 6px 6px 0 oklch(0.13 0 0);
  --shadow-lift: 9px 9px 0 oklch(0.13 0 0);
  --dur-fast: 100ms; --dur-base: 140ms; --dur-slow: 220ms; --dur-page: 300ms;
  --ease-out: cubic-bezier(0.2, 1, 0.3, 1);
  --hover-lift: -3px; --hover-media-scale: 1;
  --gutter: 20px;
}

/* ۴. glass — شیشه‌ای نرم؛ blur، لایه‌های شفاف، گوشه‌های نرم. blur فقط روی چیزی که واقعاً روی محتوا شنا می‌کند */
[data-theme="glass"] {
  --bg: oklch(0.96 0.012 250);
  --bg-alt: oklch(0.98 0.008 250);
  --surface: oklch(1 0 0 / 0.72);
  --surface-alt: oklch(1 0 0 / 0.45);
  --ink: oklch(0.24 0.020 260);
  --ink-muted: oklch(0.48 0.018 260);
  --ink-faint: oklch(0.63 0.016 260);
  --line: oklch(0.55 0.02 260 / 0.18);
  --line-strong: oklch(0.45 0.03 260 / 0.35);
  --accent: oklch(0.58 0.105 255);
  --accent-soft: oklch(0.92 0.035 255);
  --on-accent: oklch(0.99 0.005 255);
  --overlay: oklch(0.30 0.02 260 / 0.35);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-manrope);
  --font-en-ui: var(--fam-manrope);
  --radius-media: 14px; --radius-card: 18px; --radius-control: 12px;
  --border-w: 1px;
  --shadow-1: 0 2px 10px -4px oklch(0.30 0.02 260 / 0.18);
  --shadow-2: 0 20px 50px -22px oklch(0.30 0.02 260 / 0.28);
  --shadow-lift: 0 26px 60px -24px oklch(0.30 0.02 260 / 0.34);
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --gutter: 26px;
}

/* ۵. press — کاتالوگ چاپی کلاسیک؛ شبکه‌ی سخت، خطوط جداکننده، سریف، بدون سایه */
[data-theme="press"] {
  --bg: oklch(0.965 0.008 92);
  --bg-alt: oklch(0.985 0.006 92);
  --surface: oklch(0.985 0.006 92);
  --surface-alt: oklch(0.935 0.010 92);
  --ink: oklch(0.22 0.014 60);
  --ink-muted: oklch(0.45 0.014 60);
  --ink-faint: oklch(0.60 0.012 60);
  --line: oklch(0.22 0.014 60 / 0.28);
  --line-strong: oklch(0.22 0.014 60);
  --accent: oklch(0.46 0.13 26);
  --accent-soft: oklch(0.92 0.035 26);
  --on-accent: oklch(0.985 0.006 92);
  --font-fa-display: var(--fam-naskh);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-sourceserif);
  --font-en-ui: var(--fam-sourceserif);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none; --shadow-2: none; --shadow-lift: none;
  --hover-lift: 0px; --hover-media-scale: 1;
  --gutter: 0px;
}

/* ۶. spec — صنعتی و جدول‌محور؛ داده اول، مونواسپیس برای اعداد، رنگ هشدار صنعتی */
[data-theme="spec"] {
  --bg: oklch(0.955 0.004 230);
  --bg-alt: oklch(0.98 0.003 230);
  --surface: oklch(0.99 0.002 230);
  --surface-alt: oklch(0.93 0.006 230);
  --ink: oklch(0.21 0.012 245);
  --ink-muted: oklch(0.44 0.012 245);
  --ink-faint: oklch(0.60 0.010 245);
  --line: oklch(0.80 0.010 245);
  --line-strong: oklch(0.35 0.014 245);
  --accent: oklch(0.52 0.135 248);
  --accent-soft: oklch(0.93 0.030 248);
  --on-accent: oklch(0.99 0.002 230);
  --warn: oklch(0.66 0.165 48);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-plex);
  --font-en-ui: var(--fam-plex);
  --font-num: var(--fam-plexmono);
  --radius-media: 2px; --radius-card: 2px; --radius-control: 2px;
  --border-w: 1px;
  --shadow-1: 0 1px 0 oklch(0.35 0.014 245 / 0.10);
  --shadow-2: 0 8px 24px -14px oklch(0.35 0.014 245 / 0.25);
  --dur-base: 180ms;
  --hover-media-scale: 1;
  --gutter: 16px;
}

/* ۷. craft — گرم و خاکی؛ کاغذ کرم، رنگ خاک رس، تایپ نرم */
[data-theme="craft"] {
  --bg: oklch(0.935 0.022 78);
  --bg-alt: oklch(0.965 0.018 78);
  --surface: oklch(0.965 0.018 78);
  --surface-alt: oklch(0.895 0.028 76);
  --ink: oklch(0.27 0.030 52);
  --ink-muted: oklch(0.47 0.030 52);
  --ink-faint: oklch(0.62 0.026 52);
  --line: oklch(0.78 0.030 70);
  --line-strong: oklch(0.42 0.034 52);
  --accent: oklch(0.52 0.095 45);
  --accent-soft: oklch(0.90 0.040 45);
  --on-accent: oklch(0.975 0.015 78);
  --font-fa-display: var(--fam-vazir);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-newsreader);
  --font-en-ui: var(--fam-newsreader);
  --radius-media: 6px; --radius-card: 10px; --radius-control: 8px;
  --border-w: 1px;
  --shadow-1: 0 1px 2px oklch(0.27 0.03 52 / 0.08);
  --shadow-2: 0 14px 32px -18px oklch(0.27 0.03 52 / 0.22);
  --ease-out: cubic-bezier(0.25, 0.9, 0.3, 1);
  --gutter: 24px;
}

/* ۸. mono — تک‌رنگ سیاه‌وسفید؛ تایپ بزرگ، بدون رنگ تزئینی، آکسان = مرکب */
[data-theme="mono"] {
  --bg: oklch(1 0 0);
  --bg-alt: oklch(0.96 0 0);
  --surface: oklch(1 0 0);
  --surface-alt: oklch(0.94 0 0);
  --ink: oklch(0.11 0 0);
  --ink-muted: oklch(0.38 0 0);
  --ink-faint: oklch(0.56 0 0);
  --line: oklch(0.80 0 0);
  --line-strong: oklch(0.11 0 0);
  --accent: oklch(0.11 0 0);
  --accent-soft: oklch(0.94 0 0);
  --on-accent: oklch(1 0 0);
  --overlay: oklch(0.11 0 0 / 0.80);
  --font-fa-display: var(--fam-kufi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-archivo);
  --font-en-ui: var(--fam-archivo);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none; --shadow-2: none; --shadow-lift: none;
  --hover-media-scale: 1.02;
  --gutter: 2px;
  --tracking-en-caps: 0.14em;
}

/* پایه‌ی سند. کامپوننت نیست — ریست و قواعد سراسری. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-fa-ui);
  font-size: var(--t-base);
  line-height: var(--lh-fa-body);
  letter-spacing: var(--tracking-fa);
  font-variant-numeric: tabular-nums;
  text-wrap: pretty;
}
[dir="ltr"], .en { font-family: var(--font-en-ui); line-height: var(--lh-en-body); letter-spacing: var(--tracking-en); }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-fa-display); line-height: var(--lh-fa-tight); font-weight: var(--w-bold); }
[dir="ltr"] h1, [dir="ltr"] h2, [dir="ltr"] h3, .en h1, .en h2, .en h3 { font-family: var(--font-en-display); line-height: var(--lh-en-tight); }
p { margin: 0 0 var(--s-4); max-width: var(--measure-fa); }
img, svg, video { display: block; max-width: 100%; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; transition: color var(--dur-fast) var(--ease-out); }
a:hover { color: var(--ink); }
:where(button, a, input, select, [tabindex]):focus-visible {

    --accent: oklch(from var(--sp-thread) l c calc(h + var(--sp-turn, 0)));
    --accent-soft: oklch(from var(--sp-thread) calc(l + 0.38) calc(c * 0.42) calc(h + var(--sp-turn, 0)));
    --sp-tint: color-mix(in oklab, var(--bg) 94%, var(--accent));
    --sp-rule: color-mix(in oklab, var(--line) 74%, var(--accent));
  }
  .sp-ch[data-ch="1"] { --sp-turn: -23; }
  .sp-ch[data-ch="2"] { --sp-turn: 35; }
  .sp-ch[data-ch="3"] { --sp-turn: 73; }
}

.sp-ch__head {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(20px, 3vw, 44px);
  align-items: start; padding-block-end: clamp(32px, 5vh, 72px);
}
.sp-ch__n {
  font-family: var(--font-num); font-size: var(--t-2xl); line-height: 1; color: var(--accent);
  padding-block-start: 0.12em;
}
.sp-ch__kicker { font-size: var(--t-xs); color: var(--ink-faint); margin-block-end: var(--s-3); }
.sp-ch h2 { font-size: var(--t-xl); font-weight: var(--w-regular); }
.sp-ch__lead { margin-block-start: var(--s-4); font-size: var(--t-md); color: var(--ink-muted); max-width: 58ch; }

/* ── scrollytelling ─────────────────────────────────────── */
.sp-scroll {
  display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
  gap: clamp(28px, 4vw, 72px); align-items: start;
}
.sp-step { min-height: 82vh; display: grid; align-content: center; padding-block: var(--s-6); }
.sp-step__body {
  border-inline-start: var(--border-w-strong) solid transparent;
  padding-inline-start: clamp(16px, 2vw, 32px);
  opacity: 0.4; transition: opacity var(--dur-slow) var(--ease-soft), border-color var(--dur-slow) var(--ease-soft);
}
.sp-step[data-on="true"] .sp-step__body,
.sp-step:focus-within .sp-step__body { opacity: 1; border-inline-start-color: var(--accent); }
.sp-step__idx { font-family: var(--font-num); font-size: var(--t-xs); color: var(--ink-faint); }
.sp-step h3 { font-size: var(--t-lg); font-weight: var(--w-regular); margin-block-start: var(--s-2); }
.sp-name-alt { font-size: var(--t-sm); color: var(--ink-muted); margin-block-start: var(--s-1); }
.sp-name-alt[dir="ltr"] { font-family: var(--font-en-ui); letter-spacing: var(--tracking-en); direction: ltr; }
.sp-name-alt[dir="rtl"] { font-family: var(--font-fa-ui); letter-spacing: var(--tracking-fa); direction: rtl; }
.sp-step__copy { margin-block-start: var(--s-5); }
.sp-step__copy p { font-size: var(--t-base); color: var(--ink); max-width: 46ch; }
.sp-step__copy p + p { color: var(--ink-muted); }
.sp-specs {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s-2) var(--s-5);
  margin: var(--s-5) 0 0; padding-block-start: var(--s-4);
  border-block-start: var(--border-w) solid var(--sp-rule); font-size: var(--t-sm);
}
.sp-specs dt { color: var(--ink-faint); }
.sp-specs dd { margin: 0; color: var(--ink-muted); }
.sp-step__foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-4);
  margin-block-start: var(--s-5);
}
.sp-step__acts { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-inline-start: auto; }
.sp-price-unit { font-size: var(--t-xs); color: var(--ink-muted); font-family: var(--font-fa-ui); }

/* ── the pinned stage ───────────────────────────────────── */
.sp-stage {
  position: sticky; inset-block-start: var(--sp-top); align-self: start;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s-4);
}
.sp-stage__foot {
  grid-column: 2; grid-row: 2; display: flex; flex-wrap: wrap; gap: var(--s-3);
  align-items: baseline; font-size: var(--t-xs); color: var(--ink-faint);
}
.sp-stage__ch { color: var(--accent); }
.sp-stage__hint { margin-inline-start: auto; }
.sp-deck {
  grid-column: 2; grid-row: 1;
  position: relative; height: var(--sp-deck-h); overflow: hidden;
  background: var(--surface); border: var(--border-w) solid var(--sp-rule);
  border-radius: var(--radius-card); box-shadow: var(--shadow-2);
}
.sp-plate {
  position: absolute; inset: 0; margin: 0;
  display: grid; grid-template-rows: auto minmax(0, 1fr);
  opacity: 0; transform: scale(1.015);
  transition: opacity var(--dur-slow) var(--ease-soft), transform var(--dur-slow) var(--ease-soft);
}
.sp-plate[data-on="true"] { opacity: 1; transform: none; }
.sp-plate__cap {
  display: flex; align-items: baseline; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); background: var(--surface);
  border-block-end: var(--border-w) solid var(--sp-rule);
}
.sp-plate__idx { font-family: var(--font-num); font-size: var(--t-xs); color: var(--accent); }
.sp-plate__name { font-family: var(--font-fa-display); font-size: var(--t-base); }
.sp-plate__hint { margin-inline-start: auto; font-size: var(--t-xs); color: var(--ink-faint); }
.sp-plate__media { position: relative; overflow: hidden; }

/* ── chapter progress rail ──────────────────────────────── */
.sp-rail { grid-column: 1; grid-row: 1; position: relative; width: var(--tap-min); }
.sp-rail::before {
  content: ""; position: absolute; inset-block: 22px;
  inset-inline-start: calc(var(--tap-min) / 2 - 1px); width: 2px;
  background: var(--line); border-radius: var(--radius-pill);
}
.sp-rail__fill {
  position: absolute; inset-block-start: 22px; height: calc(100% - 44px);
  inset-inline-start: calc(var(--tap-min) / 2 - 1px); width: 2px;
  background: var(--accent); border-radius: var(--radius-pill);
  transform-origin: top; transform: scaleY(var(--sp-p, 0));
}
.sp-rail__ticks {
  position: relative; display: flex; flex-direction: column; justify-content: space-between;
  height: 100%; margin: 0; padding: 0; list-style: none;
}
.sp-tick {
  width: var(--tap-min); height: var(--tap-min); display: grid; place-items: center;
  padding: 0; background: none; border: 0; cursor: pointer;
}
.sp-tick__dot {
  width: 9px; height: 9px; border-radius: var(--radius-pill);
  background: var(--surface); border: var(--border-w-strong) solid var(--line-strong);
  transition: transform var(--dur-base) var(--ease-soft), background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
}
.sp-tick:hover .sp-tick__dot { border-color: var(--accent); }
.sp-tick[aria-current="true"] .sp-tick__dot { background: var(--accent); border-color: var(--accent); transform: scale(1.5); }

/* ── the product row between chapters ───────────────────── */
.sp-shelf { margin-block-start: clamp(40px, 6vh, 88px); padding-block-start: var(--s-6); border-block-start: var(--border-w) solid var(--sp-rule); }
.sp-shelf__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-4); margin-block-end: var(--s-5); }
.sp-shelf__head h3 { font-size: var(--t-md); font-weight: var(--w-regular); }
.sp-shelf__note { font-size: var(--t-sm); color: var(--ink-faint); margin-inline-start: auto; }
.sp-shelf__grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gutter); }
.sp-card { background: var(--surface); border-color: var(--sp-rule); }
/* the kit stretches its host to fill; the card wants the media ratio kept */
.sp-card .cat-card__media { flex: 0 0 auto; height: auto; }
.sp-card__line { font-size: var(--t-sm); color: var(--ink-muted); }
.sp-card__act { display: flex; gap: var(--s-2); }
.sp-card__act .cat-btn { flex: 1; padding-inline: var(--s-3); font-size: var(--t-sm); }
.sp-add[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ── colophon ───────────────────────────────────────────── */
.sp-colophon {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(24px, 4vw, 72px);
  padding-block: clamp(48px, 8vh, 104px); border-block-start: var(--border-w) solid var(--line);
}
.sp-colophon h2 { font-size: var(--t-lg); font-weight: var(--w-regular); margin-block-end: var(--s-4); }
.sp-colophon p { color: var(--ink-muted); }
.sp-colophon__meta { display: grid; gap: var(--s-3); align-content: start; font-size: var(--t-sm); }
.sp-colophon__meta div { display: flex; justify-content: space-between; gap: var(--s-4); padding-block-end: var(--s-3); border-block-end: var(--border-w) solid var(--line); }
.sp-colophon__meta dt, .sp-colophon__meta span:first-child { color: var(--ink-faint); }

/* ── price-inquiry sheet ────────────────────────────────── */
.sp-scrim {
  position: fixed; inset: 0; z-index: 55; background: var(--overlay);
  opacity: 0; visibility: hidden; transition: opacity var(--dur-base) var(--ease-out), visibility var(--dur-base);
}
.sp-scrim[data-open="true"] { opacity: 1; visibility: visible; }
.sp-sheet {
  position: fixed; z-index: 56; inset-block: 0; inset-inline-end: 0;
  width: min(430px, 100%); display: flex; flex-direction: column;
  background: var(--surface); border-inline-start: var(--border-w) solid var(--line);
  box-shadow: var(--shadow-lift);
  translate: 100% 0; visibility: hidden;
  transition: translate var(--dur-slow) var(--ease-soft), visibility var(--dur-slow);
}
[dir="rtl"] .sp-sheet { translate: -100% 0; }
.sp-sheet[data-open="true"] { translate: 0 0; visibility: visible; }
.sp-sheet__head {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4) var(--s-5); border-block-end: var(--border-w) solid var(--line);
}
.sp-sheet__head h2 { font-size: var(--t-md); font-weight: var(--w-regular); }
.sp-sheet__head .cat-btn { margin-inline-start: auto; }
.sp-sheet__body { flex: 1; overflow: auto; padding: var(--s-5); }
.sp-row {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: var(--s-4); align-items: center;
  padding: var(--s-3); background: var(--bg-alt);
  border: var(--border-w) solid var(--line); border-radius: var(--radius-card);
}
.sp-row img { width: 56px; aspect-ratio: var(--ratio-media); object-fit: cover; border-radius: var(--radius-media); }
.sp-row__name { font-size: var(--t-sm); }
.sp-row__meta { display: flex; flex-wrap: wrap; gap: var(--s-2); font-size: var(--t-xs); color: var(--ink-muted); }
.sp-sheet__foot { padding: var(--s-5); border-block-start: var(--border-w) solid var(--line); display: grid; gap: var(--s-4); }
.sp-sum { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4); }
.sp-sum__label { font-size: var(--t-sm); color: var(--ink-muted); }
.sp-sheet__note { font-size: var(--t-xs); color: var(--ink-faint); margin: 0; }
.sp-sheet textarea {
  width: 100%; min-height: 128px; padding: var(--s-3); font: inherit; font-size: var(--t-xs);
  font-family: var(--font-num); color: var(--ink); background: var(--bg-alt);
  border: var(--border-w) solid var(--line); border-radius: var(--radius-control); resize: vertical;
}
.sp-icon { width: 18px; height: 18px; flex: 0 0 auto; }

/* ── linear layout: reduced motion, and any narrow screen ── */
.sp-scroll[data-mode="linear"] { grid-template-columns: minmax(0, 1fr); gap: 0; }
.sp-scroll[data-mode="linear"] .sp-stage { display: none; }
.sp-scroll[data-mode="pinned"] .sp-step__slot { display: none; }
.sp-scroll[data-mode="linear"] .sp-step {
  min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 0.86fr);
  gap: clamp(24px, 4vw, 64px); align-items: start; align-content: start;
  padding-block: clamp(28px, 5vh, 56px);
}
.sp-scroll[data-mode="linear"] .sp-step + .sp-step { border-block-start: var(--border-w) solid var(--sp-rule); }
.sp-scroll[data-mode="linear"] .sp-step__body { opacity: 1; border-inline-start-color: var(--accent); }
.sp-scroll[data-mode="linear"] .sp-plate {
  position: relative; inset: auto; opacity: 1; transform: none;
  height: clamp(320px, 54vh, 520px); overflow: hidden;
  background: var(--surface); border: var(--border-w) solid var(--sp-rule);
  border-radius: var(--radius-card); box-shadow: var(--shadow-1);
}

@media (max-width: 1080px) {
  .sp-shelf__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .sp-cover { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .sp-cover__plate { max-width: 420px; }
  .sp-note { grid-template-columns: minmax(0, 1fr); gap: var(--s-5); }
  .sp-nav { display: none; }
  .sp-colophon { grid-template-columns: minmax(0, 1fr); }
  .sp-scroll[data-mode="linear"] .sp-step { grid-template-columns: minmax(0, 1fr); }
  .sp-scroll[data-mode="linear"] .sp-step__slot { order: -1; margin-block-end: var(--s-5); }
}
@media (max-width: 560px) {
  .sp-shelf__grid { grid-template-columns: minmax(0, 1fr); }
  .sp-sheet { width: 100%; }
}

@media print {
  .sp-skip, .sp-scrim, .sp-sheet, .sp-rail, .cat-toolbar { display: none !important; }
  .sp-stage { display: none; }
  .sp-scroll { display: block; }
  .sp-step { min-height: 0; padding-block: var(--s-4); break-inside: avoid; }
  .sp-step__body { opacity: 1; }
  .sp-shelf__grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sp-ch { background: none; padding-block: var(--s-6); }
}
</style>
</head>

<script>
/* inlined from shared/catalog-kit.js */
/* ============================================================
   catalog-kit.js — mechanisms shared by every catalog variant.

   Three things every variant gets, wired by one call to CatalogKit.mount():

     1. Procedural placeholder artwork. Deterministic per seed, so a
        product keeps its look across reloads and across variants. No
        network, no stock photos. Swap in real photography by putting a
        real URL in the media descriptor's `src`.

     2. A detail viewer. Click any media and it opens: zoom to the point
        you clicked, drag to pan, wheel/pinch to scale, numbered hotspots
        that name the part you are looking at, a thumbnail strip, and
        keyboard control throughout.

     3. A video player. Give a media descriptor a real `src` and it plays
        that file through a <video>. Give it none and it plays a
        synthetic clip rendered to canvas on a real timeline — play,
        pause, scrub, seek, mute and loop all behave exactly as they will
        once the real footage lands.

   Nothing here knows about themes. Colours come from the design-system
   custom properties, so a catalog changes style by changing data-theme.
   ============================================================ */
(function (global) {
  'use strict';

  /* ── deterministic randomness ─────────────────────────────
     Same seed, same artwork — on every reload, in every variant. */

  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function rng(seed) {
    var a = hash(seed);
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pick(rand, list) {
    return list[Math.floor(rand() * list.length) % list.length];
  }

  function round(n, places) {
    var f = Math.pow(10, places == null ? 2 : places);
    return Math.round(n * f) / f;
  }

  /* ── procedural artwork ───────────────────────────────────
     A product shot is a lit backdrop, a subject, a contact shadow and
     film grain. Each subject is drawn from primitives, so the result
     reads as an object on a surface rather than as an abstract pattern. */

  var PALETTES = {
    warm:    { bg: ['#efe9df', '#e6ddcd'], sub: ['#b08256', '#8d6440', '#c99b6b'], acc: '#a8613a', deep: '#41342a' },
    stone:   { bg: ['#e9e7e2', '#d9d6cf'], sub: ['#8e8d88', '#6f6e6a', '#a8a6a0'], acc: '#5d5c58', deep: '#33322f' },
    ink:     { bg: ['#e8e8ea', '#d4d5d9'], sub: ['#3d4148', '#23262b', '#585d66'], acc: '#1a1c20', deep: '#111316' },
    sage:    { bg: ['#e4e9e1', '#d3dbcf'], sub: ['#7d9070', '#5f7355', '#96a889'], acc: '#4f6347', deep: '#2c382a' },
    clay:    { bg: ['#f0e4dd', '#e4d1c6'], sub: ['#c07a5e', '#a15c42', '#d59b80'], acc: '#8f4b31', deep: '#4a2a1e' },
    indigo:  { bg: ['#e3e6ee', '#cfd5e4'], sub: ['#5a6b95', '#3f4d72', '#7887ac'], acc: '#33406a', deep: '#1c2440' },
    amber:   { bg: ['#f4ead7', '#ecdcbc'], sub: ['#d0a558', '#b98c3f', '#e0bd86'], acc: '#96702c', deep: '#4c3a16' },
    rose:    { bg: ['#f2e5e5', '#e6cfd0'], sub: ['#b87b81', '#9a5f65', '#cf989d'], acc: '#8a4f56', deep: '#472a2d' }
  };

  var PALETTE_NAMES = Object.keys(PALETTES);

  var SUBJECTS = ['bottle', 'chair', 'lamp', 'vase', 'bag', 'watch', 'shoe', 'textile'];

  /* Each subject returns SVG markup drawn inside a 0..1000 square. */
  var draw = {
    bottle: function (r, c) {
      var w = 150 + r() * 70, neck = 46 + r() * 22, shoulder = 300 + r() * 70;

  /* ── small helpers ───────────────────────────────────── */

  var updaters = [];
  function bind(fn) { updaters.push(fn); fn(); }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function digits(str) { return lang === 'fa' ? K.toFa(String(str)).replace(/,/g, '٬') : String(str); }
  function money(v) { return digits(v.toLocaleString('en-US')); }
  function pad(n) { return digits(n < 10 ? '0' + n : String(n)); }

  function media(p) {
    var hot = p.hot.map(function (h) {
      return { x: h.x, y: h.y, title: h[lang][0], body: h[lang][1] };
    });
    return [
      { type: 'photo', seed: p.sku + '-a', hotspots: hot, subject: p.subject, palette: p.palette },
      { type: 'video', seed: p.sku + '-a', duration: 12, subject: p.subject, palette: p.palette },
      { type: 'spin', seed: p.sku + '-a', subject: p.subject, palette: p.palette },
      { type: 'photo', seed: p.sku + '-b', hotspots: [], subject: p.subject, palette: p.palette }
    ];
  }

  var mounts = [];
  function mount(host, p) {
    mounts.push({ host: host, cls: host.className, p: p });
    K.mountMedia(host, media(p), { title: p[lang].name, sku: p.sku }, lang);
  }

  /* mountMedia binds its own click handler every time it runs, and the
     handler holds the viewer of the language it was mounted in. Swapping
     in a fresh node before re-mounting keeps a language change from
     leaving the old viewer stacked behind the new one. */
  function remount() {
    mounts.forEach(function (m) {
      var fresh = document.createElement(m.host.tagName);
      fresh.className = m.cls;
      m.host.replaceWith(fresh);
      m.host = fresh;
      K.mountMedia(fresh, media(m.p), { title: m.p[lang].name, sku: m.p.sku }, lang);
    });
  }

  function openDetail(p) { K.open(media(p), { title: p[lang].name, sku: p.sku }, lang, 0); }

  /* ── the price-inquiry list ──────────────────────────── */

  var list = [];

  function toggleItem(p) {
    var i = list.indexOf(p);

    renderList();
  }

  function renderList() {
    countEl.textContent = digits(list.length);
    countEl.hidden = list.length === 0;
    sumEl.textContent = money(list.reduce(function (s, p) { return s + p.price; }, 0));
    addButtons.forEach(function (b) { b.sync(); });

    sheetBody.innerHTML = '';
    if (!list.length) {
      sheetBody.appendChild(el('p', 'cat-inquiry__empty', t('empty')));
    } else {
      var wrap = el('div', 'cat-inquiry');
      list.forEach(function (p) {

        img.src = K.thumb({ seed: p.sku + '-a', subject: p.subject, palette: p.palette });
        img.alt = '';
        var mid = el('div');

        rm.type = 'button';

        rm.addEventListener('click', function () { toggleItem(p); });
        row.appendChild(img); row.appendChild(mid); row.appendChild(rm);
        wrap.appendChild(row);
      });
      sheetBody.appendChild(wrap);

    textOut.value = list.map(function (p) {
      return p.sku + '  ' + p.en.name + '  ' + p.price.toLocaleString('en-US') + ' toman';
    }).join('\n');
    textToggle.disabled = !list.length;
  }

  function setSheet(open) {
    if (open) lastFocus = document.activeElement;
    sheet.dataset.open = open ? 'true' : 'false';
    scrim.dataset.open = open ? 'true' : 'false';
    sheet.setAttribute('aria-hidden', open ? 'false' : 'true');
    /* the page keeps its scroll position; only the sheet scrolls while it is up */
    document.documentElement.style.overflow = open ? 'hidden' : '';
    document.querySelectorAll('[data-region]').forEach(function (n) { n.inert = open; });
    /* the sheet is not focusable until the style change has been applied */
    if (open) requestAnimationFrame(function () { document.getElementById('sp-close-sheet').focus(); });
    else if (lastFocus) { lastFocus.focus(); lastFocus = null; }
  }

  openSheetBtn.addEventListener('click', function () { setSheet(true); });
  document.getElementById('sp-close-sheet').addEventListener('click', function () { setSheet(false); });
  scrim.addEventListener('click', function () { setSheet(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.dataset.open === 'true') { e.preventDefault(); setSheet(false); }

  textToggle.addEventListener('click', function () {
    var show = textOut.hidden;

      var cPriceN = el('span', 'num');
      var cUnit = el('span', 'cat-price__unit sp-price-unit');
      cPrice.appendChild(cPriceN); cPrice.appendChild(cUnit);
      var sku = el('span', 'cat-sku num', p.sku);
      meta.appendChild(cPrice); meta.appendChild(sku);
      var acts = el('div', 'sp-card__act');
      var cDetail = el('button', 'cat-btn cat-btn--quiet');
      cDetail.type = 'button';
      cDetail.addEventListener('click', function () { openDetail(p); });
      acts.appendChild(cDetail); acts.appendChild(addButton(p, true));
      card.appendChild(cardMedia); card.appendChild(cName); card.appendChild(cAlt);
      card.appendChild(cLine); card.appendChild(meta); card.appendChild(acts);
      grid.appendChild(card);

      bind(function () {
        var s = p[lang];
        cName.textContent = s.name;
        cAlt.textContent = (lang === 'fa' ? p.en : p.fa).name;
        cAlt.dir = lang === 'fa' ? 'ltr' : 'rtl';
        cLine.textContent = s.line;
        cPriceN.textContent = money(p.price);
        cUnit.textContent = t('toman');
        cDetail.textContent = t('detail');
      });

      mount(cardMedia, p);
    });

    story.appendChild(section);
    shelves.push(grid);
    chapters.push({ n: c.n, el: section, scroll: scroll, stage: stage, deck: deck, steps: steps, live: false, shown: 0, target: 0, active: -1 });
  });

  /* The staggered entrance is only worth spending when the row is about
     to be looked at. */
  var shelfObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('cat-stagger');
      shelfObserver.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -12% 0px' });
  shelves.forEach(function (g) { shelfObserver.observe(g); });

  /* ── scrollytelling ──────────────────────────────────────
     The stage is a plain sticky box: nothing hijacks the wheel and
     nothing is repositioned by script, so fast scrolling and resizes
     cost only the observer work below. An IntersectionObserver over a
     band across the middle of the stage drives which step is current;
     geometry inside the callback settles ties when several steps cross
     the band between two frames. */

  function reduced() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  var stepIndex = new Map();
  chapters.forEach(function (ch) {
    ch.steps.forEach(function (s, i) { stepIndex.set(s.el, { ch: ch, i: i }); });
  });

  var inBand = new Set();
  var stepObserver = null;

  function focusLine() {
    var live = chapters.find(function (ch) { return ch.live; }) || chapters[0];
    var box = live.stage.getBoundingClientRect();
    var mid = box.height ? box.top + box.height / 2 : window.innerHeight * 0.45;
    return Math.min(Math.max(mid, window.innerHeight * 0.25), window.innerHeight * 0.75);
  }

  function buildStepObserver() {
    if (stepObserver) stepObserver.disconnect();
    inBand.clear();
    var vh = window.innerHeight;
    var line = focusLine();
    var band = Math.max(60, vh * 0.12);
    var top = Math.round(line - band / 2);
    var bottom = Math.round(vh - line - band / 2);
    stepObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) inBand.add(e.target); else inBand.delete(e.target);
      });
      var touched = new Set();
      entries.forEach(function (e) {
        var rec = stepIndex.get(e.target);
        if (rec) touched.add(rec.ch);
      });
      touched.forEach(resolve);
      schedule();
    }, { rootMargin: -top + 'px 0px ' + -bottom + 'px 0px', threshold: 0 });
    chapters.forEach(function (ch) {
      ch.steps.forEach(function (s) { stepObserver.observe(s.el); });
    });
  }

  function setActive(ch, i) {
    if (ch.active === i) return;
    ch.active = i;
    var pinned = ch.scroll.dataset.mode === 'pinned';
    ch.steps.forEach(function (s, j) {
      var on = j === i;
      s.el.dataset.on = on || !pinned ? 'true' : 'false';
      s.plate.dataset.on = on || !pinned ? 'true' : 'false';
      s.plate.inert = pinned && !on;
      s.tick.setAttribute('aria-current', on ? 'true' : 'false');
    });
  }

  function resolve(ch) {
    var line = focusLine();
    var best = -1, dist = Infinity;
    ch.steps.forEach(function (s, i) {
      var box = s.el.getBoundingClientRect();
      var banded = inBand.has(s.el);
      var d = Math.abs(box.top + box.height / 2 - line) - (banded ? 1e6 : 0);
      if (d < dist) { dist = d; best = i; }
    });
    if (best > -1) setActive(ch, best);
  }

  function progressOf(ch) {
    var box = ch.scroll.getBoundingClientRect();
    var line = focusLine();
    if (!box.height) return 0;
    return Math.min(Math.max((line - box.top) / box.height, 0), 1);
  }

  var frame = 0;
  function schedule() { if (!frame) frame = requestAnimationFrame(tick); }

  function tick() {
    frame = 0;
    var again = false;
    var soft = !reduced();
    chapters.forEach(function (ch) {
      if (!ch.live) return;
      ch.target = progressOf(ch);
      var gap = ch.target - ch.shown;
      if (!soft || Math.abs(gap) < 0.001) ch.shown = ch.target;
      else { ch.shown += gap * 0.16; again = true; }
      ch.el.style.setProperty('--sp-p', ch.shown.toFixed(4));
      resolve(ch);
    });
    if (again) schedule();
  }

  var chapterObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      var ch = chapters.find(function (c) { return c.el === e.target; });
      if (!ch) return;
      ch.live = e.isIntersecting;
      if (ch.live) { ch.shown = progressOf(ch); resolve(ch); }
      var link = navHost.querySelector('[data-ch-link="' + ch.n + '"]');
      if (link) link.setAttribute('aria-current', ch.live ? 'true' : 'false');
    });
    schedule();
  }, { threshold: 0 });
  chapters.forEach(function (ch) { chapterObserver.observe(ch.el); });

  /* Pinning only makes sense with room beside the text, and it is the
     wrong idea entirely when motion is unwelcome: in both cases each
     plate moves back into its own step and the column reads straight
     down. */
  function layout() {
    var linear = reduced() || window.innerWidth < 900;
    chapters.forEach(function (ch) {
      var mode = linear ? 'linear' : 'pinned';
      if (ch.scroll.dataset.mode === mode) return;
      ch.scroll.dataset.mode = mode;
      ch.steps.forEach(function (s) {
        (linear ? s.slot : ch.deck).appendChild(s.plate);
        s.plate.inert = false;
        if (linear) { s.plate.dataset.on = 'true'; s.el.dataset.on = 'true'; }
      });
      if (!linear) { ch.active = -1; resolve(ch); }
    });
    buildStepObserver();
    schedule();
  }

  var barBox = new ResizeObserver(function (entries) {
    var h = entries[0].target.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--sp-bar', Math.round(h) + 'px');
  });
  barBox.observe(document.querySelector('.sp-bar'));

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
    schedule();
  });
  window.addEventListener('scroll', schedule, { passive: true });
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', layout);

  /* ── language ────────────────────────────────────────── */

  function setLang(next) {
    if (next === lang) return;
    lang = next;
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
    });
    paintStatic();
    updaters.forEach(function (fn) { fn(); });
    renderList();
    remount();
    schedule();
  }

  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang); });
  });

  paintStatic();
  renderList();
  layout();
  schedule();
})();
</script>
</body>
</html>
