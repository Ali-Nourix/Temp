<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="press">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارافزار البرز — فهرست فصلی</title>
<link rel="stylesheet" href="../shared/ds-core.css">
<style>
/* ── page-level token overrides ───────────────────────────────
   Newsprint is monochrome: the theme's single red is spent on the
   sale mark and nothing else, so the focus ring is drawn in ink. */
:root {
  --focus: var(--ink);
  --col-min: 200px;
}

html, body { height: 100%; overflow: hidden; }

.ps-shell {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100dvh;
}

.ps-vh {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* ── masthead bar ─────────────────────────────────────────── */
.ps-bar { padding-inline: var(--s-4); gap: var(--s-4); }
.ps-bar a { color: var(--ink); }
.ps-mark { display: grid; gap: 1px; margin-inline-end: auto; }
.ps-mark__fa { font-family: var(--font-fa-display); font-size: var(--t-md); line-height: var(--lh-fa-tight); font-weight: var(--w-bold); }
.ps-mark__en {
  font-family: var(--font-en-ui); font-size: var(--t-xs); line-height: 1;
  letter-spacing: var(--tracking-en-caps); text-transform: uppercase;
  color: var(--ink-muted); direction: ltr; text-align: start;
}
.ps-edition { font-size: var(--t-xs); color: var(--ink-muted); white-space: nowrap; }
.ps-bar .cat-btn { padding-inline: var(--s-3); gap: var(--s-2); font-size: var(--t-sm); }
.ps-bar .cat-lang > button { font-size: var(--t-sm); }
.ps-count { font-family: var(--font-num); }

/* ── the book block ───────────────────────────────────────── */
.ps-stage {
  display: grid; place-items: center; min-height: 0;
  padding: var(--s-4) var(--s-4) 0;
  container-type: size;
}
.ps-spread { width: min(100%, 150cqh); max-height: 100cqh; }

.ps-leaf {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: 1fr auto 1fr;
  background: var(--surface);
}
/* An author `display` beats the UA rule for [hidden], so restate it. */
.ps-leaf[hidden] { display: none; }
.ps-gutter {
  width: clamp(14px, 2.4cqw, 30px);
  border-inline: var(--border-w) solid var(--line);
  background: var(--surface-alt);
}

.ps-page {
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  min-width: 0; min-height: 0; overflow: hidden;
  padding: clamp(10px, 1.5cqw, 20px);
  font-family: var(--font-fa-display);
}
[dir="ltr"] .ps-page { font-family: var(--font-en-display); }

/* ── running heads and folios ─────────────────────────────── */
.ps-head, .ps-folio {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3);
  font-family: var(--font-fa-ui); font-size: var(--t-xs); line-height: 1.2;
  color: var(--ink-muted); letter-spacing: var(--tracking-fa);
}
[dir="ltr"] .ps-head, [dir="ltr"] .ps-folio {
  font-family: var(--font-en-ui);
  text-transform: uppercase; letter-spacing: var(--tracking-en-caps);
}
.ps-head {
  padding-block-end: var(--s-2);
  border-block-end: var(--border-w-strong) solid var(--line-strong);
  margin-block-end: var(--s-3);
}
.ps-folio {
  padding-block-start: var(--s-2); margin-block-start: var(--s-3);
  border-block-start: var(--border-w) solid var(--line);
}
.ps-page--verso .ps-folio, .ps-page--verso .ps-head { flex-direction: row-reverse; }
.ps-folio__n { font-family: var(--font-num); font-size: var(--t-sm); color: var(--ink); }

.ps-body { min-height: 0; display: flex; flex-direction: column; gap: var(--s-3); }

/* ── shared newsprint furniture ───────────────────────────── */
.ps-h {
  font-size: var(--t-lg); line-height: var(--lh-fa-tight);
  padding-block-end: var(--s-2);
  border-block-end: var(--border-w) solid var(--line-strong);
}
.ps-h--sm { font-size: var(--t-md); padding-block-end: var(--s-1); }
.ps-page .cat-btn { align-self: start; font-size: var(--t-sm); gap: var(--s-2); padding-inline: var(--s-4); }
.ps-page .cat-btn svg { width: 15px; height: 15px; fill: currentColor; }
.ps-cols {
  columns: 2; column-gap: var(--s-4);
  column-rule: var(--border-w) solid var(--line);
  font-size: var(--t-xs); line-height: var(--lh-fa-body);
  text-align: justify; color: var(--ink-muted);
}
.ps-cols--3 { columns: 3; }
.ps-cols p { margin: 0 0 var(--s-2); max-width: none; }
.ps-cols p:last-child { margin-block-end: 0; }
.ps-cols p::first-letter { font-weight: var(--w-bold); color: var(--ink); }

.ps-note { font-size: var(--t-xs); line-height: var(--lh-fa-body); color: var(--ink-muted); margin: 0; max-width: none; }

/* Dot leader — used by the contents list and every spec line. */
.ps-lead { display: flex; align-items: baseline; gap: var(--s-2); }
.ps-lead__fill { flex: 1; align-self: center; border-block-end: var(--border-w) dotted var(--line); }

/* ── masthead page ────────────────────────────────────────── */
.ps-nameplate { text-align: center; padding-block-end: var(--s-2); }
.ps-nameplate__over {
  font-family: var(--font-fa-ui); font-size: var(--t-xs);
  letter-spacing: var(--tracking-fa); color: var(--ink-muted);
}
[dir="ltr"] .ps-nameplate__over {
  font-family: var(--font-en-ui);
  text-transform: uppercase; letter-spacing: var(--tracking-en-caps);
}
.ps-nameplate__title {
  font-size: var(--t-xl); line-height: 1.05; font-weight: var(--w-bold);
  padding-block: var(--s-1) var(--s-2); margin-block-start: var(--s-1);
  border-block: var(--border-w-strong) solid var(--line-strong);
}
.ps-nameplate__latin {
  font-family: var(--font-en-display); font-size: var(--t-sm);
  letter-spacing: var(--tracking-en-caps); text-transform: uppercase;
  direction: ltr; padding-block-start: var(--s-2); color: var(--ink-muted);
}
.ps-dateline {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
  gap: var(--s-1) var(--s-4);
  font-family: var(--font-fa-ui); font-size: var(--t-xs); color: var(--ink-muted);
  padding-block: var(--s-2);
  border-block-end: var(--border-w) solid var(--line-strong);
}
[dir="ltr"] .ps-dateline { font-family: var(--font-en-ui); }

.ps-front-foot {
  margin-block-start: auto;
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--s-4);
  padding-block-start: var(--s-3);
  border-block-start: var(--border-w-strong) solid var(--line-strong);
}
.ps-contents { display: grid; gap: var(--s-1); font-size: var(--t-xs); }
.ps-contents .ps-lead__n { font-family: var(--font-num); color: var(--ink); }

.ps-key {
  display: grid; align-content: start; gap: var(--s-2);
  padding: var(--s-3);
  border: var(--border-w) solid var(--line-strong);
  font-size: var(--t-xs); line-height: var(--lh-fa-tight); color: var(--ink-muted);
}
.ps-key__row { display: flex; align-items: center; gap: var(--s-2); }
.ps-key svg { width: 13px; height: 13px; fill: currentColor; flex: none; }

/* ── the sale mark: the only red on the page ──────────────── */
.ps-sale {
  background: var(--accent); color: var(--on-accent);
  border-radius: 0; padding: 1px var(--s-2);
  font-family: var(--font-fa-ui); font-size: var(--t-xs); line-height: 1.5;
  letter-spacing: var(--tracking-fa);
}
[dir="ltr"] .ps-sale { font-family: var(--font-en-ui); }

/* ── section band: title beside its standfirst ────────────── */
.ps-sect {
  display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 2fr); gap: var(--s-4);
  align-items: start;
  padding-block-end: var(--s-2);
  border-block-end: var(--border-w-strong) solid var(--line-strong);
}
.ps-sect h2 { font-size: var(--t-md); line-height: var(--lh-fa-tight); }
.ps-sect__unit { display: block; margin-block-start: var(--s-1); font-size: var(--t-xs); color: var(--ink-faint); }

/* ── product grid ─────────────────────────────────────────── */
.ps-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-inline-end: var(--border-w) solid var(--line);
  flex: 1; min-height: 0;
}
.ps-grid > .cat-card {
  display: grid;
  grid-template-columns: minmax(68px, 34%) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  gap: var(--s-2);
  padding: var(--s-2);
  border: 0;
  border-inline-start: var(--border-w) solid var(--line);
  border-block-end: var(--border-w) solid var(--line);
  min-width: 0; overflow: hidden;
}
/* The kit sizes a mounted host to fill its box; a catalogue cut keeps
   its own proportion instead, so the whole object stays in the frame. */
.ps-grid .ps-cut {
  position: relative; grid-row: span 2; align-self: start;
  height: auto; aspect-ratio: var(--ratio-media);
  background: var(--surface-alt);
  border: var(--border-w) solid var(--line-strong);
}
.ps-cut img, .ps-cut canvas { filter: grayscale(1) contrast(1.08); }
.ps-cut .ck-cue { font-size: 9px; padding: 1px 5px; gap: 3px; inset-block-end: 4px; inset-inline-start: 4px; }
.ps-cut .ck-cue svg { width: 9px; height: 9px; }

.ps-cell__text { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
.ps-cell__text > * { flex: none; }
.ps-cell__title { display: flex; align-items: baseline; gap: var(--s-2); flex-wrap: wrap; }
.ps-cell__name {
  font-size: var(--t-sm); line-height: var(--lh-fa-tight); font-weight: var(--w-bold);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.ps-cell__code {
  font-size: var(--t-xs); line-height: 1.3; color: var(--ink-faint);
  letter-spacing: var(--tracking-en); text-align: start;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ps-cell__line {
  font-size: var(--t-xs); line-height: 1.4; color: var(--ink-muted);
  margin: 0; max-width: none;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.ps-specs { display: grid; gap: 1px; margin: auto 0 0; font-size: var(--t-xs); line-height: 1.35; }
.ps-specs dt { color: var(--ink-faint); white-space: nowrap; }
.ps-specs dd { margin: 0; min-width: 0; }
.ps-specs .ps-lead { min-width: 0; }

.ps-cell__foot {
  grid-column: 2; display: flex; align-items: center; gap: var(--s-2);
  padding-block-start: var(--s-1);
  border-block-start: var(--border-w) solid var(--line);
}
.ps-cell__foot .cat-price { font-size: var(--t-sm); flex: 1; min-width: 0; white-space: nowrap; }
.ps-add { flex: none; }
.ps-add[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ps-add svg { width: 16px; height: 16px; fill: currentColor; }

/* ── reference page ───────────────────────────────────────── */
.ps-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--s-4); align-items: start; }
.ps-split > * { display: grid; align-content: start; gap: var(--s-2); min-width: 0; }
.ps-split > * + * { padding-inline-start: var(--s-4); border-inline-start: var(--border-w) solid var(--line); }
.ps-table { font-size: var(--t-xs); }
.ps-table th, .ps-table td { padding: var(--s-1) var(--s-2); }
.ps-table th { width: auto; }
.ps-table thead th {
  color: var(--ink); font-weight: var(--w-bold);
  border-block-end: var(--border-w-strong) solid var(--line-strong);
}
.ps-std { display: grid; gap: var(--s-2); font-size: var(--t-xs); line-height: var(--lh-fa-tight); }
.ps-std__code {
  font-family: var(--font-num); font-size: var(--t-xs); color: var(--ink);
  white-space: nowrap;
}
.ps-std__row { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: var(--s-2); align-items: baseline; }
.ps-std__row span:last-child { color: var(--ink-muted); }

/* ── inquiry page ─────────────────────────────────────────── */
.ps-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
.ps-form .cat-search { min-height: var(--tap-min); padding-inline: var(--s-3); }
.ps-form input { font-size: var(--t-sm); font-family: inherit; }
.ps-inq { flex: 1 1 auto; min-height: 0; overflow-y: auto; gap: 0; align-content: start; border-block-start: var(--border-w) solid var(--line); }
.ps-inq .cat-inquiry__row {
  grid-template-columns: 34px minmax(0, 1fr) auto;
  gap: var(--s-2); padding: 0 var(--s-2); border: 0;
  border-block-end: var(--border-w) solid var(--line);
}
.ps-inq__cut { width: 34px; aspect-ratio: var(--ratio-media); border: var(--border-w) solid var(--line); }
.ps-inq__cut img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
.ps-inq__name { font-size: var(--t-xs); line-height: var(--lh-fa-tight); min-width: 0; }
.ps-inq__name b { font-weight: var(--w-bold); }
.ps-inq__name span { color: var(--ink-faint); font-family: var(--font-num); }
.ps-inq__qty { display: flex; align-items: center; gap: 0; }
.ps-inq__qty .cat-btn { border-color: var(--line); }
.ps-inq__n { min-width: 2.5ch; text-align: center; font-family: var(--font-num); font-size: var(--t-sm); }
.ps-inq__empty { margin: 0; border-style: dashed; padding: var(--s-5) var(--s-4); font-size: var(--t-xs); }
.ps-total {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  padding-block-start: var(--s-2);
  border-block-start: var(--border-w-strong) solid var(--line-strong);
  font-size: var(--t-sm);
}
.ps-total__sum { margin-inline-start: auto; font-family: var(--font-num); }
.ps-contact { font-size: var(--t-xs); line-height: var(--lh-fa-tight); color: var(--ink-muted); }
.ps-contact b { color: var(--ink); font-weight: var(--w-bold); }

/* ── paging controls ──────────────────────────────────────── */
.ps-nav {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: var(--s-3) var(--s-6);
  padding: var(--s-3) var(--s-4);
  border-block-start: var(--border-w) solid var(--line);
}
.ps-nav .cat-btn { gap: var(--s-2); padding-inline: var(--s-4); font-size: var(--t-sm); }
.ps-nav svg { width: 16px; height: 16px; fill: currentColor; }
.ps-btn-next svg { transform: scaleX(-1); }
[dir="ltr"] .ps-btn-next svg { transform: none; }
[dir="ltr"] .ps-btn-prev svg { transform: scaleX(-1); }
.ps-counter { display: grid; justify-items: center; gap: 1px; min-width: 9ch; }
.ps-counter__n { font-family: var(--font-num); font-size: var(--t-md); line-height: 1; direction: ltr; }
.ps-counter__s { font-size: var(--t-xs); color: var(--ink-muted); white-space: nowrap; }

.ps-picker { display: flex; align-items: stretch; gap: var(--s-2); }
.ps-thumb {
  display: grid; justify-items: center; gap: 2px;
  padding: var(--s-1) var(--s-2);
  background: var(--surface); color: var(--ink-faint);
  border: var(--border-w) solid var(--line); border-radius: 0;
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.ps-thumb:hover { color: var(--ink); border-color: var(--line-strong); }
.ps-thumb[aria-current="true"] { color: var(--ink); border-color: var(--line-strong); border-width: var(--border-w-strong); }
.ps-thumb svg { width: 52px; height: 38px; display: block; fill: currentColor; }
.ps-thumb__cap { font-family: var(--font-num); font-size: 10px; line-height: 1.2; direction: ltr; }

/* ── the page flip ────────────────────────────────────────── */
/* Only the leaf being turned moves; the spread it uncovers stays put,
   the way a page behaves in a bound book. Turning back runs the same
   keyframes in reverse so the leaf returns from the side it left. */
.ps-leaf.cat-flip-enter, .ps-leaf.cat-flip-exit { backface-visibility: hidden; }
.ps-turn--back .cat-flip-enter { animation-name: cat-flip-out; animation-direction: reverse; }

/* ── narrow viewports: the spread unbinds into stacked pages ── */
@media (max-width: 900px) {
  html, body { overflow: auto; }
  .ps-shell { height: auto; min-height: 100dvh; }
  .ps-stage { container-type: normal; padding-inline: 0; }
  .ps-spread { width: 100%; aspect-ratio: auto; max-height: none; perspective: none; }
  .ps-leaf { position: static; grid-template-columns: minmax(0, 1fr); }
  .ps-gutter { display: none; }
  .ps-page { overflow: visible; }
  .ps-page + .ps-page { border-block-start: var(--border-w-strong) solid var(--line-strong); }
  .ps-grid { grid-template-columns: minmax(0, 1fr); }
  .ps-form { grid-template-columns: minmax(0, 1fr); }
  .ps-inq { overflow: visible; }
}

/* ── print: one spread per sheet ──────────────────────────── */
@media print {
  @page { size: landscape; margin: 10mm; }
  html, body { height: auto; overflow: visible; }
  .ps-shell { display: block; height: auto; }
  .ps-stage { display: block; padding: 0; container-type: normal; }
  .ps-spread { display: block; width: 100%; max-height: none; aspect-ratio: auto; border: 0; perspective: none; }
  .ps-leaf, .ps-leaf[hidden] {
    display: grid !important;
    position: static; aspect-ratio: var(--ratio-spread);
    border: var(--border-w) solid var(--line-strong);
    break-inside: avoid; break-after: page;
    animation: none !important;
  }
  .ps-leaf:last-of-type { break-after: auto; }
  .ps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .ps-inq { overflow: visible; }
  .ps-add, .ps-inq__qty .cat-btn { visibility: hidden; }
}
</style>
</head>
<body>
<div class="ps-shell" id="shell"></div>
<script src="../shared/catalog-kit.js"></script>
<script>
(function () {
  'use strict';

  var toFa = CatalogKit.toFa;

  /* ── one string table; the DOM is built once per language ── */

  var STR = {
    fa: {
      dir: 'rtl',
      brand: 'کارافزار البرز',
      brandLatin: 'Alborz Workgear',
      edition: 'دورهٔ نهم — شمارهٔ ۳۴',
      season: 'فهرست فصلی پاییز و زمستان ۱۴۰۵',
      seasonShort: 'پاییز و زمستان ۱۴۰۵',
      dateline: 'تهران — پنجشنبه ۲۶ شهریور ۱۴۰۵',
      city: 'تهران',
      langFa: 'فارسی', langEn: 'English',
      inquiryBtn: 'برگهٔ استعلام',
      printBtn: 'چاپ',
      printSheet: 'چاپ فهرست',
      prev: 'صفحهٔ پیش',
      next: 'صفحهٔ بعد',
      of: 'از',
      spreadOf: function (n, total) { return 'صفحهٔ باز ' + toFa(n) + ' از ' + toFa(total); },
      folios: function (a, b, total) { return 'صفحهٔ ' + toFa(a) + ' و ' + toFa(b) + ' از ' + toFa(total); },
      pickerLabel: 'رفتن به صفحهٔ باز',
      pageLabel: function (n) { return 'صفحهٔ ' + toFa(n); },
      status: function (a, b, total) { return 'صفحهٔ ' + toFa(a) + ' و ' + toFa(b) + ' از ' + toFa(total) + ' باز شد.'; },

      nameplateOver: 'فهرست فصلی تجاری — پوشاک کار، ابزار دستی، لوازم ایمنی',
      masthead: [
        'این دفتر فهرست کامل پوشاک کار، ابزار دستی و لوازم ایمنی نیم‌سال دوم است. اقلام نشان‌دار با «حراج فصل» تا پایان آذر با بهای همین فهرست عرضه می‌شوند. بهای درج‌شده بهای فهرست است؛ بهای نهایی پس از استعلام و بر پایهٔ تیراژ سفارش اعلام می‌شود.',
        'هر قلم با کد کالا، یک خط شرح و سه مشخصهٔ فنی آمده است. برای دیدن دوخت درز، نشان استاندارد و جزئیات قفل و بند، روی تصویر هر قلم بزنید؛ تصویر بزرگ، فیلم کوتاه و نمای چرخشی همان‌جا باز می‌شود.',
        'سفارش کارگاهی از ده دست به بالا با تخفیف پلکانی و چاپ نشان سازمان روی کار انجام می‌شود. ارسال به سراسر کشور از انبار خیابان خیام، و تحویل تهران در همان روز کاری.'
      ],
      contentsTitle: 'فهرست مندرجات',
      keyTitle: 'کلید نشانه‌ها',

  function h(tag, props) {

        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'text') node.textContent = v;
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) append(node, arguments[i]);
    return node;
  }

    if (child === null || child === undefined || child === false) return;

  function thumbHalf(shape, ox) {
    var bar = function (x, y, w, hh) {
      return '<rect x="' + (ox + x) + '" y="' + y + '" width="' + w + '" height="' + hh + '"/>';
    };
    var box = function (x, y, w, hh) {
      return '<rect x="' + (ox + x) + '" y="' + y + '" width="' + w + '" height="' + hh +
        '" fill="none" stroke="currentColor" stroke-width=".6"/>';
    };
    var lines = function (x, y, w, n, step) {
      var out = '';
      for (var i = 0; i < n; i++) out += bar(x, y + i * step, w, 0.7);
      return out;
    };
    if (shape === 'masthead') {
      return bar(3, 5, 24, 2.6) + lines(3, 11, 24, 2, 2.4) +
        lines(3, 18, 7, 7, 2.6) + lines(11.5, 18, 7, 7, 2.6) + lines(20, 18, 7, 7, 2.6);
    }
    if (shape === 'grid') {
      return lines(3, 5, 24, 2, 2.4) + box(3, 12, 11.5, 12) + box(15.5, 12, 11.5, 12) +
        box(3, 25, 11.5, 12) + box(15.5, 25, 11.5, 12);
    }

      return bar(3, 5, 24, 1.6) + box(3, 10, 24, 9) + lines(3, 22, 11, 6, 2.6) + lines(16, 22, 11, 6, 2.6);

    });
    mountAllMedia();
    renderInquiry();
    syncChrome();
  }

  function mountAllMedia() {
    PRODUCTS.forEach(function (p) {
      var c = copy(p);
      var hotspots = c.hot.map(function (spot) {
        return { x: spot[0], y: spot[1], title: spot[2], body: spot[3] };
      });
      var media = CatalogKit.defaultMedia(p.sku, hotspots, { subject: p.subject, palette: p.palette });
      refs.spread.querySelectorAll('[data-sku="' + p.sku + '"]').forEach(function (host) {
        CatalogKit.mountMedia(host, media, { title: c.name, sku: p.sku }, state.lang);
      });
    });
  }

  function syncChrome() {
    var t = L();
    var first = state.spread * 2 + 1;
    refs.counterN.textContent = digits(state.spread + 1) + ' / ' + digits(LEAF_SHAPES.length);
    refs.counterS.textContent = t.folios(first, first + 1, TOTAL_PAGES);
    refs.prev.disabled = state.spread === 0;
    refs.next.disabled = state.spread === LEAF_SHAPES.length - 1;
    Array.prototype.forEach.call(refs.picker.children, function (btn, i) {
      btn.setAttribute('aria-current', String(i === state.spread));
    });
    refs.status.textContent = t.status(first, first + 1, TOTAL_PAGES);
  }

  function syncInquiryChrome() {
    var t = L();
    var units = state.inquiry.reduce(function (sum, line) { return sum + line.qty; }, 0);
    refs.inquiryBtn.querySelector('.ps-count').textContent = units ? '(' + digits(units) + ')' : '';
    refs.spread.querySelectorAll('[data-add]').forEach(function (btn) {
      var on = !!lineFor(btn.dataset.add);
      btn.setAttribute('aria-pressed', String(on));
      btn.innerHTML = on ? ICONS.minus : ICONS.plus;
      btn.setAttribute('aria-label', on ? t.remove : t.add);
      btn.title = btn.getAttribute('aria-label');
    });
  }

  function lineFor(sku) {
    for (var i = 0; i < state.inquiry.length; i++) if (state.inquiry[i].sku === sku) return state.inquiry[i];
    return null;
  }

  function toggleItem(sku) {
    var line = lineFor(sku);
    if (line) state.inquiry = state.inquiry.filter(function (l) { return l.sku !== sku; });
    else state.inquiry.push({ sku: sku, qty: 1 });
    renderInquiry();
  }

  function setQty(sku, delta) {
    var line = lineFor(sku);
    if (!line) return;
    line.qty = Math.max(1, Math.min(99, line.qty + delta));
    renderInquiry();
  }

  function renderInquiry() {
    var t = L();
    var rows;
    if (!state.inquiry.length) {
      rows = [h('p', { class: 'cat-inquiry__empty ps-inq__empty', text: t.inqEmpty })];
    } else {
      rows = state.inquiry.map(function (line) {
        var p = product(line.sku);
        var c = copy(p);
        var minus = iconBtn(ICONS.minus, t.less, '', function () { setQty(line.sku, -1); });
        var plus = iconBtn(ICONS.plus, t.more, '', function () { setQty(line.sku, 1); });
        var drop = iconBtn(ICONS.close, t.remove, '', function () { toggleItem(line.sku); });
        [minus, plus, drop].forEach(function (b) {
          b.querySelector('svg').style.cssText = 'width:15px;height:15px;fill:currentColor';
        });
        return h('div', { class: 'cat-inquiry__row' },
          h('span', { class: 'ps-inq__cut' },
            h('img', { src: CatalogKit.image(p.sku + '-a', { w: 80, h: 100, subject: p.subject, palette: p.palette }), alt: '' })),
          h('span', { class: 'ps-inq__name' },
            h('b', { text: c.name }), document.createTextNode(' '),
            h('span', { text: p.sku })),
          h('span', { class: 'ps-inq__qty' },
            minus, h('span', { class: 'ps-inq__n', text: digits(line.qty) }), plus, drop)
        );
      });
    }
    refs.list.replaceChildren.apply(refs.list, rows);

    var sum = state.inquiry.reduce(function (acc, line) { return acc + product(line.sku).price * line.qty; }, 0);
    refs.total.textContent = num(sum);
    refs.count.textContent = t.items(state.inquiry.length);
    syncInquiryChrome();
  }

  /* ── paging ───────────────────────────────────────────────── */

  function reducedMotion() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
      window.matchMedia('(max-width: 900px)').matches;
  }

  function finishTurn() {
    if (!turning) return;
    var job = turning;
    turning = null;
    job.moving.classList.remove('cat-flip-exit', 'cat-flip-enter');
    job.moving.style.zIndex = '';
    job.still.style.zIndex = '';
    job.from.hidden = true;
    refs.spread.classList.remove('ps-turn--back');
  }

  function goTo(index) {
    if (index < 0 || index >= leaves.length || index === state.spread) return;
    finishTurn();
    var from = leaves[state.spread];
    var to = leaves[index];
    var back = index < state.spread;
    state.spread = index;
    to.hidden = false;
    syncChrome();

    if (reducedMotion()) { from.hidden = true; return; }

    /* Forward, the leaf you are leaving turns away; backward, the leaf
       you are returning to turns back over the one you are leaving. */
    var moving = back ? to : from;
    var still = back ? from : to;
    refs.spread.classList.toggle('ps-turn--back', back);
    moving.classList.add(back ? 'cat-flip-enter' : 'cat-flip-exit');
    moving.style.zIndex = '2';
    still.style.zIndex = '1';
    turning = { moving: moving, still: still, from: from };
    var done = function (e) {
      if (e.target !== moving) return;
      moving.removeEventListener('animationend', done);
      if (turning && turning.moving === moving) finishTurn();
    };
    moving.addEventListener('animationend', done);
  }

  function step(dir) { goTo(state.spread + dir); }

  function setLang(lang) {
    if (lang === state.lang) return;
    state.lang = lang;
    finishTurn();
    render();
  }

  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector('.ck-scrim')) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var forward = L().dir === 'rtl' ? 'ArrowLeft' : 'ArrowRight';
    var backward = L().dir === 'rtl' ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === forward) { e.preventDefault(); step(1); }
    else if (e.key === backward) { e.preventDefault(); step(-1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(leaves.length - 1); }
  });

  /* Printing lays every leaf out, so the flip must not be mid-flight. */
  window.addEventListener('beforeprint', finishTurn);

  render();
})();
</script>
</body>
</html>
