<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="showcase" data-scheme="auto" data-motion="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>کاتالوگ دیجیتال با HTML: نمایش قابلیت‌ها</title>
<meta name="description" content="شانزده قابلیت HTML، CSS و JavaScript برای کاتالوگ دیجیتال، هر کدام زنده و قابل امتحان: فیلتر، زوم، ویدیو، چرخش، مقایسه، ورق‌زدن، روایت اسکرولی، جدول، دیالوگ، حالت تیره، چاپ و دسترس‌پذیری.">
<link rel="stylesheet" href="../shared/ds-core.css">
<script>document.documentElement.classList.add('js');</script>
<style>
/* ═══════════════════════════════════════════════════════════════
   A digital catalog as a demonstration of the web platform.
   Sixteen numbered sections, each one capability, each one live.
   Tokens come from the design system; this page adds the showcase
   theme (indigo on ash), a light/dark override, and the frame:
   progress bar, index rail, scheme and motion controls.
   ═══════════════════════════════════════════════════════════════ */

[data-theme="showcase"] {
  --bg: #f2f4f1; --bg-alt: #f8f9f7; --surface: #f8f9f7; --surface-alt: #e5e9e4;
  --ink: #15181a; --ink-muted: #4c5358; --ink-faint: #5a6268;
  --line: #c9cfcb; --line-strong: #15181a;
  --accent: #2c3e78; --accent-soft: #dde2f1; --on-accent: #f2f4f1; --focus: #2c3e78;
  --overlay: rgb(21 24 26 / 0.62);
  --font-fa-display: var(--fam-markazi); --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-cormorant); --font-en-ui: var(--fam-manrope); --font-num: var(--fam-plexmono);
  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --shadow-1: none; --shadow-2: 0 18px 44px -24px rgb(21 24 26 / 0.22); --shadow-lift: 0 26px 60px -28px rgb(21 24 26 / 0.28);
  --hover-media-scale: 1.02; --gutter: 24px; --lh-fa-tight: 1.25;
  --bar-h: 60px;
  color-scheme: light;
}
/* Dark follows the system unless the page-level control says otherwise. */
@media (prefers-color-scheme: dark) {
  [data-theme="showcase"]:not([data-scheme="light"]) {
    --bg: #161a1c; --bg-alt: #1b2022; --surface: #1b2022; --surface-alt: #1f2427;
    --ink: #eceeeb; --ink-muted: #b4bab7; --ink-faint: #9aa19e;
    --line: #343b3f; --line-strong: #eceeeb;
    --accent: #9fb0e6; --accent-soft: #263050; --on-accent: #0f1320; --focus: #9fb0e6;
    --overlay: rgb(8 10 12 / 0.74);
    --shadow-2: 0 18px 44px -24px rgb(0 0 0 / 0.6); --shadow-lift: 0 26px 60px -28px rgb(0 0 0 / 0.7);
    color-scheme: dark;
  }
}
[data-theme="showcase"][data-scheme="dark"] {
  --bg: #161a1c; --bg-alt: #1b2022; --surface: #1b2022; --surface-alt: #1f2427;
  --ink: #eceeeb; --ink-muted: #b4bab7; --ink-faint: #9aa19e;
  --line: #343b3f; --line-strong: #eceeeb;
  --accent: #9fb0e6; --accent-soft: #263050; --on-accent: #0f1320; --focus: #9fb0e6;
  --overlay: rgb(8 10 12 / 0.74);
  --shadow-2: 0 18px 44px -24px rgb(0 0 0 / 0.6); --shadow-lift: 0 26px 60px -28px rgb(0 0 0 / 0.7);
  color-scheme: dark;
}

html { scroll-behavior: smooth; scroll-padding-block-start: calc(var(--bar-h) + 16px); }
html, body { overflow-x: clip; }
body { background: var(--bg); }
[dir="ltr"] .fa-display, .en-display { font-family: var(--font-en-display); }

.skip { position: absolute; inset-block-start: -100%; inset-inline-start: var(--s-4); padding: var(--s-3) var(--s-4); background: var(--accent); color: var(--on-accent); z-index: 100; }
.skip:focus { inset-block-start: var(--s-3); }

/* ── frame: progress, bar, index rail ─────────────────────── */
.progress { position: fixed; inset-block-start: 0; inset-inline: 0; height: 3px; z-index: 40; background: transparent; pointer-events: none; }
.progress__bar { height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: right center; }
[dir="ltr"] .progress__bar { transform-origin: left center; }
@supports (animation-timeline: scroll()) {
  .js .progress__bar { animation: grow linear both; animation-timeline: scroll(root); }
}
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.bar {
  position: sticky; inset-block-start: 0; z-index: 30;
  display: flex; align-items: center; gap: var(--s-3); min-height: var(--bar-h);
  padding: var(--s-2) var(--page-pad);
  background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-block-end: var(--border-w) solid var(--line);
}
@supports not (backdrop-filter: blur(1px)) { .bar { background: var(--bg); } }
@media (prefers-reduced-transparency: reduce) { .bar { background: var(--bg); backdrop-filter: none; } }
.bar__mark { font-family: var(--font-fa-display); font-size: var(--t-lg); line-height: 1; white-space: nowrap; }
.bar__sep { flex: 1; }
.bar .cat-btn, .bar .cat-chip, .seg > button { white-space: nowrap; }
.seg { display: inline-flex; border: var(--border-w) solid var(--line-strong); border-radius: var(--radius-pill); overflow: hidden; }
.seg > button { min-height: 36px; padding: 0 var(--s-3); font: inherit; font-size: var(--t-sm); background: transparent; color: var(--ink-muted); border: 0; cursor: pointer; }
.seg > button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding-inline: 6px; font-family: var(--font-num); font-size: var(--t-xs); line-height: 1; background: var(--accent); color: var(--on-accent); border-radius: var(--radius-pill); }
.badge:empty { display: none; }
.only-wide { display: none; }
@media (min-width: 900px) { .only-wide { display: inline-flex; } .only-narrow { display: none; } }
.menu__settings { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); margin-block-end: var(--s-5); padding-block-end: var(--s-4); border-block-end: var(--border-w) solid var(--line); }

.shell { display: grid; grid-template-columns: minmax(0, 1fr); max-width: var(--page-max); margin-inline: auto; padding-inline: var(--page-pad); }
@media (min-width: 1100px) { .shell { grid-template-columns: 200px minmax(0, 1fr); column-gap: var(--s-8); } }
.toc { display: none; }
@media (min-width: 1100px) {
  .toc { display: block; position: sticky; inset-block-start: calc(var(--bar-h) + var(--s-6)); align-self: start; max-height: calc(100vh - var(--bar-h) - var(--s-8)); overflow: auto; padding-block: var(--s-6); scrollbar-width: none; }
}
.toc ol, .toc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a, .toc-list a { display: grid; grid-template-columns: 3ch 1fr; gap: var(--s-2); padding: 6px var(--s-2); font-size: var(--t-sm); color: var(--ink-muted); text-decoration: none; border-inline-start: 2px solid transparent; transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
.toc a .n, .toc-list a .n { font-family: var(--font-num); font-size: var(--t-xs); color: var(--ink-faint); }
.toc a:hover, .toc-list a:hover { color: var(--ink); background: var(--surface-alt); }
.toc a[aria-current="true"] { color: var(--accent); border-color: var(--accent); }

/* ── hero ─────────────────────────────────────────────────── */
.hero { display: grid; gap: var(--s-6); padding-block: var(--s-9) var(--s-8); min-height: min(78vh, 720px); align-content: center; }
.hero__kicker { font-size: var(--t-base); color: var(--ink-muted); }
.hero__title { font-family: var(--font-fa-display); font-weight: var(--w-regular); font-size: var(--t-3xl); line-height: 1.05; letter-spacing: -0.01em; max-width: 22ch; text-wrap: balance; }
[dir="ltr"] .hero__title { font-family: var(--font-en-display); }
.hero__lede { margin: 0; font-size: var(--t-md); line-height: 1.8; color: var(--ink-muted); max-width: 52ch; }
.hero__meta { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.hero__meta code { font-family: var(--font-num); font-size: var(--t-xs); padding: 4px 8px; background: var(--surface-alt); color: var(--ink-muted); }
@supports (animation-timeline: scroll()) {
  .js .hero__inner { animation: hero-out linear both; animation-timeline: scroll(root); animation-range: 0 70vh; }
}
@keyframes hero-out { to { opacity: 0.25; transform: translateY(-28px); } }

/* ── sections ─────────────────────────────────────────────── */
.sec { padding-block: var(--s-9); border-block-start: var(--border-w) solid var(--line); scroll-margin-block-start: calc(var(--bar-h) + 12px); }
.sec__head { display: grid; grid-template-columns: auto 1fr; gap: var(--s-3) var(--s-5); align-items: baseline; margin-block-end: var(--s-6); }
.sec__no { font-family: var(--font-num); font-size: var(--t-md); color: var(--accent); }
.sec__title { font-family: var(--font-fa-display); font-weight: var(--w-regular); font-size: var(--t-2xl); line-height: 1.1; }
[dir="ltr"] .sec__title { font-family: var(--font-en-display); }
.sec__lede { grid-column: 2; margin: 0; font-size: var(--t-base); color: var(--ink-muted); max-width: 64ch; }
.tech { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }
.tech__k { font-size: var(--t-xs); color: var(--ink-faint); }
.tech code { font-family: var(--font-num); font-size: var(--t-xs); padding: 3px 8px; border: var(--border-w) solid var(--line); color: var(--ink-muted); direction: ltr; }
@media (max-width: 600px) { .sec__head { grid-template-columns: 1fr; } .sec__lede, .tech { grid-column: 1; } }

/* ── product atoms ────────────────────────────────────────── */
.media { position: relative; overflow: hidden; aspect-ratio: var(--ratio-media); background: var(--surface-alt); }
.media--wide { aspect-ratio: 3 / 2; } .media--square { aspect-ratio: 1; } .media--tall { aspect-ratio: 2 / 3; }
@media (hover: hover) { .ck-cue { opacity: 0; } .ck-media:hover .ck-cue, .ck-media:focus-visible .ck-cue { opacity: 1; } }
.name { font-family: var(--font-fa-display); font-weight: var(--w-regular); font-size: var(--t-lg); line-height: 1.2; }
[dir="ltr"] .name { font-family: var(--font-en-display); font-weight: var(--w-medium); }
.name--xl { font-size: var(--t-2xl); }
.alt { font-family: var(--font-en-ui); font-size: var(--t-sm); color: var(--ink-muted); direction: ltr; text-align: right; }
[dir="ltr"] .alt { font-family: var(--font-fa-ui); direction: rtl; text-align: left; }
.copy { margin: 0; font-size: var(--t-base); color: var(--ink-muted); line-height: var(--lh-fa-body); max-width: var(--measure-fa); }
.copy--sm { font-size: var(--t-sm); }
.price { font-family: var(--font-num); font-size: var(--t-md); color: var(--ink); }
.price small { font-size: var(--t-xs); color: var(--ink-muted); margin-inline-start: var(--s-1); }
.code { font-family: var(--font-num); font-size: var(--t-sm); color: var(--ink-faint); direction: ltr; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4); padding-block-start: var(--s-3); }
.spec { display: grid; gap: var(--s-1); font-size: var(--t-sm); color: var(--ink-muted); }
.spec > div { display: flex; gap: var(--s-3); } .spec dt { min-width: 8ch; color: var(--ink-faint); } .spec dd { margin: 0; font-family: var(--font-num); color: var(--ink); }
.add { min-height: 40px; padding-inline: var(--s-4); font-size: var(--t-sm); }
.add[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.status { font-size: var(--t-sm); color: var(--ink-muted); min-height: 1.5em; }

/* 01 · grid with live filter. Cards are custom elements that lay
   themselves out by their own width, not the viewport's. */
.filters { display: grid; gap: var(--s-4); margin-block-end: var(--s-6); }
.filters__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }
.filters .cat-search { flex: 1 1 220px; max-width: 360px; }
.filters select { min-height: var(--tap-min); padding: 0 var(--s-3); font: inherit; font-size: var(--t-sm); color: var(--ink); background: var(--surface); border: var(--border-w) solid var(--line); }
.filters__clear { visibility: hidden; }
.filters:has(.cat-chip[aria-pressed="true"]:not([data-cat="all"])) .filters__clear,
.filters:has(input:not(:placeholder-shown)) .filters__clear { visibility: visible; }
.grid { display: grid; gap: var(--gutter); grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
catalog-card { display: block; container: card / inline-size; }
catalog-card[hidden] { display: none; }
.card { display: grid; gap: var(--s-3); align-content: start; height: 100%; }
.card__body { display: grid; gap: var(--s-2); align-content: start; }
@container card (min-width: 440px) { .card { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: var(--s-5); } }
.empty { padding: var(--s-8); text-align: center; color: var(--ink-faint); border: var(--border-w) dashed var(--line); }

/* 02 · close view with inline hotspots */
.study { display: grid; gap: var(--s-7); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.study__frame { position: relative; aspect-ratio: var(--ratio-media); background: var(--surface-alt); }
.study__frame .media { position: absolute; inset: 0; aspect-ratio: auto; }
.dot { position: absolute; z-index: 2; width: 30px; height: 30px; margin: -15px 0 0 -15px; padding: 0; display: grid; place-items: center; cursor: pointer; font-family: var(--font-num); font-size: 12px; background: var(--accent); color: var(--on-accent); border: 2px solid var(--bg); border-radius: var(--radius-pill); transition: transform var(--dur-fast) var(--ease-out); }
.dot::after { content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 1px solid var(--accent); opacity: 0.5; transition: inset var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out); }
.dot:hover, .dot[aria-pressed="true"] { transform: scale(1.12); } .dot[aria-pressed="true"]::after { inset: -10px; opacity: 1; }
.notes { display: grid; border-block-start: var(--border-w) solid var(--line); }
.note { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--s-4); align-items: baseline; padding-block: var(--s-4); border: 0; border-block-end: var(--border-w) solid var(--line); background: none; text-align: start; font: inherit; color: inherit; cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
.note:hover { background: var(--surface-alt); } .note[aria-pressed="true"] { background: var(--accent-soft); }
.note__n { font-family: var(--font-num); font-size: var(--t-sm); color: var(--accent); }
.note__t { font-family: var(--font-fa-display); font-size: var(--t-lg); line-height: 1.2; } [dir="ltr"] .note__t { font-family: var(--font-en-display); }
.note__b { grid-column: 2; margin: 0; font-size: var(--t-sm); color: var(--ink-muted); }
.study__side { display: grid; gap: var(--s-5); }
@media (max-width: 800px) { .study { grid-template-columns: 1fr; } }

/* 03 · video and spin, side by side */
.pair { display: grid; gap: var(--gutter); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.pair__item { display: grid; gap: var(--s-3); }

/* 04 · before / after */
.cmp { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--surface-alt); direction: ltr; --x: 50%; touch-action: none; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
.cmp__after { clip-path: inset(0 0 0 var(--x)); }
.cmp__handle { position: absolute; inset-block: 0; left: var(--x); width: 2px; margin-left: -1px; background: var(--bg); pointer-events: none; }
.cmp__handle::after { content: ""; position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; translate: -50% -50%; border-radius: 999px; background: var(--bg); border: 2px solid var(--accent); box-shadow: var(--shadow-2); }
.cmp__range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.cmp__range:focus-visible ~ .cmp__handle::after { outline: 2px solid var(--focus); outline-offset: 3px; }
.cmp__label { position: absolute; bottom: 12px; padding: 4px 10px; font-size: var(--t-xs); background: var(--bg); color: var(--ink); }
.cmp__label--a { left: 12px; } .cmp__label--b { right: 12px; }

/* 05 · variants */
.sw { display: grid; gap: var(--s-6); grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
.sw__stage { position: relative; aspect-ratio: var(--ratio-media); overflow: hidden; background: var(--surface-alt); }
.sw__stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity var(--dur-slow) var(--ease-out); }
.sw__stage img[data-out] { opacity: 0; }
.sw__side { display: grid; gap: var(--s-4); }
.sw__name { display: flex; align-items: baseline; gap: var(--s-2); flex-wrap: wrap; }
.sw__var { font-family: var(--font-fa-display); font-size: var(--t-lg); color: var(--accent); } [dir="ltr"] .sw__var { font-family: var(--font-en-display); }
@media (max-width: 760px) { .sw { grid-template-columns: 1fr; } }

/* 06 · expanding card with View Transitions */
.vt { display: grid; gap: var(--gutter); grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.vt__card { display: grid; gap: var(--s-2); align-content: start; text-align: start; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
.vt__card:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
.vt__detail { grid-column: 1 / -1; display: grid; gap: var(--s-6); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: var(--s-6); background: var(--surface); border: var(--border-w) solid var(--line); }
.vt__detail .media { aspect-ratio: 1; }
.vt__text { display: grid; gap: var(--s-4); align-content: start; }
@media (max-width: 700px) { .vt__detail { grid-template-columns: 1fr; } }
::view-transition-group(*) { animation-duration: var(--dur-page); animation-timing-function: var(--ease-inout); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: var(--dur-base); }

/* 07 · quick view with the Popover API */
.qv-grid { display: flex; flex-wrap: wrap; gap: var(--s-3); }
[popover].qv { inset: 0; margin: auto; width: min(680px, 92vw); max-height: 88vh; overflow: auto; padding: var(--s-6); background: var(--surface); color: var(--ink); border: var(--border-w) solid var(--line-strong); box-shadow: var(--shadow-lift); }
[popover].qv::backdrop { background: var(--overlay); }
.qv__grid { display: grid; gap: var(--s-5); grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
@media (max-width: 600px) { .qv__grid { grid-template-columns: 1fr; } }
.qv__text { display: grid; gap: var(--s-3); align-content: start; }
.qv__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-4); margin-block-end: var(--s-4); }
/* Entry and exit are real transitions on a top-layer element, including
   the discrete display and overlay steps. */
[popover].qv { opacity: 0; transform: translateY(10px) scale(0.985); transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), overlay var(--dur-base) allow-discrete, display var(--dur-base) allow-discrete; }
[popover].qv:popover-open { opacity: 1; transform: none; }
@starting-style { [popover].qv:popover-open { opacity: 0; transform: translateY(10px) scale(0.985); } }
[popover].qv::backdrop { opacity: 0; transition: opacity var(--dur-base) var(--ease-out), overlay var(--dur-base) allow-discrete, display var(--dur-base) allow-discrete; }
[popover].qv:popover-open::backdrop { opacity: 1; }
@starting-style { [popover].qv:popover-open::backdrop { opacity: 0; } }

/* 08 · snap gallery */
.snap { position: relative; }
.snap__track { display: flex; gap: var(--gutter); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-block-end: var(--s-2); }
.snap__track::-webkit-scrollbar { display: none; }
.snap__item { flex: 0 0 min(100%, 640px); scroll-snap-align: center; display: grid; gap: var(--s-3); }
.snap__item .media { aspect-ratio: 3 / 2; }
.snap__nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); margin-block-start: var(--s-4); }
.snap__dots { display: flex; gap: 8px; }
.snap__dots button { width: 10px; height: 10px; padding: 0; border-radius: 999px; border: var(--border-w) solid var(--ink-faint); background: transparent; cursor: pointer; transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.snap__dots button[aria-current="true"] { background: var(--accent); border-color: var(--accent); transform: scale(1.25); }

/* 09 · the book */
.book { position: relative; display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 3 / 2; max-width: 980px; margin-inline: auto; perspective: 2400px; border: var(--border-w) solid var(--line-strong); background: var(--surface); }
.book__page { position: relative; padding: var(--s-6); display: grid; gap: var(--s-4); align-content: start; overflow: hidden; }
.book__page + .book__page { border-inline-start: var(--border-w) solid var(--line-strong); }
.book__page .media { aspect-ratio: 4 / 3; }
.book__folio { margin-block-start: auto; padding-block-start: var(--s-3); border-block-start: var(--border-w) solid var(--line); font-family: var(--font-num); font-size: var(--t-sm); color: var(--ink-faint); text-align: center; }
.book__leaf { position: absolute; inset-block: 0; width: 50%; transform-style: preserve-3d; transition: transform 900ms var(--ease-inout); z-index: 3; }
.book__leaf--left { left: 0; transform-origin: right center; }
.book__leaf--right { right: 0; transform-origin: left center; }
.book__leaf--left.turn { transform: rotateY(180deg); }
.book__leaf--right.turn { transform: rotateY(-180deg); }
.book__face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--surface); }
.book__face--back { transform: rotateY(180deg); }
.book__face .book__page { height: 100%; }
.book__nav { display: flex; justify-content: center; align-items: center; gap: var(--s-4); margin-block-start: var(--s-5); }
.book__count { font-family: var(--font-num); font-size: var(--t-sm); color: var(--ink-muted); }
@media (max-width: 700px) { .book { aspect-ratio: auto; grid-template-columns: 1fr; } .book__page + .book__page { border-inline-start: 0; border-block-start: var(--border-w) solid var(--line-strong); } .book__leaf { display: none; } }

/* 10 · scrollytelling */
.story { display: grid; gap: var(--s-8); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.story__stage { position: sticky; inset-block-start: calc(var(--bar-h) + var(--s-5)); display: grid; gap: var(--s-3); }
.story__frame { position: relative; aspect-ratio: 4 / 5; max-height: calc(100vh - var(--bar-h) - 140px); overflow: hidden; background: var(--surface-alt); }
.story__frame .media { position: absolute; inset: 0; aspect-ratio: auto; opacity: 0; transition: opacity var(--dur-slow) var(--ease-out); }
.story__frame .media.is-active { opacity: 1; }
.story__bar { height: 2px; background: var(--line); }
.story__bar > div { height: 100%; width: var(--p, 0%); background: var(--accent); transition: width var(--dur-slow) var(--ease-out); }
.story__steps { display: grid; gap: var(--s-6); }
.story__step { min-height: 62vh; display: grid; gap: var(--s-4); align-content: center; opacity: 0.35; transition: opacity var(--dur-slow) var(--ease-out); }
.story__step.is-active { opacity: 1; }
@media (max-width: 800px) { .story { grid-template-columns: 1fr; } .story__frame { max-height: 42vh; aspect-ratio: 3 / 2; } .story__step { min-height: 0; opacity: 1; } .story__stage { inset-block-start: var(--bar-h); z-index: 2; background: var(--bg); padding-block: var(--s-3); } }

/* 11 · comparison table */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.tbl th, .tbl td { padding: var(--s-3) var(--s-3); text-align: start; vertical-align: middle; border-block-end: var(--border-w) solid var(--line); }
.tbl thead th { position: sticky; inset-block-start: var(--bar-h); background: var(--bg); z-index: 1; font-weight: var(--w-medium); color: var(--ink-muted); border-block-end: var(--border-w) solid var(--line-strong); }
.tbl thead button { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
.tbl thead button::after { content: "↕"; font-size: 11px; color: var(--ink-faint); }
.tbl thead th[aria-sort="ascending"] button::after { content: "↑"; color: var(--accent); }
.tbl thead th[aria-sort="descending"] button::after { content: "↓"; color: var(--accent); }
/* Keyboard focus scrolls a row into view; the margin keeps it from
   landing under the sticky header and the bar above it. */
.tbl tbody td { scroll-margin-block-start: calc(var(--bar-h) + 64px); }
.tbl tbody tr:hover { background: var(--surface-alt); }
.tbl tbody tr:has(input:checked) { background: var(--accent-soft); }
.tbl .media { width: 44px; aspect-ratio: 1; }
.tbl .num { font-family: var(--font-num); direction: ltr; text-align: end; }
.tbl meter { width: 84px; height: 10px; }
.tbl input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.tray { display: none; position: sticky; inset-block-end: var(--s-4); z-index: 5; align-items: center; gap: var(--s-4); margin-block-start: var(--s-5); padding: var(--s-3) var(--s-4); background: var(--ink); color: var(--bg); }
.sec:has(.tbl input:checked) .tray { display: flex; }
.tray__n { font-family: var(--font-num); }
.tray .cat-btn { background: var(--bg); color: var(--ink); }
.cmp-tbl { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.cmp-tbl th, .cmp-tbl td { padding: var(--s-3); border-block-end: var(--border-w) solid var(--line); text-align: start; vertical-align: top; }
.cmp-tbl th { color: var(--ink-faint); font-weight: var(--w-regular); width: 20%; }
.cmp-tbl thead th { color: var(--ink); }
.cmp-tbl thead .name { font-size: var(--t-base); margin-block-start: var(--s-2); }
.cmp-tbl td.num { font-family: var(--font-num); direction: ltr; text-align: end; }
.cmp-tbl td.diff { background: var(--accent-soft); color: var(--accent); }
.tbl__name { display: flex; gap: var(--s-3); align-items: center; }
.tbl__name .name { font-size: var(--t-base); }

/* 12 · details */
.acc { display: grid; gap: 0; border-block-start: var(--border-w) solid var(--line-strong); }
.acc details { border-block-end: var(--border-w) solid var(--line); }
.acc summary { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); padding: var(--s-4) 0; cursor: pointer; list-style: none; font-family: var(--font-fa-display); font-size: var(--t-lg); }
[dir="ltr"] .acc summary { font-family: var(--font-en-display); }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; font-family: var(--font-num); color: var(--accent); transition: transform var(--dur-base) var(--ease-out); }
.acc details[open] summary::after { transform: rotate(45deg); }
.acc__body { display: grid; gap: var(--s-4); grid-template-columns: 120px minmax(0, 1fr); padding-block: 0 var(--s-5); }
.acc__body .media { aspect-ratio: 1; }
@media (max-width: 520px) { .acc__body { grid-template-columns: 1fr; } }

/* 13 · dialog */
dialog.dlg { inset: 0; margin: auto; width: min(760px, 92vw); max-height: 88vh; padding: var(--s-6); background: var(--surface); color: var(--ink); border: var(--border-w) solid var(--line-strong); box-shadow: var(--shadow-lift); }
dialog.dlg::backdrop { background: var(--overlay); }
dialog.dlg { opacity: 0; transform: translateY(10px); transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), overlay var(--dur-base) allow-discrete, display var(--dur-base) allow-discrete; }
dialog.dlg[open] { opacity: 1; transform: none; }
@starting-style { dialog.dlg[open] { opacity: 0; transform: translateY(10px); } }
.dlg__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-4); margin-block-end: var(--s-5); }
.dlg__head h2 { font-size: var(--t-xl); font-weight: var(--w-regular); }
.dlg__row { grid-template-columns: 56px minmax(0, 1fr) auto; }
.dlg__row .media { aspect-ratio: 1; }
.dlg__foot { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; justify-content: space-between; padding-block-start: var(--s-4); margin-block-start: var(--s-4); border-block-start: var(--border-w) solid var(--line); }
.dlg__total { font-family: var(--font-num); font-size: var(--t-md); } .dlg__total small { font-size: var(--t-xs); color: var(--ink-muted); margin-inline-start: var(--s-1); }
.inq-demo { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }

/* 14 · picture and scheme */
.pic { display: grid; gap: var(--s-6); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.pic picture, .pic img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--surface-alt); }
.pic__side { display: grid; gap: var(--s-4); }
.kv { display: grid; gap: var(--s-2); font-size: var(--t-sm); }
.kv div { display: flex; justify-content: space-between; gap: var(--s-4); padding-block: var(--s-2); border-block-end: var(--border-w) solid var(--line); }
.kv dt { color: var(--ink-faint); } .kv dd { margin: 0; font-family: var(--font-num); direction: ltr; }
@media (max-width: 760px) { .pic { grid-template-columns: 1fr; } }

/* 15 · print and share */
.actions { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }

/* 16 · access */
.keys { display: grid; gap: var(--s-2); grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.keys div { display: flex; align-items: baseline; gap: var(--s-3); font-size: var(--t-sm); color: var(--ink-muted); padding-block: var(--s-2); border-block-end: var(--border-w) solid var(--line); }
kbd { font-family: var(--font-num); font-size: var(--t-xs); color: var(--ink); background: var(--surface-alt); border: var(--border-w) solid var(--line); padding: 2px 8px; min-width: 52px; text-align: center; direction: ltr; }

/* ── footer ───────────────────────────────────────────────── */
.foot { display: grid; gap: var(--s-5); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); padding-block: var(--s-8) var(--s-10); border-block-start: var(--border-w) solid var(--line); }
.foot h3 { font-family: var(--font-fa-display); font-weight: var(--w-regular); font-size: var(--t-md); margin-block-end: var(--s-2); } [dir="ltr"] .foot h3 { font-family: var(--font-en-display); }
.foot p, .foot li { font-size: var(--t-sm); color: var(--ink-muted); } .foot p { margin: 0; max-width: 36ch; } .foot ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s-1); }

/* ── reveals: one quiet entrance, compositor properties only ── */
.js .rv { opacity: 0; transform: translateY(16px); transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); transition-delay: calc(var(--i, 0) * var(--stagger)); }
.js .rv.in { opacity: 1; transform: none; }
.js .rv--pop { transform: translateY(12px) scale(0.975); transition-timing-function: var(--ease-out), var(--ease-soft); }
.js .rv--pop.in { transform: none; }

/* Reduced motion, from the system or from the page's own control. The
   rules are the same; CSS cannot express the OR, so they appear twice. */
@media (prefers-reduced-motion: reduce) {
  .js .rv { opacity: 1 !important; transform: none !important; transition: none !important; }
  .js .progress__bar, .js .hero__inner { animation: none !important; }
  .book__leaf { transition: none !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
:root[data-motion="reduce"] .rv { opacity: 1 !important; transform: none !important; transition: none !important; }
:root[data-motion="reduce"] .progress__bar, :root[data-motion="reduce"] .hero__inner { animation: none !important; }
:root[data-motion="reduce"] .book__leaf { transition: none !important; }
:root[data-motion="reduce"] :is(.dot, .note, .sw__stage img, .story__frame .media, .story__step, .snap__dots button, [popover].qv, dialog.dlg) { transition: none !important; }

/* ── print: the page becomes the printed catalog ─────────── */
@media print {
  .progress, .bar, .toc, .skip, .tech, .filters, .snap__nav, .book__nav, .tray, .actions, .add, .ck-cue, .dot, .cmp__range, .cmp__handle, .keys, .only-narrow { display: none !important; }
  .shell { display: block; }
  .sec { padding-block: 24pt; break-inside: avoid; border: 0; }
  .grid { grid-template-columns: repeat(3, 1fr) !important; }
  catalog-card[hidden] { display: block !important; }
  .rv { opacity: 1 !important; transform: none !important; }
  .story__stage { position: static; } .story__frame .media { position: static; opacity: 1; aspect-ratio: 4 / 5; }
  .story__step { min-height: 0; opacity: 1; }
  .snap__track { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; }
  .book__leaf { display: none; }
  a[href]::after { content: none; }
}
</style>

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function el(tag, cls, text) {

  if (text != null) n.textContent = text;
  return n;
}
function media(p, modifier) {

}

/* ── 01 grid with live filter ─────────────────────────────── */
class CatalogCard extends HTMLElement {
  connectedCallback() {
    if (this.dataset.ready) return;
    this.dataset.ready = '1';
    const p = byCode(this.dataset.code);
    const node = document.getElementById('card-tpl').content.cloneNode(true);
    node.querySelector('.name').textContent = name(p);
    node.querySelector('.alt').textContent = alt(p);
    node.querySelector('.copy').textContent = copy(p);
    node.querySelector('.price').replaceWith(priceEl(p));
    node.querySelector('.code').textContent = p.code;
    node.querySelector('.add').replaceWith(addButton(p));
    const box = node.querySelector('.media');
    this.appendChild(node);
    CatalogKit.mountMedia(box, mediaSet(p), { title: name(p), sku: p.code }, lang);
  }
}
if (!customElements.get('catalog-card')) customElements.define('catalog-card', CatalogCard);

function secFilter() {
  const wrap = el('div');
  const filters = el('div', 'filters');
  const row1 = el('div', 'filters__row');
  const chips = [{ id: 'all' }, ...CATEGORIES].map((c) => {
    const b = el('button', 'cat-chip', c.id === 'all' ? t().all : catName(c.id)); b.type = 'button'; b.dataset.cat = c.id;
    b.setAttribute('aria-pressed', String(c.id === 'all'));
    b.addEventListener('click', () => { chips.forEach((x) => x.setAttribute('aria-pressed', String(x === b))); apply(); });
    return b;
  });
  row1.append(...chips);
  const row2 = el('div', 'filters__row');
  const search = el('label', 'cat-search');
  const input = el('input'); input.type = 'search'; input.placeholder = t().search; input.setAttribute('list', 'names'); input.setAttribute('aria-label', t().search);
  const dl = el('datalist'); dl.id = 'names'; for (const p of PRODUCTS) { const o = el('option'); o.value = name(p); dl.appendChild(o); }
  search.append(input, dl);
  const sort = el('select'); sort.setAttribute('aria-label', t().sort);
  for (const [v, l] of [['name', t().sortName], ['priceAsc', t().sortPriceAsc], ['priceDesc', t().sortPriceDesc], ['stock', t().sortStock]]) { const o = el('option', null, l); o.value = v; sort.appendChild(o); }
  const clear = el('button', 'cat-btn cat-btn--quiet filters__clear', t().clear); clear.type = 'button';
  const count = el('div', 'status'); count.setAttribute('aria-live', 'polite');
  row2.append(search, sort, clear, count);
  filters.append(row1, row2);

  const grid = el('div', 'grid');
  const cards = PRODUCTS.map((p) => { const c = document.createElement('catalog-card'); c.dataset.code = p.code; return c; });
  grid.append(...cards);
  const empty = el('div', 'empty'); empty.hidden = true;

  const norm = (s) => String(s || '').replace(/[يﻱ]/g, 'ی').replace(/[كﻙ]/g, 'ک').replace(/[‌]/g, '').replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).toLowerCase().trim();
  function apply() {
    const cat = chips.find((c) => c.getAttribute('aria-pressed') === 'true').dataset.cat;
    const q = norm(input.value);
    const keep = PRODUCTS.filter((p) => (cat === 'all' || p.cat === cat) && (!q || [p.fa, p.en, p.code].some((f) => norm(f).includes(q))));
    const cmp = { name: (a, b) => name(a).localeCompare(name(b), lang), priceAsc: (a, b) => a.price - b.price, priceDesc: (a, b) => b.price - a.price, stock: (a, b) => b.stock - a.stock }[sort.value];
    keep.sort(cmp);
    for (const c of cards) c.hidden = !keep.some((p) => p.code === c.dataset.code);
    for (const p of keep) grid.appendChild(cards.find((c) => c.dataset.code === p.code));
    count.textContent = t().results(keep.length);
    empty.hidden = keep.length > 0; empty.textContent = t().results(0);
  }
  input.addEventListener('input', apply); sort.addEventListener('change', apply);
  clear.addEventListener('click', () => { input.value = ''; chips.forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.cat === 'all'))); apply(); input.focus(); });
  wrap.append(filters, grid, empty);
  queueMicrotask(apply);
  return wrap;
}

/* ── 02 close view ────────────────────────────────────────── */
function secZoom() {
  const p = PRODUCTS[0];
  const wrap = el('div', 'study');
  const frame = el('div', 'study__frame rv');
  frame.appendChild(media(p));
  const side = el('div', 'study__side');
  side.append(nameBlock(p, 'xl'), el('p', 'copy', copy(p)));
  const notes = el('div', 'notes');
  const dots = [], noteEls = [];
  const select = (i) => { dots.forEach((d, j) => d.setAttribute('aria-pressed', String(i === j))); noteEls.forEach((n, j) => n.setAttribute('aria-pressed', String(i === j))); };
  p.hot.forEach((h, i) => {
    const pair = fa() ? h.fa : h.en;
    const n = el('button', 'note rv'); n.type = 'button'; n.setAttribute('aria-pressed', 'false'); n.style.setProperty('--i', i + 1);
    n.append(el('span', 'note__n', num(i + 1)), el('span', 'note__t', pair[0]), el('p', 'note__b', pair[1]));
    n.addEventListener('click', () => select(n.getAttribute('aria-pressed') === 'true' ? -1 : i));
    noteEls.push(n); notes.appendChild(n);
    const d = el('button', 'dot', num(i + 1)); d.type = 'button'; d.setAttribute('aria-pressed', 'false'); d.setAttribute('aria-label', pair[0]);
    d.style.left = h.x + '%'; d.style.top = h.y + '%';
    d.addEventListener('click', (e) => { e.stopPropagation(); select(d.getAttribute('aria-pressed') === 'true' ? -1 : i); });
    dots.push(d); frame.appendChild(d);
  });
  const open = el('button', 'cat-btn', t().open); open.type = 'button';
  open.addEventListener('click', () => CatalogKit.open(mediaSet(p), { title: name(p), sku: p.code }, lang, 0));
  const actions = el('div', 'actions'); actions.append(open, addButton(p));
  side.append(notes, actions);
  wrap.append(frame, side);
  return wrap;
}

  const after = el('img', 'cmp__after'); after.alt = t().after; after.src = CatalogKit.image(p.code + '-a', { subject: p.subject, palette: p.palette, w: 1200, h: 900, ratio: 4 / 3 });
  const range = el('input', 'cmp__range'); range.type = 'range'; range.min = 0; range.max = 100; range.value = 50; range.setAttribute('aria-label', t().before + ' / ' + t().after);

/* ── 05 variants ──────────────────────────────────────────── */
const VARIANTS = [['sage', 'سبز خاکستر', 'Ash green'], ['stone', 'سنگی', 'Stone'], ['ink', 'دوده', 'Soot'], ['clay', 'رس', 'Clay'], ['indigo', 'نیل', 'Indigo'], ['amber', 'کهربا', 'Amber']];
function secVariants() {
  const p = PRODUCTS[1];
  const wrap = el('div', 'sw');
  const stage = el('div', 'sw__stage rv');
  let current = el('img'); current.alt = name(p); current.src = art(p, { palette: VARIANTS[0][0] });
  stage.appendChild(current);
  const side = el('div', 'sw__side');
  const title = el('div', 'sw__name'); const nm = el('h3', 'name name--xl', name(p)); const vn = el('span', 'sw__var', fa() ? VARIANTS[0][1] : VARIANTS[0][2]);
  title.append(nm, vn);
  const codeEl = el('div', 'code', p.code + '-' + VARIANTS[0][0].toUpperCase().slice(0, 3));
  const swatches = el('div', 'cat-swatches');
  VARIANTS.forEach(([pal, fName, eName], i) => {
    const b = el('button', 'cat-swatch'); b.type = 'button'; b.setAttribute('aria-pressed', String(i === 0)); b.setAttribute('aria-label', fa() ? fName : eName); b.title = fa() ? fName : eName;
    const chip = el('span'); chip.style.background = `url("${CatalogKit.image('sw-' + pal, { subject: 'textile', palette: pal, w: 60, h: 60, ratio: 1 })}") center/cover`;
    b.appendChild(chip);
    b.addEventListener('click', async () => {
      for (const x of swatches.children) x.setAttribute('aria-pressed', String(x === b));
      vn.textContent = fa() ? fName : eName; codeEl.textContent = p.code + '-' + pal.toUpperCase().slice(0, 3);
      const next = el('img'); next.alt = name(p); next.src = art(p, { palette: pal }); next.setAttribute('data-out', '');
      stage.appendChild(next);
      try { await next.decode(); } catch (e) { /* draw anyway */ }
      requestAnimationFrame(() => { next.removeAttribute('data-out'); current.setAttribute('data-out', ''); const old = current; current = next; setTimeout(() => old.remove(), 600); });
    });
    swatches.appendChild(b);
  });
  side.append(title, el('div', 'alt', alt(p)), el('p', 'copy', copy(p)), swatches, codeEl, priceEl(p), addButton(p));
  wrap.append(stage, side);
  return wrap;
}

/* ── 06 expanding card with view transitions ──────────────── */
function secExpand() {
  const items = PRODUCTS.slice(3, 7);
  const grid = el('div', 'vt');
  let openCode = null;
  function render() {
    grid.innerHTML = '';
    if (openCode) {
      const p = byCode(openCode);
      const d = el('div', 'vt__detail');
      const m = media(p, 'square'); m.style.viewTransitionName = 'vt-' + p.code.replace('-', '');
      const text = el('div', 'vt__text');
      const close = el('button', 'cat-btn cat-btn--ghost', t().back); close.type = 'button'; close.addEventListener('click', () => go(null));
      text.append(nameBlock(p, 'xl'), el('p', 'copy', copy(p)), specList(p), rowEl(p), addButton(p), close);
      d.append(m, text);
      grid.appendChild(d);
      queueMicrotask(() => close.focus({ preventScroll: true }));
    }
    for (const p of items) {
      const b = el('button', 'vt__card'); b.type = 'button'; b.setAttribute('aria-expanded', String(openCode === p.code));
      const m = el('div', 'media');
      if (openCode !== p.code) m.style.viewTransitionName = 'vt-' + p.code.replace('-', '');
      const img = el('img'); img.alt = ''; img.src = art(p); img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      m.appendChild(img);
      b.append(m, nameBlock(p), el('div', 'code', p.code));
      b.addEventListener('click', () => go(openCode === p.code ? null : p.code));
      grid.appendChild(b);
    }
  }
  function go(code) {
    const run = () => { openCode = code; render(); };
    if (document.startViewTransition && root.dataset.motion !== 'reduce') document.startViewTransition(run); else run();
  }
  grid.addEventListener('keydown', (e) => { if (e.key === 'Escape' && openCode) go(null); });
  render();
  return grid;
}

/* ── 07 popover quick view ────────────────────────────────── */
function secPopover() {
  const wrap = el('div', 'qv-grid rv');
  const pop = document.getElementById('qv');

    const b = el('button', 'cat-btn cat-btn--ghost', t().quick + ': ' + name(p)); b.type = 'button';
    b.setAttribute('popovertarget', 'qv');

  }

      const p = byCode(pop.dataset.code); if (!p) return;
      pop.innerHTML = '';

      const close = el('button', 'cat-btn cat-btn--ghost', t().close); close.type = 'button'; close.setAttribute('popovertarget', 'qv'); close.setAttribute('popovertargetaction', 'hide');

/* ── 09 the book ──────────────────────────────────────────── */
function secBook() {
  const wrap = el('div', 'rv');
  const spreads = [[PRODUCTS[0], PRODUCTS[1]], [PRODUCTS[2], PRODUCTS[3]], [PRODUCTS[4], PRODUCTS[5]], [PRODUCTS[6], PRODUCTS[7]]];
  let cur = 0, turning = false;
  const book = el('div', 'book'); book.tabIndex = 0; book.setAttribute('aria-roledescription', 'book');
  const pageEl = (p, folio) => {
    const pg = el('div', 'book__page');
    const h = el('div', 'code', t().running);
    pg.append(h, media(p, null), nameBlock(p), el('div', 'book__folio', t().pageOf(folio, spreads.length * 2)));
    return pg;
  };
  function renderSpread() {
    for (const n of [...book.children]) if (!n.classList.contains('book__leaf')) n.remove();
    const [a, b] = spreads[cur];
    const first = pageEl(a, cur * 2 + 1), second = pageEl(b, cur * 2 + 2);
    book.prepend(first, second);
    count.textContent = t().pageOf(cur + 1, spreads.length);
    prev.disabled = cur === 0; next.disabled = cur === spreads.length - 1;
  }
  function turn(dir) {
    const target = cur + dir; if (turning || target < 0 || target >= spreads.length) return;
    if (root.dataset.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches || innerWidth <= 700) { cur = target; renderSpread(); return; }
    turning = true;
    /* In RTL the reader turns the left page to go forward; in LTR the right. */
    const turnsLeft = fa() ? dir > 0 : dir < 0;
    const leaf = el('div', 'book__leaf ' + (turnsLeft ? 'book__leaf--left' : 'book__leaf--right'));
    const front = el('div', 'book__face'), back = el('div', 'book__face book__face--back');
    const [ca, cb] = spreads[cur], [na, nb] = spreads[target];
    /* Fresh page elements, appended while attached, so their media mounts
       inside the leaf; a clone taken before the mount would turn blank. */
    leaf.append(front, back);
    book.appendChild(leaf);
    /* The turning leaf carries the second page of this spread when the
       reading direction turns that side, otherwise the first; its back
       is the matching page of the next spread. */
    const second = turnsLeft === fa();
    front.appendChild(pageEl(second ? cb : ca, cur * 2 + (second ? 2 : 1)));
    back.appendChild(pageEl(second ? na : nb, target * 2 + (second ? 1 : 2)));
    requestAnimationFrame(() => requestAnimationFrame(() => leaf.classList.add('turn')));
    leaf.addEventListener('transitionend', () => { cur = target; renderSpread(); leaf.remove(); turning = false; }, { once: true });
  }
  const nav = el('div', 'book__nav');
  const prev = el('button', 'cat-btn cat-btn--ghost', t().prev); prev.type = 'button'; prev.addEventListener('click', () => turn(-1));
  const next = el('button', 'cat-btn cat-btn--ghost', t().next); next.type = 'button'; next.addEventListener('click', () => turn(1));
  const count = el('div', 'book__count');
  nav.append(prev, count, next);
  book.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') turn(fa() ? 1 : -1); if (e.key === 'ArrowRight') turn(fa() ? -1 : 1); });
  renderSpread();
  wrap.append(book, nav);
  return wrap;
}
