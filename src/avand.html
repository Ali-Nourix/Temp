<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="avand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>آوند، مجموعه‌ی پاییز ۱۴۰۴</title>
<meta name="description" content="کاتالوگ مجموعه‌ی پاییز آوند: سرامیک، چوب، نساجی، روشنایی، چرم و برنج، ساخته در کارگاه‌های تهران، یزد و کاشان.">
<link rel="stylesheet" href="../shared/ds-core.css">
<script>document.documentElement.classList.add('js');</script>
<style>
/* ─────────────────────────────────────────────────────────────
   Âvand. A workshop catalog of ceramics, wood and textile.

   The palette is taken from the pieces themselves: the natural
   indigo of the dye lot the rug copy names, on the cool grey-white
   of an ash glaze. One accent, used the same way everywhere. Display
   type is a naskh (Markazi), the hand the manuscripts of Kashan and
   Yazd were written in; the UI stays in Vazirmatn.

   Shape rule: surfaces are square; the two toggles keep the design
   system's pill. Nothing else is rounded.
   ───────────────────────────────────────────────────────────── */
[data-theme="avand"] {
  --bg: #f2f4f1;
  --bg-alt: #f8f9f7;
  --surface: #f8f9f7;
  --surface-alt: #e5e9e4;
  --ink: #15181a;
  --ink-muted: #4c5358;
  --ink-faint: #5a6268;
  --line: #c9cfcb;
  --line-strong: #15181a;
  --accent: #2c3e78;
  --accent-soft: #dde2f1;
  --on-accent: #f2f4f1;
  --focus: #2c3e78;
  --overlay: rgb(21 24 26 / 0.62);

  --font-fa-display: var(--fam-markazi);
  --font-fa-ui: var(--fam-vazir);
  --font-en-display: var(--fam-cormorant);
  --font-en-ui: var(--fam-manrope);
  --font-num: var(--fam-plexmono);

  --radius-media: 0px; --radius-card: 0px; --radius-control: 0px;
  --border-w: 1px;
  --shadow-1: none;
  --shadow-2: 0 18px 44px -24px rgb(21 24 26 / 0.22);
  --shadow-lift: 0 26px 60px -28px rgb(21 24 26 / 0.28);
  --hover-media-scale: 1.02;
  --gutter: 28px;
  --lh-fa-tight: 1.25;
}
@media (prefers-color-scheme: dark) {
  [data-theme="avand"] {
    --bg: #161a1c;
    --bg-alt: #1b2022;
    --surface: #1b2022;
    --surface-alt: #1f2427;
    --ink: #eceeeb;
    --ink-muted: #b4bab7;
    --ink-faint: #9aa19e;
    --line: #343b3f;
    --line-strong: #eceeeb;
    --accent: #9fb0e6;
    --accent-soft: #263050;
    --on-accent: #0f1320;
    --focus: #9fb0e6;
    --overlay: rgb(8 10 12 / 0.74);
    --shadow-2: 0 18px 44px -24px rgb(0 0 0 / 0.6);
    --shadow-lift: 0 26px 60px -28px rgb(0 0 0 / 0.7);
  }
}

html, body { overflow-x: clip; }
body { background: var(--bg); }

.skip {
  position: absolute; inset-block-start: -100%; inset-inline-start: var(--s-4);
  padding: var(--s-3) var(--s-4); background: var(--accent); color: var(--on-accent);
  z-index: 100;
}
.skip:focus { inset-block-start: var(--s-3); }

/* ── shell ───────────────────────────────────────────────── */
.av-wrap { max-width: var(--page-max); margin-inline: auto; padding-inline: var(--page-pad); }
.av-section { padding-block: var(--s-9); }
.av-section + .av-section { border-block-start: var(--border-w) solid var(--line); }
.av-section--flush { padding-block: 0; border: 0; }

/* Section header: the category name, in the display hand, and one
   line about the material. No eyebrow, no number. */
.av-head { display: grid; gap: var(--s-2); margin-block-end: var(--s-7); max-width: 60ch; }
.av-head h2 { font-size: var(--t-2xl); font-weight: var(--w-regular); line-height: 1.1; }
.av-head p { margin: 0; font-size: var(--t-base); color: var(--ink-muted); }

/* The name of the arrangement each section uses. Hidden unless review
   mode is on; then it sits as a small caption after the section. */
.av-caption {
  display: none; margin-block-start: var(--s-6);
  font-family: var(--font-num); font-size: var(--t-sm); color: var(--ink-faint);
  direction: ltr; text-align: start;
}
:root[data-review="on"] .av-caption { display: block; }

/* ── toolbar ─────────────────────────────────────────────── */
.av-bar {
  position: sticky; inset-block-start: 0; z-index: 30;
  display: flex; align-items: center; gap: var(--s-4);
  min-height: 60px; padding: var(--s-2) var(--page-pad);
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-block-end: var(--border-w) solid var(--line);
}
@supports not (backdrop-filter: blur(1px)) { .av-bar { background: var(--bg); } }
@media (prefers-reduced-transparency: reduce) { .av-bar { background: var(--bg); backdrop-filter: none; } }
.av-bar__mark { font-family: var(--font-fa-display); font-size: var(--t-lg); line-height: 1; }
[dir="ltr"] .av-bar__mark { font-family: var(--font-en-display); }
.av-bar__sep { flex: 1; }
.av-bar .cat-btn, .av-bar .cat-chip { white-space: nowrap; }
.av-review { display: none; }
@media (min-width: 720px) { .av-review { display: inline-flex; } }
.av-review[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.av-inq { position: relative; }
.av-inq__n {
  display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding-inline: 6px;
  font-family: var(--font-num); font-size: var(--t-xs); line-height: 1;
  background: var(--accent); color: var(--on-accent); border-radius: var(--radius-pill);
}
.av-inq__n:empty { display: none; }

/* ── cover: the annotated piece ──────────────────────────── */
/* Wide: the piece holds the inline-start column for the full height, the
   masthead and its notes stack beside it. Narrow: masthead, then the
   piece, then the notes it refers to, in reading order. */
.av-cover {
  display: grid; gap: var(--s-6) var(--s-8);
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas: "piece text" "piece notes";
  align-items: start; padding-block: var(--s-8) var(--s-9);
}
.av-cover__text { grid-area: text; display: grid; gap: var(--s-5); align-content: start; }
.av-piece { grid-area: piece; }
.av-notes { grid-area: notes; }
@media (max-width: 800px) {
  .av-cover { grid-template-columns: 1fr; grid-template-rows: auto; grid-template-areas: "text" "piece" "notes"; }
}
.av-brand {
  font-family: var(--font-fa-display); font-weight: var(--w-regular);
  font-size: var(--t-3xl); line-height: 0.95; letter-spacing: -0.01em;
}
[dir="ltr"] .av-brand { font-family: var(--font-en-display); }
.av-season { font-size: var(--t-md); color: var(--ink-muted); }
.av-lede { margin: 0; font-size: var(--t-md); line-height: 1.8; color: var(--ink); max-width: 40ch; }

/* The image is kept at the artwork's own 4:5 so the hotspot
   coordinates, written for that frame, land on the parts they name. */
.av-piece { display: grid; gap: var(--s-4); }
.av-piece__frame { position: relative; aspect-ratio: var(--ratio-media); background: var(--surface-alt); }
.av-piece__frame .av-media { position: absolute; inset: 0; aspect-ratio: auto; }
.av-dot {
  position: absolute; z-index: 2; width: 30px; height: 30px; margin: -15px 0 0 -15px; padding: 0;
  display: grid; place-items: center; cursor: pointer;
  font-family: var(--font-num); font-size: 12px;
  background: var(--accent); color: var(--on-accent);
  border: 2px solid var(--bg); border-radius: var(--radius-pill);
  transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.av-dot::after {
  content: ""; position: absolute; inset: -6px; border-radius: inherit;
  border: 1px solid var(--accent); opacity: 0.5;
  transition: inset var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out);
}
.av-dot:hover, .av-dot[aria-pressed="true"] { transform: scale(1.12); }
.av-dot[aria-pressed="true"]::after { inset: -10px; opacity: 1; }
.av-dot:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.av-notes { display: grid; gap: 0; border-block-start: var(--border-w) solid var(--line); }
.av-note {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--s-4); align-items: baseline;
  padding-block: var(--s-4); border-block-end: var(--border-w) solid var(--line);
  background: none; border-inline: 0; border-block-start: 0; text-align: start; font: inherit; color: inherit;
  cursor: pointer; transition: background var(--dur-fast) var(--ease-out);
}
.av-note:hover { background: var(--surface-alt); }
.av-note[aria-pressed="true"] { background: var(--accent-soft); }
.av-note:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.av-note__n { font-family: var(--font-num); font-size: var(--t-sm); color: var(--accent); }
.av-note__t { font-family: var(--font-fa-display); font-size: var(--t-lg); line-height: 1.2; }
[dir="ltr"] .av-note__t { font-family: var(--font-en-display); }
.av-note__b { grid-column: 2; margin: 0; font-size: var(--t-sm); color: var(--ink-muted); }
.av-piece__actions { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }

/* ── shared product atoms ────────────────────────────────── */
.av-media {
  position: relative; overflow: hidden;
  aspect-ratio: var(--ratio-media);
  background: var(--surface-alt);
}
.av-media--wide { aspect-ratio: 3 / 2; }
.av-media--square { aspect-ratio: 1; }
.av-media--tall { aspect-ratio: 2 / 3; }
/* The kit's badge on every image is an affordance, not a label. On a
   pointer device it waits for hover or focus; on touch it stays. */
@media (hover: hover) {
  .ck-cue { opacity: 0; }
  .ck-media:hover .ck-cue, .ck-media:focus-visible .ck-cue { opacity: 1; }
}

.av-name { font-family: var(--font-fa-display); font-weight: var(--w-regular); font-size: var(--t-lg); line-height: 1.2; }
[dir="ltr"] .av-name { font-family: var(--font-en-display); font-weight: var(--w-medium); }
.av-name--xl { font-size: var(--t-2xl); }
/* The other language's name runs in its own direction but lines up with
   the page's start edge, not its own: start-aligned Latin in an RTL cell
   would drift to the far left of the cell. */
.av-alt {
  font-family: var(--font-en-ui); font-size: var(--t-sm); color: var(--ink-muted);
  letter-spacing: var(--tracking-en); direction: ltr; text-align: right;
}
[dir="ltr"] .av-alt { font-family: var(--font-fa-ui); direction: rtl; text-align: left; }
.av-copy { margin: 0; font-size: var(--t-base); color: var(--ink-muted); line-height: var(--lh-fa-body); max-width: var(--measure-fa); }
.av-copy--sm { font-size: var(--t-sm); }
.av-line { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4); padding-block-start: var(--s-3); }
.av-price { font-family: var(--font-num); font-size: var(--t-md); color: var(--ink); }
.av-price small { font-size: var(--t-xs); color: var(--ink-muted); margin-inline-start: var(--s-1); }
.av-code { font-family: var(--font-num); font-size: var(--t-sm); color: var(--ink-faint); direction: ltr; }
.av-spec { display: grid; gap: var(--s-1); font-size: var(--t-sm); color: var(--ink-muted); }
.av-spec > div { display: flex; gap: var(--s-3); }
.av-spec dt { min-width: 8ch; color: var(--ink-faint); }
.av-spec dd { margin: 0; font-family: var(--font-num); color: var(--ink); }
.av-add { min-height: 40px; padding-inline: var(--s-4); font-size: var(--t-sm); }
.av-add[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ── categories: single column bands ─────────────────────── */
.c-cats { display: grid; }
.c-cats__row {
  display: grid; gap: var(--s-6); grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  align-items: center; padding-block: var(--s-6);
  border-block-start: var(--border-w) solid var(--line);
}
.c-cats__row:first-child { border-block-start: 0; padding-block-start: 0; }
.c-cats__text { display: grid; gap: var(--s-2); }
.c-cats__title { font-family: var(--font-fa-display); font-weight: var(--w-regular); font-size: var(--t-xl); line-height: 1.15; }
[dir="ltr"] .c-cats__title { font-family: var(--font-en-display); }
.c-cats__media { aspect-ratio: 16 / 7; }
.c-cats__link { font-size: var(--t-sm); }
@media (max-width: 720px) { .c-cats__row { grid-template-columns: 1fr; } }

/* ── grid of three ───────────────────────────────────────── */
.c-grid { display: grid; gap: var(--gutter); grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.c-grid__item { display: grid; gap: var(--s-3); align-content: start; }

/* ── image beside text, two rows ─────────────────────────── */
.c-side { display: grid; gap: var(--s-8); }
.c-side__item { display: grid; gap: var(--s-6); align-items: center; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.c-side__item:nth-child(even) > .c-side__media { order: 2; }
.c-side__text { display: grid; gap: var(--s-4); }
@media (max-width: 760px) {
  .c-side__item { grid-template-columns: 1fr; }
  .c-side__item:nth-child(even) > .c-side__media { order: 0; }
}

/* ── full-bleed band ─────────────────────────────────────── */
.c-band { display: grid; align-items: center; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--surface-alt); }
.c-band__media { aspect-ratio: 4 / 3; }
.c-band__text { display: grid; gap: var(--s-4); padding: var(--s-8) var(--page-pad); }
@media (max-width: 760px) { .c-band { grid-template-columns: 1fr; } }

/* ── large image with a notes column ─────────────────────── */
.c-study { display: grid; gap: var(--s-7); grid-template-columns: minmax(0, 1fr) 30ch; align-items: start; }
.c-study__media { aspect-ratio: 16 / 10; }
.c-study__aside { display: grid; gap: var(--s-5); position: sticky; inset-block-start: calc(60px + var(--s-4)); }
.c-study__list { display: grid; gap: var(--s-3); }
.c-study__entry { display: grid; gap: 2px; }
.c-study__entry + .c-study__entry { padding-block-start: var(--s-3); border-block-start: var(--border-w) solid var(--line); }
@media (max-width: 860px) { .c-study { grid-template-columns: 1fr; } .c-study__aside { position: static; } }

/* ── two column ──────────────────────────────────────────── */
.c-duo { display: grid; gap: var(--gutter) var(--s-7); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.c-duo__item { display: grid; gap: var(--s-3); align-content: start; }
@media (max-width: 620px) { .c-duo { grid-template-columns: 1fr; } }

/* ── text over image ─────────────────────────────────────── */
.c-over { display: grid; gap: var(--gutter); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.c-over__item { position: relative; isolation: isolate; }
.c-over__item .av-media { aspect-ratio: 3 / 4; }
.c-over__text {
  position: absolute; inset-inline: 0; inset-block-end: 0; z-index: 1; pointer-events: none;
  display: grid; gap: var(--s-1); padding: var(--s-5);
  color: #f2f4f1;
  background: linear-gradient(to top, rgb(21 24 26 / 0.78), rgb(21 24 26 / 0) 90%);
}
.c-over__text .av-name, .c-over__text .av-price { color: inherit; }
.c-over__text .av-alt, .c-over__text .av-price small { color: rgb(242 244 241 / 0.78); }

/* ── image over text, single column ──────────────────────── */
.c-read { display: grid; gap: var(--s-9); justify-items: center; }
.c-read__item { display: grid; gap: var(--s-4); width: 100%; max-width: 64ch; }
.c-read__media { aspect-ratio: 3 / 2; }

/* ── two-page spread ─────────────────────────────────────── */
.c-spread { display: grid; grid-template-columns: 1fr 1fr; border: var(--border-w) solid var(--line-strong); background: var(--surface); }
.c-spread__page { padding: var(--s-6); display: grid; gap: var(--s-5); align-content: start; }
.c-spread__page + .c-spread__page { border-inline-start: var(--border-w) solid var(--line-strong); }
.c-spread__head { display: flex; justify-content: space-between; gap: var(--s-4); font-family: var(--font-num); font-size: var(--t-sm); color: var(--ink-faint); }
.c-spread__grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-5); }
.c-spread__cell { display: grid; gap: var(--s-2); }
.c-spread__cell:first-child { grid-column: span 2; }
.c-spread__cell:first-child .av-media { aspect-ratio: 3 / 2; }
.c-spread__folio { font-family: var(--font-num); font-size: var(--t-sm); color: var(--ink-faint); text-align: center; padding-block-start: var(--s-3); border-block-start: var(--border-w) solid var(--line); }
@media (max-width: 760px) {
  .c-spread { grid-template-columns: 1fr; }
  .c-spread__page + .c-spread__page { border-inline-start: 0; border-block-start: var(--border-w) solid var(--line-strong); }
}

/* ── horizontal strip ────────────────────────────────────── */
.c-strip {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 22vw);
  gap: var(--gutter); overflow-x: auto; scroll-snap-type: x proximity;
  padding-block-end: var(--s-4); scrollbar-width: thin;
}
.c-strip__item { scroll-snap-align: start; display: grid; gap: var(--s-3); align-content: start; }

/* ── index, grouped by category ──────────────────────────── */
.c-index { display: grid; gap: var(--s-7); }
.c-index__group { display: grid; gap: var(--s-3); }
.c-index__cat { font-family: var(--font-fa-display); font-weight: var(--w-regular); font-size: var(--t-lg); padding-block-end: var(--s-2); border-block-end: var(--border-w) solid var(--line-strong); }
[dir="ltr"] .c-index__cat { font-family: var(--font-en-display); }
.c-index__row {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto; gap: var(--s-4); align-items: center;
  padding-block: var(--s-2);
}
.c-index__row .av-media { aspect-ratio: 1; }
.c-index__name { display: grid; gap: 1px; }
.c-index__name .av-name { font-size: var(--t-base); }
.c-index__name .av-alt { font-size: var(--t-xs); }
@media (max-width: 600px) { .c-index__row { grid-template-columns: 48px minmax(0, 1fr) auto; } .c-index__row .av-code { display: none; } }

/* ── order rows ──────────────────────────────────────────── */
.c-order { display: grid; }
.c-order__note { margin: 0 0 var(--s-6); font-size: var(--t-base); color: var(--ink-muted); max-width: 60ch; }
.c-order__row {
  display: grid; gap: var(--s-5); align-items: center;
  grid-template-columns: 96px minmax(0, 1fr) auto;
  padding-block: var(--s-4);
}
.c-order__row + .c-order__row { border-block-start: var(--border-w) solid var(--line); }
.c-order__row .av-media { aspect-ratio: 1; }
.c-order__text { display: grid; gap: var(--s-1); }
.c-order__end { display: grid; gap: var(--s-2); justify-items: end; }
@media (max-width: 640px) {
  .c-order__row { grid-template-columns: 72px minmax(0, 1fr); }
  .c-order__end { grid-column: 2; justify-items: start; }
}

/* ── colophon ────────────────────────────────────────────── */
.av-colophon { display: grid; gap: var(--s-6); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); padding-block: var(--s-8) var(--s-10); border-block-start: var(--border-w) solid var(--line); }
.av-colophon h3 { font-family: var(--font-fa-display); font-weight: var(--w-regular); font-size: var(--t-md); margin-block-end: var(--s-2); }
[dir="ltr"] .av-colophon h3 { font-family: var(--font-en-display); }
.av-colophon p { margin: 0; font-size: var(--t-sm); color: var(--ink-muted); max-width: 36ch; }

/* ── inquiry sheet ───────────────────────────────────────── */
.av-sheet { display: grid; gap: var(--s-5); }
.av-sheet__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4); }
.av-sheet__head h2 { font-size: var(--t-xl); font-weight: var(--w-regular); }
.av-sheet__row { grid-template-columns: 56px minmax(0, 1fr) auto; }
.av-sheet__row .av-media { aspect-ratio: 1; }
.av-sheet__foot { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; justify-content: space-between; padding-block-start: var(--s-4); border-block-start: var(--border-w) solid var(--line); }
.av-sheet__total { font-family: var(--font-num); font-size: var(--t-md); }
.av-sheet__total small { font-size: var(--t-xs); color: var(--ink-muted); margin-inline-start: var(--s-1); }

/* ─────────────────────────────────────────────────────────────
   Motion. One quiet entrance for most things; three exceptions
   the content asks for: the cover's notes arrive in order, the
   spread turns on its spine, and a wide picture is unveiled rather
   than faded. Only under .js, and gone under reduced motion.
   ───────────────────────────────────────────────────────────── */
.js .rv { opacity: 0; transition-delay: calc(var(--i, 0) * var(--stagger)); }
.js .rv.in { opacity: 1; }

.js .rv--rise { transform: translateY(16px); transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); }
.js .rv--rise.in { transform: none; }

let lang = 'fa';
const root = document.documentElement;
const main = document.getElementById('main');
const inquiry = new Set();

const t = () => S[lang];
const fa = () => lang === 'fa';
const name = (p) => fa() ? p.fa : p.en;
const alt = (p) => fa() ? p.en : p.fa;
const copy = (p) => fa() ? p.faCopy : p.enCopy;
const price = (p) => fa() ? p.price : p.priceEn;
const specs = (p) => fa() ? p.faSpec : p.enSpec;
const num = (n) => fa() ? CatalogKit.toFa(String(n)) : String(n);
const byCat = (id) => PRODUCTS.filter((p) => p.cat === id);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function hotspots(p) {
  return p.hot.map((h) => ({ x: h.x, y: h.y, title: (fa() ? h.fa : h.en)[0], body: (fa() ? h.fa : h.en)[1] }));
}

function mediaSet(p) {
  return CatalogKit.defaultMedia(p.code, hotspots(p), { subject: p.subject, palette: p.palette });
}

/* Every occurrence of a piece gets its own mount, so the same piece can
   sit in several arrangements without them sharing state. */
function media(p, modifier) {
  const box = el('div', 'av-media' + (modifier ? ' av-media--' + modifier : ''));
  queueMicrotask(() => CatalogKit.mountMedia(box, mediaSet(p), { title: name(p), sku: p.code }, lang));
  return box;
}

function nameBlock(p, size) {
  const frag = document.createDocumentFragment();
  frag.append(el('h3', 'av-name' + (size ? ' av-name--' + size : ''), name(p)), el('div', 'av-alt', alt(p)));
  return frag;
}

function priceEl(p) {
  const n = el('div', 'av-price');
  n.append(document.createTextNode(price(p)), el('small', null, t().unit));
  return n;
}

function line(p) {
  const n = el('div', 'av-line');
  n.append(priceEl(p), el('div', 'av-code', p.code));
  return n;
}

function specList(p) {
  const dl = el('dl', 'av-spec');
  for (const [k, v] of specs(p)) {
    const row = el('div');
    row.append(el('dt', null, k), el('dd', null, v));
    dl.appendChild(row);
  }
  return dl;
}

function addButton(p) {
  const b = el('button', 'cat-btn cat-btn--ghost av-add');
  b.type = 'button';
  b.dataset.code = p.code;
  syncAdd(b);
  b.addEventListener('click', () => {
    if (inquiry.has(p.code)) inquiry.delete(p.code); else inquiry.add(p.code);
    syncInquiry();
  });
  return b;
}

function syncAdd(b) {
  const on = inquiry.has(b.dataset.code);
  b.setAttribute('aria-pressed', String(on));
  b.textContent = on ? t().added : t().add;
}

function syncInquiry() {
  for (const b of document.querySelectorAll('.av-add')) syncAdd(b);
  document.getElementById('inq-n').textContent = inquiry.size ? num(inquiry.size) : '';
  if (sheet.open) renderSheet();
}

/* ── the cover ───────────────────────────────────────────── */
function cover() {
  const p = PRODUCTS[0];
  const wrap = el('section', 'av-cover av-wrap');

  const text = el('div', 'av-cover__text');
  text.append(el('h1', 'av-brand', t().brand), el('div', 'av-season', t().season), el('p', 'av-lede', t().lede));

  const notes = el('div', 'av-notes');
  const dots = [];
  const noteEls = [];
  const select = (i) => {
    for (const [j, d] of dots.entries()) d.setAttribute('aria-pressed', String(i === j));
    for (const [j, n] of noteEls.entries()) n.setAttribute('aria-pressed', String(i === j));
  };
  p.hot.forEach((h, i) => {
    const pair = fa() ? h.fa : h.en;
    const n = el('button', 'av-note rv rv--rise');
    n.type = 'button';
    n.setAttribute('aria-pressed', 'false');
    n.style.setProperty('--i', i + 2);
    n.append(el('span', 'av-note__n', num(i + 1)), el('span', 'av-note__t', pair[0]), el('p', 'av-note__b', pair[1]));
    n.addEventListener('click', () => select(n.getAttribute('aria-pressed') === 'true' ? -1 : i));
    noteEls.push(n);
    notes.appendChild(n);
  });
  text.append(el('div', 'av-code', t().pieceOf));

  const piece = el('div', 'av-piece');
  const frame = el('div', 'av-piece__frame rv rv--wipe');
  frame.appendChild(media(p, null));
  p.hot.forEach((h, i) => {
    const d = el('button', 'av-dot rv rv--dot', num(i + 1));
    d.type = 'button';
    d.setAttribute('aria-pressed', 'false');
    d.setAttribute('aria-label', (fa() ? h.fa : h.en)[0]);
    d.style.left = h.x + '%';
    d.style.top = h.y + '%';
    d.style.setProperty('--i', i + 3);
    d.addEventListener('click', (e) => { e.stopPropagation(); select(d.getAttribute('aria-pressed') === 'true' ? -1 : i); });
    dots.push(d);
    frame.appendChild(d);
  });
  const actions = el('div', 'av-piece__actions');
  const open = el('button', 'cat-btn', t().open);
  open.type = 'button';
  open.addEventListener('click', () => CatalogKit.open(mediaSet(p), { title: name(p), sku: p.code }, lang, 0));
  actions.append(open, addButton(p), el('span', 'av-code', p.code));
  const caption = el('div', 'av-line');
  caption.append(el('h2', 'av-name', name(p)), priceEl(p));
  piece.append(frame, caption, actions);

  wrap.append(text, piece, notes);
  return wrap;
}

/* ── arrangements, each with the job it does here ────────── */
function section(title, note, body, arrangement) {
  const s = el('section', 'av-section av-wrap');
  const head = el('div', 'av-head rv rv--rise');
  head.appendChild(el('h2', null, title));
  if (note) head.appendChild(el('p', null, note));
  s.append(head, body, el('div', 'av-caption', arrangement));
  return s;
}

function categories() {
  const wrap = el('div', 'c-cats');
  CATEGORIES.forEach((cat, i) => {
    const row = el('div', 'c-cats__row');
    const text = el('div', 'c-cats__text rv rv--side');
    text.style.setProperty('--i', 0);
    const a = el('a', 'c-cats__link', t().seeAll);
    a.href = '#' + cat.id;
    text.append(el('h3', 'c-cats__title', fa() ? cat.fa : cat.en), el('p', 'av-copy', fa() ? cat.faNote : cat.enNote), a);
    const m = media(byCat(cat.id)[0], null);
    m.classList.add('c-cats__media', 'rv', 'rv--wipe');
    row.append(text, m);
    wrap.appendChild(row);
  });
  return wrap;
}

function gridOf(items) {
  const wrap = el('div', 'c-grid');
  items.forEach((p, i) => {
    const item = el('div', 'c-grid__item rv rv--pop');
    item.style.setProperty('--i', i);
    item.append(media(p), nameBlock(p), el('p', 'av-copy av-copy--sm', copy(p)), line(p), addButton(p));
    wrap.appendChild(item);
  });
  return wrap;
}

function sideBySide(items) {
  const wrap = el('div', 'c-side');
  for (const p of items) {
    const item = el('div', 'c-side__item');
    const m = media(p, 'wide');
    m.classList.add('c-side__media', 'rv', 'rv--rise');
    const text = el('div', 'c-side__text');
    text.append(nameBlock(p, 'xl'), el('p', 'av-copy', copy(p)), specList(p), line(p), addButton(p));
    [...text.children].forEach((c, i) => { c.classList.add('rv', 'rv--rise'); c.style.setProperty('--i', i); });
    item.append(m, text);
    wrap.appendChild(item);
  }
  return wrap;
}

function band(p) {
  const wrap = el('div', 'c-band');
  const m = media(p, null);
  m.classList.add('c-band__media', 'rv', 'rv--wipe');
  const text = el('div', 'c-band__text');
  text.append(nameBlock(p, 'xl'), el('p', 'av-copy', copy(p)), specList(p), line(p), addButton(p));
  [...text.children].forEach((c, i) => { c.classList.add('rv', 'rv--rise'); c.style.setProperty('--i', i); });
  wrap.append(m, text);
  return wrap;
}

function study(p) {
  const wrap = el('div', 'c-study');
  const m = media(p, null);
  m.classList.add('c-study__media', 'rv', 'rv--wipe');
  const aside = el('div', 'c-study__aside');
  aside.append(nameBlock(p), el('p', 'av-copy av-copy--sm', copy(p)));
  const list = el('div', 'c-study__list');
  specs(p).forEach(([k, v], i) => {
    const entry = el('div', 'c-study__entry rv rv--rise');
    entry.style.setProperty('--i', i + 1);
    entry.append(el('div', 'av-code', k), el('div', null, v));
    list.appendChild(entry);
  });
  aside.append(list, line(p), addButton(p));
  wrap.append(m, aside);
  return wrap;
}

function duo(items) {
  const wrap = el('div', 'c-duo');
  items.forEach((p, i) => {
    const item = el('div', 'c-duo__item rv rv--pop');
    item.style.setProperty('--i', i);
    item.append(media(p, 'wide'), nameBlock(p), el('p', 'av-copy av-copy--sm', copy(p)), line(p), addButton(p));
    wrap.appendChild(item);

  return wrap;
}

function overlay(items) {
  const wrap = el('div', 'c-over');
  items.forEach((p, i) => {
    const item = el('div', 'c-over__item');
    const m = media(p, null);
    m.classList.add('rv', 'rv--wipe-up');
    m.style.setProperty('--i', i);
    const text = el('div', 'c-over__text rv rv--rise');
    text.style.setProperty('--i', i + 1);
    text.append(nameBlock(p), priceEl(p));
    item.append(m, text);
    wrap.appendChild(item);

  return wrap;

function reading(items) {
  const wrap = el('div', 'c-read');
  for (const p of items) {
    const item = el('div', 'c-read__item');
    const m = media(p, null);
    m.classList.add('c-read__media', 'rv', 'rv--rise');
    item.append(m, nameBlock(p, 'xl'), el('p', 'av-copy', copy(p)), specList(p), line(p), addButton(p));
    [...item.children].slice(1).forEach((c, i) => { c.classList.add('rv', 'rv--rise'); c.style.setProperty('--i', i + 1); });
    wrap.appendChild(item);
  }
  return wrap;

/* Two facing pages, one category each. Three pieces fill a page with the
   first set wide, so no cell is ever empty. */
function spread() {
  const wrap = el('div', 'c-spread');
  ['wood', 'textile'].forEach((id, i) => {
    const items = byCat(id);
    const cat = CATEGORIES.find((c) => c.id === id);
    const page = el('div', 'c-spread__page rv rv--page');
    page.style.setProperty('--i', i);
    const head = el('div', 'c-spread__head');
    head.append(el('span', null, t().running), el('span', null, fa() ? cat.fa : cat.en));
    const grid = el('div', 'c-spread__grid');
    for (const p of items) {
      const cell = el('div', 'c-spread__cell');
      cell.append(media(p), nameBlock(p), el('div', 'av-code', p.code));
      grid.appendChild(cell);
    }
    page.append(head, grid, el('div', 'c-spread__folio', t().pageNo + ' ' + num(i + 12)));
    wrap.appendChild(page);
  });
  return wrap;
}

function strip() {
  const wrap = el('div', 'c-strip');
  PRODUCTS.forEach((p, i) => {
    const item = el('div', 'c-strip__item rv rv--side');
    item.style.setProperty('--i', Math.min(i, 8));
    item.append(media(p, 'tall'), nameBlock(p), line(p));
    wrap.appendChild(item);
  });
  return wrap;
}

function index() {
  const wrap = el('div', 'c-index');
  for (const cat of CATEGORIES) {
    const group = el('div', 'c-index__group rv rv--rise');
    group.appendChild(el('h3', 'c-index__cat', fa() ? cat.fa : cat.en));
    for (const p of byCat(cat.id)) {
      const row = el('div', 'c-index__row');
      const n = el('div', 'c-index__name');
      n.append(el('div', 'av-name', name(p)), el('div', 'av-alt', alt(p)));
      row.append(media(p, 'square'), n, el('div', 'av-code', p.code), priceEl(p));
      group.appendChild(row);
    }
    wrap.appendChild(group);
  }
  return wrap;
}

function order() {
  const wrap = el('div', 'c-order');
  PRODUCTS.forEach((p, i) => {
    const row = el('div', 'c-order__row rv rv--rise');
    row.style.setProperty('--i', Math.min(i, 8));
    const text = el('div', 'c-order__text');
    text.append(nameBlock(p), el('div', 'av-code', p.code));
    const end = el('div', 'c-order__end');
    end.append(priceEl(p), addButton(p));
    row.append(media(p, 'square'), text, end);
    wrap.appendChild(row);
  });
  return wrap;

function colophon() {
  const f = el('footer', 'av-colophon av-wrap');
  for (const k of ['cMat', 'cCare', 'cLot', 'cShop']) {
    const d = el('div', 'rv rv--rise');
    d.append(el('h3', null, t()[k]), el('p', null, t()[k + 'V']));
    f.appendChild(d);
  }
  return f;
}

/* ── inquiry sheet ───────────────────────────────────────── */
const sheet = { open: false, scrim: null, box: null, lastFocus: null };

function openSheet() {
  if (sheet.open) return;
  sheet.lastFocus = document.activeElement;
  sheet.scrim = el('div', 'cat-scrim');
  sheet.box = el('div', 'cat-dialog av-sheet');
  sheet.box.setAttribute('role', 'dialog');
  sheet.box.setAttribute('aria-modal', 'true');
  sheet.box.setAttribute('aria-label', t().sheetTitle);
  sheet.box.tabIndex = -1;
  document.body.append(sheet.scrim, sheet.box);
  sheet.scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', onSheetKey);
  sheet.open = true;
  renderSheet();
  sheet.box.focus();
}

function closeSheet() {
  if (!sheet.open) return;
  sheet.scrim.remove(); sheet.box.remove();
  document.removeEventListener('keydown', onSheetKey);
  sheet.open = false;
  if (sheet.lastFocus && sheet.lastFocus.focus) sheet.lastFocus.focus();
}

function onSheetKey(e) {
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (e.key !== 'Tab') return;
  const f = sheet.box.querySelectorAll('button');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function renderSheet() {
  const box = sheet.box;
  box.innerHTML = '';
  const head = el('div', 'av-sheet__head');
  const close = el('button', 'cat-btn cat-btn--ghost', t().close);
  close.type = 'button';
  close.addEventListener('click', closeSheet);
  head.append(el('h2', null, t().sheetTitle), close);
  box.appendChild(head);

  const items = PRODUCTS.filter((p) => inquiry.has(p.code));
  if (!items.length) {
    box.appendChild(el('div', 'cat-inquiry__empty', t().sheetEmpty));
    return;
  }
  const list = el('div', 'cat-inquiry');
  let total = 0;
  for (const p of items) {
    total += parseInt(p.priceEn.replace(/,/g, ''), 10);
    const row = el('div', 'cat-inquiry__row av-sheet__row');
    const n = el('div');
    n.append(el('div', 'av-name', name(p)), el('div', 'av-code', p.code));
    const rm = el('button', 'cat-btn cat-btn--quiet', t().remove);
    rm.type = 'button';
    rm.setAttribute('aria-label', t().remove + ' ' + name(p));
    rm.addEventListener('click', () => { inquiry.delete(p.code); syncInquiry(); });
    row.append(media(p, 'square'), n, rm);
    list.appendChild(row);
  }
  box.appendChild(list);

  const foot = el('div', 'av-sheet__foot');
  const sum = el('div', 'av-sheet__total');
  const formatted = total.toLocaleString('en-US');
  sum.append(document.createTextNode(t().total + ' ' + (fa() ? CatalogKit.toFa(formatted).replace(/,/g, '٬') : formatted)), el('small', null, t().unit));
  const send = el('a', 'cat-btn', t().send);
  send.href = 'mailto:order@avand.example?subject=' + encodeURIComponent(t().sheetTitle) +
    '&body=' + encodeURIComponent(items.map((p) => p.code + ' ' + name(p)).join('\n'));
  foot.append(sum, send);
  box.appendChild(foot);
}

/* ── reveals ─────────────────────────────────────────────── */
let observer = null;
function reveals() {
  if (!('IntersectionObserver' in window)) return;
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      e.target.classList.add('in');
      observer.unobserve(e.target);
    }
  }, { rootMargin: '0px 0px -10% 0px', threshold: 0.05 });
  for (const n of document.querySelectorAll('.rv')) observer.observe(n);
}

/* ── render ──────────────────────────────────────────────── */
function render() {
  main.innerHTML = '';
  const tt = t();
  const cat = (id) => CATEGORIES.find((c) => c.id === id);
  const catTitle = (id) => fa() ? cat(id).fa : cat(id).en;
  const catNote = (id) => fa() ? cat(id).faNote : cat(id).enNote;

  main.appendChild(cover());
  main.appendChild(section(tt.catsTitle, tt.catsNote, categories(), 'single column, category bands'));

  const ceramics = section(catTitle('ceramic'), catNote('ceramic'), gridOf(byCat('ceramic')), 'three-column grid');
  ceramics.id = 'ceramic';
  main.appendChild(ceramics);

  const wood = section(catTitle('wood'), catNote('wood'), sideBySide(byCat('wood').slice(0, 2)), 'image beside text, alternating');
  wood.id = 'wood';
  main.appendChild(wood);
  const tray = el('section', 'av-section av-section--flush');
  tray.append(band(byCat('wood')[2]), el('div', 'av-caption av-wrap', 'full-bleed band'));
  main.appendChild(tray);

  const textile = section(catTitle('textile'), catNote('textile'), study(byCat('textile')[0]), 'large image with notes column');
  textile.id = 'textile';
  main.appendChild(textile);
  const moreTextile = el('section', 'av-section av-wrap');
  moreTextile.append(duo(byCat('textile').slice(1)), el('div', 'av-caption', 'two column'));
  main.appendChild(moreTextile);

  const light = section(catTitle('light'), catNote('light'), overlay(byCat('light')), 'text over image');
  light.id = 'light';
  main.appendChild(light);

  const leather = section(catTitle('leather'), catNote('leather'), reading(byCat('leather')), 'image over text, single column');
  leather.id = 'leather';
  main.appendChild(leather);

  main.appendChild(section(tt.editionTitle, tt.editionNote, spread(), 'two-page spread'));
  main.appendChild(section(tt.allTitle, tt.allNote, strip(), 'horizontal strip'));
  main.appendChild(section(tt.indexTitle, tt.indexNote, index(), 'grouped index'));

  const ord = section(tt.orderTitle, null, order(), 'rows with actions');
  ord.querySelector('.av-head').appendChild(el('p', 'c-order__note', tt.orderNote));
  main.appendChild(ord);

  main.appendChild(colophon());

  for (const node of document.querySelectorAll('[data-t]')) node.textContent = tt[node.dataset.t];
  syncInquiry();
  reveals();
}

document.getElementById('lang').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  for (const other of btn.parentNode.children) other.setAttribute('aria-pressed', String(other === btn));
  root.lang = lang;
  root.dir = fa() ? 'rtl' : 'ltr';
  document.title = fa() ? 'آوند، مجموعه‌ی پاییز ۱۴۰۴' : 'Âvand, Autumn 1404 collection';
  render();
});

document.getElementById('inq-open').addEventListener('click', openSheet);

/* Review mode names the arrangement under each section. Remembered per
   browser so a reviewer does not re-enable it on every visit. */
const review = document.getElementById('review');
function setReview(on) {
  root.dataset.review = on ? 'on' : 'off';
  review.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('avand-review', on ? '1' : '0'); } catch (err) { /* storage unavailable */ }
}
review.addEventListener('click', () => setReview(root.dataset.review !== 'on'));
try { setReview(localStorage.getItem('avand-review') === '1'); } catch (err) { setReview(false); }

render();
</script>
</body>
